              if lobby_char:
                  lobby_char.queue_free()
              lobby_char = _build_char(SKINS[i], "pistola", false)
              lobby_root.add_child(lobby_char)
              _refresh_lobby_btns()

          func _update_lobby(delta: float) -> void:
              if lobby_char:
                  lobby_char.rotation.y += delta * 0.5
                  _animate(lobby_char.get_meta("st"), delta, 0.0)

          func _back_to_lobby() -> void:
              in_match = false
              ended = false
              if hud:
                  hud.queue_free()
                  hud = null
                  overlay = null
              if world:
                  world.queue_free()
                  world = null
              player = null
              cam = null
              bots.clear()
              _build_lobby()

          # ================= PARTIDA =================
          func _start_match() -> void:
              if lobby_ui:
                  lobby_ui.queue_free()
                  lobby_ui = null
              if lobby_root:
                  lobby_root.queue_free()
                  lobby_root = null
                  lobby_char = null
              if world:
                  world.queue_free()
              world = Node3D.new()
              add_child(world)
              _setup_env()
              zone_radius = 130.0
              zone_target = 130.0
              zone_phase = 0
              _build_map()
              _spawn_player()
              _spawn_bots()
              _build_hud()
              in_match = true
              started = false
              ended = false
              countdown = 3.0
              last_count = -1
              match_time = 0.0
              kills = 0
              reloading = 0.0
              firing = false
              fire_edge = false
              fire_id = -1
              look_id = -1
              joy_id = -1
              joy_vec = Vector2.ZERO
              weapon_idx = 0
              feed_items.clear()
              msg_text = ""
              ammo = {}
              for k in WEAPON_ORDER:
                  ammo[k] = [WEAPONS[k]["mag"], WEAPONS[k]["reserve"]]

          func _build_map() -> void:
              obstacles.clear()
              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-55, 30, 0)
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 150.0
              sun.light_energy = 1.1
              world.add_child(sun)
              _box(world, Vector3(260, 0.2, 260), Vector3(0, -0.1, 0), _grass_mat())
              _box(world, Vector3(900, 0.2, 900), Vector3(0, -0.9, 0), _water_mat())

              var walls := [Color(0.93, 0.87, 0.76), Color(0.9, 0.62, 0.4), Color(0.6, 0.8, 0.82), Color(0.82, 0.66, 0.52)]
              var roofs := [Color(0.5, 0.22, 0.16), Color(0.22, 0.23, 0.33), Color(0.4, 0.28, 0.24)]
              var glass := _m(Color(0.12, 0.18, 0.24), 0.1, 0.5, false)
              var door := _m(Color(0.35, 0.22, 0.12), 0.7, 0.0, true)
              for i in 16:
                  var p := _random_free(24.0, 105.0)
                  var w := randf_range(6.0, 11.0)
                  var d := randf_range(6.0, 11.0)
                  var h := randf_range(4.0, 7.0)
                  var wall_m := _m(walls.pick_random(), 0.85, 0.0, true)
                  _box(world, Vector3(w, h, d), Vector3(p.x, h * 0.5, p.y), wall_m)
                  _box(world, Vector3(w + 0.8, 0.6, d + 0.8), Vector3(p.x, h + 0.3, p.y), _m(roofs.pick_random(), 0.7, 0.0, true))
                  for sz in [-1.0, 1.0]:
                      for sx in [-0.28, 0.28]:
                          _box(world, Vector3(1.2, 1.1, 0.08), Vector3(p.x + sx * w, h * 0.55, p.y + sz * (d * 0.5 + 0.03)), glass)
                  _box(world, Vector3(1.1, 2.0, 0.1), Vector3(p.x, 1.0, p.y + d * 0.5 + 0.04), door)
                  _collider(Vector3(w, h, d), Vector3(p.x, h * 0.5, p.y))
                  obstacles.append(Rect2(p.x - w * 0.5 - 0.4, p.y - d * 0.5 - 0.4, w + 0.8, d + 0.8))

              var leaf_cols := [Color(0.16, 0.45, 0.2), Color(0.2, 0.52, 0.25), Color(0.13, 0.38, 0.18)]
              var trunk := _m(Color(0.36, 0.24, 0.14), 0.95, 0.0, true)
              for i in 90:
                  var p := _random_free(10.0, 118.0)
                  if not _is_free(p, 1.2):
                      continue
                  var cyl := MeshInstance3D.new()
                  var cm := CylinderMesh.new()
                  cm.top_radius = 0.16
                  cm.bottom_radius = 0.22
                  cm.height = 2.4
                  cyl.mesh = cm
                  cyl.material_override = trunk
                  cyl.position = Vector3(p.x, 1.2, p.y)
                  world.add_child(cyl)
                  _sph(world, 1.6, Vector3(p.x, 3.4, p.y), _m(leaf_cols.pick_random(), 0.9, 0.0, true))
                  _sph(world, 1.1, Vector3(p.x + 0.5, 4.1, p.y - 0.3), _m(leaf_cols.pick_random(), 0.9, 0.0, true))
                  _collider(Vector3(0.5, 2.4, 0.5), Vector3(p.x, 1.2, p.y))
                  obstacles.append(Rect2(p.x - 0.5, p.y - 0.5, 1.0, 1.0))

              var rock_m := _m(Color(0.5, 0.53, 0.56), 0.9, 0.0, true)
              for i in 40:
                  var p := _random_free(10.0, 112.0)
                  if not _is_free(p, 1.0):
                      continue
                  var r := randf_range(0.9, 1.5)
                  _sph(world, r, Vector3(p.x, r * 0.5, p.y), rock_m, Vector3(1.0, 0.7, 1.0))
                  _collider(Vector3(r * 1.8, r * 1.0, r * 1.8), Vector3(p.x, r * 0.5, p.y))
                  obstacles.append(Rect2(p.x - r * 0.9, p.y - r * 0.9, r * 1.8, r * 1.8))

              var bush_m := _m(Color(0.22, 0.5, 0.2), 0.95, 0.0, true)
              for i in 40:
                  var p := _random_free(8.0, 110.0)
                  _sph(world, randf_range(0.5, 0.8), Vector3(p.x, 0.4, p.y), bush_m, Vector3(1.0, 0.7, 1.0))

              zone_mesh = MeshInstance3D.new()
              var zc := CylinderMesh.new()
              zc.top_radius = 1.0
              zc.bottom_radius = 1.0
              zc.height = 14.0
              zone_mesh.mesh = zc
              zone_mesh.material_override = _alpha_mat(Color(1.0, 0.2, 0.25, 0.28))
              zone_mesh.position.y = 7.0
              zone_mesh.scale = Vector3(zone_radius, 1.0, zone_radius)
              world.add_child(zone_mesh)

          func _collider(size: Vector3, pos: Vector3) -> void:
              var body := StaticBody3D.new()
              var cs := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              cs.shape = bs
              body.add_child(cs)
              body.position = pos
              world.add_child(body)

          func _is_free(p: Vector2, r: float) -> bool:
              if p.length() > MAP_LIMIT - r:
                  return false
              for o in obstacles:
                  var rect: Rect2 = o
                  var cx := clampf(p.x, rect.position.x, rect.end.x)
                  var cz := clampf(p.y, rect.position.y, rect.end.y)
                  if Vector2(cx, cz).distance_to(p) < r:
                      return false
              return true

          func _random_free(minr: float, maxr: float) -> Vector2:
              var p := Vector2.ZERO
              for i in 80:
                  var a := randf() * TAU
                  var r := randf_range(minr, maxr)
                  p = Vector2(cos(a) * r, sin(a) * r)
                  if _is_free(p, 1.0):
                      break
              return p

          func _move(n: Node3D, v: Vector3) -> void:
              var p: Vector3 = n.position
              var tx := Vector2(p.x + v.x, p.z)
              if _is_free(tx, 0.45):
                  p.x = tx.x
              var tz := Vector2(p.x, p.z + v.z)
              if _is_free(tz, 0.45):
                  p.z = tz.y
              n.position = p

          func _spawn_player() -> void:
              var p := _random_free(30.0, 80.0)
              player = _build_char(SKINS[skin_index], "pistola", false)
              player.position = Vector3(p.x, 0, p.y)
              world.add_child(player)
              var st: Dictionary = player.get_meta("st")
              st["last"] = player.position
              yaw = randf() * TAU
              pitch = 0.0
              cam = Camera3D.new()
              cam.fov = 68.0
              world.add_child(cam)
              cam.current = true
              cam_first = true
              shake = 0.0

          func _spawn_bots() -> void:
              bots.clear()
              for i in NUM_BOTS:
                  var s: Dictionary = SKINS[randi() % SKINS.size()]
                  var b := _build_char(s, WEAPON_ORDER[randi() % WEAPON_ORDER.size()], true)
                  var p := _random_free(20.0, 105.0)
                  b.position = Vector3(p.x, 0, p.y)
                  world.add_child(b)
                  var st: Dictionary = b.get_meta("st")
                  st["last"] = b.position
                  st["wander"] = _random_free(10.0, 95.0)
                  st["wander_t"] = randf_range(4.0, 9.0)
                  bots.append(b)

          func _alive_bots() -> int:
              var n := 0
              for b in bots:
                  if b.get_meta("st")["alive"]:
                      n += 1
              return n

          # ================= JUGADOR =================
          func _update_player(delta: float) -> void:
              var st: Dictionary = player.get_meta("st")
              if not st["alive"]:
                  return
              var mv := joy_vec
              if Input.is_key_pressed(KEY_D):
                  mv.x += 1.0
              if Input.is_key_pressed(KEY_A):
                  mv.x -= 1.0
              if Input.is_key_pressed(KEY_W):
                  mv.y += 1.0
              if Input.is_key_pressed(KEY_S):
                  mv.y -= 1.0
              if Input.is_key_pressed(KEY_LEFT):
                  yaw += 2.5 * delta
              if Input.is_key_pressed(KEY_RIGHT):
                  yaw -= 2.5 * delta
              mv = mv.limit_length(1.0)
              var fwd := Vector3(sin(yaw), 0.0, cos(yaw))
              var right := Vector3(-cos(yaw), 0.0, sin(yaw))
              var dir := right * mv.x + fwd * mv.y
              if dir.length() > 0.01:
                  _move(player, dir * 5.5 * delta)

              var vy: float = float(st["vy"]) - 22.0 * delta
              var py: float = player.position.y + vy * delta
              if py <= 0.0:
                  py = 0.0
                  vy = 0.0
              st["vy"] = vy
              player.position.y = py
              player.rotation.y = yaw

              st["cd"] = maxf(0.0, float(st["cd"]) - delta)
              if reloading > 0.0:
                  reloading -= delta
                  if reloading <= 0.0:
                      _finish_reload()
              var wk: String = st["weapon"]
              var w: Dictionary = WEAPONS[wk]
              var wants: bool = (firing or Input.is_key_pressed(KEY_F)) and (bool(w["auto"]) or fire_edge)
              if wants and float(st["cd"]) <= 0.0 and reloading <= 0.0:
                  var a: Array = ammo[wk]
                  if a[0] > 0:
                      a[0] -= 1
                      st["cd"] = w["rate"]
                      st["recoil"] = 1.0
                      st["flash_t"] = 0.05
                      _fire(player, cam.global_position, _aim_dir(), 1.0, 1.0)
                  else:
                      _start_reload()
              fire_edge = false

          func _jump() -> void:
              if not started or not player.get_meta("st")["alive"]:
                  return
              var st: Dictionary = player.get_meta("st")
              if player.position.y <= 0.01:
                  st["vy"] = 8.5

          func _switch_weapon(i: int) -> void:
              if not started or not player.get_meta("st")["alive"]:
                  return
              weapon_idx = i
              reloading = 0.0
              _equip(player, WEAPON_ORDER[i])

          func _start_reload() -> void:
              if reloading > 0.0 or not started:
                  return
              var st: Dictionary = player.get_meta("st")
              var wk: String = st["weapon"]
              var a: Array = ammo[wk]
              if a[0] >= WEAPONS[wk]["mag"] or a[1] <= 0:
                  return
              reloading = float(WEAPONS[wk]["reload"])

          func _finish_reload() -> void:
              reloading = 0.0
              var st: Dictionary = player.get_meta("st")
              var wk: String = st["weapon"]
              var a: Array = ammo[wk]
              var take: int = min(int(WEAPONS[wk]["mag"]) - int(a[0]), int(a[1]))
              a[0] += take
              a[1] -= take

          # ================= DISPARO =================
          func _fire(shooter: CharacterBody3D, origin: Vector3, dir: Vector3, spread_mul: float, dmg_mul: float) -> void:
              var st: Dictionary = shooter.get_meta("st")
              var w: Dictionary = WEAPONS[st["weapon"]]
              var space := get_world_3d().direct_space_state
              var sp: float = float(w["spread"]) * spread_mul
              st["flash_t"] = 0.05
              st["recoil"] = 1.0
              if st.has("flash") and is_instance_valid(st["flash"]):
                  st["flash"].visible = true
              for i in int(w["pellets"]):
                  var d: Vector3 = (dir + Vector3(randf_range(-sp, sp), randf_range(-sp, sp), randf_range(-sp, sp))).normalized()
                  var endp: Vector3 = origin + d * float(w["dist"])
                  var q := PhysicsRayQueryParameters3D.create(origin, endp)
                  q.exclude = [shooter.get_rid()]
                  var hit: Dictionary = space.intersect_ray(q)
                  if not hit.is_empty():
                      endp = hit["position"]
                      var col = hit["collider"]
                      if col is CharacterBody3D and col != shooter and col.has_meta("st"):
                          if col.get_meta("st")["alive"]:
                              _damage(col, float(w["dmg"]) * dmg_mul, shooter)
                              if shooter == player:
                                  hit_t = 0.18
                  _tracer(origin, endp, shooter == player)

          func _tracer(a: Vector3, b: Vector3, mine: bool) -> void:
              var mi := MeshInstance3D.new()
              var im := ImmediateMesh.new()
              im.surface_begin(Mesh.PRIMITIVE_LINES)
              im.surface_add_vertex(a)
              im.surface_add_vertex(b)
              im.surface_end()
              mi.mesh = im
              mi.material_override = _unlit(Color(1.0, 0.9, 0.45) if mine else Color(1.0, 0.45, 0.4))
              world.add_child(mi)
              get_tree().create_timer(0.06).timeout.connect(mi.queue_free)

          func _damage(c: CharacterBody3D, amt: float, by) -> void:
              var st: Dictionary = c.get_meta("st")
              if not st["alive"]:
                  return
              st["hp"] = float(st["hp"]) - amt
              if c == player:
                  hud_hurt.color = Color(0.9, 0.05, 0.05, 0.4)
                  shake = minf(0.4, shake + 0.15)
              if float(st["hp"]) > 0.0:
                  return
              st["hp"] = 0.0
              st["alive"] = false
              var t := create_tween()
              t.tween_property(c, "rotation:x", -PI / 2.0, 0.35).set_trans(Tween.TRANS_QUAD)
              if c == player:
                  _feed("Te eliminaron")
                  get_tree().create_timer(1.3).timeout.connect(_show_end.bind(false))
              elif by == player:
                  kills += 1
                  _feed("Eliminaste a un enemigo")

          # ================= BOTS =================
          func _update_bots(delta: float) -> void:
              var pp: Vector3 = player.position
              var pl_alive: bool = player.get_meta("st")["alive"]
              for b in bots:
                  var st: Dictionary = b.get_meta("st")
                  if not st["alive"]:
                      continue
                  var p: Vector3 = b.position
                  var to := Vector2(pp.x - p.x, pp.z - p.z)
                  var d := to.length()
                  var dirv := to / maxf(d, 0.001)
                  st["cd"] = float(st["cd"]) - delta
                  if pl_alive and d < 42.0:
                      st["yaw"] = atan2(dirv.x, dirv.y)
                      var step := 3.0 * delta
                      var mv := Vector2.ZERO
                      if d > 18.0:
                          mv = dirv * step
                      elif d < 9.0:
                          mv = -dirv * step
                      else:
                          mv = Vector2(-dirv.y, dirv.x) * float(st["strafe"]) * step
                      _move(b, Vector3(mv.x, 0.0, mv.y))
                      if float(st["cd"]) <= 0.0:
                          var bf := Vector3(sin(st["yaw"]), 0.0, cos(st["yaw"]))
                          var origin := p + Vector3(0, 2.0, 0) + bf * 0.6
                          var target := pp + Vector3(0, 1.3, 0)
                          _fire(b, origin, (target - origin).normalized(), 2.2, 0.6)
                          st["cd"] = randf_range(0.7, 1.4)
                  else:
                      st["wander_t"] = float(st["wander_t"]) - delta
                      var wp: Vector2 = st["wander"]
                      if float(st["wander_t"]) <= 0.0 or Vector2(p.x, p.z).distance_to(wp) < 1.0:
                          st["wander"] = _random_free(10.0, 95.0)
                          st["wander_t"] = randf_range(4.0, 9.0)
                          wp = st["wander"]
                      var tw := wp - Vector2(p.x, p.z)
                      var tn := tw / maxf(tw.length(), 0.001)
                      _move(b, Vector3(tn.x, 0.0, tn.y) * 2.0 * delta)
                      st["yaw"] = atan2(tn.x, tn.y)
                  b.rotation.y = lerp_angle(b.rotation.y, float(st["yaw"]), minf(1.0, delta * 8.0))

          # ================= ZONA =================
          func _update_zone(delta: float) -> void:
              if zone_phase < ZONE_PHASES.size() and match_time >= ZONE_PHASES[zone_phase][0]:
                  zone_target = ZONE_PHASES[zone_phase][1]
                  zone_phase += 1
                  _feed("La zona se reduce")
              zone_radius = lerpf(zone_radius, zone_target, minf(1.0, delta * 0.35))
              zone_mesh.scale = Vector3(zone_radius, 1.0, zone_radius)
              for c in _all_chars():
                  var p: Vector3 = c.position
                  if Vector2(p.x, p.z).length() > zone_radius:
                      _damage(c, (3.0 if c == player else 4.0) * delta, null)

          func _show_end(win: bool) -> void:
              if ended:
                  return
              ended = true
              firing = false
              end_title.text = "VICTORIA" if win else "ELIMINADO"
              var s := int(match_time)
              end_sub.text = "Eliminaciones: %d    Tiempo: %d:%02d" % [kills, s / 60, s % 60]
              end_panel.visible = true

          # ================= CÁMARA =================
          func _update_camera(delta: float) -> void:
              if player == null or cam == null:
                  return
              var pp: Vector3 = player.position
              var pivot := pp + Vector3(0, 1.6, 0)
              var flat := Vector3(sin(yaw), 0.0, cos(yaw))
              var right := Vector3(-cos(yaw), 0.0, sin(yaw))
              var desired := pivot - flat * 4.2 + right * 0.6 + Vector3.UP * (0.7 + pitch * 2.0)
              var q := PhysicsRayQueryParameters3D.create(pivot, desired)
              q.exclude = [player.get_rid()]
              var hit: Dictionary = get_world_3d().direct_space_state.intersect_ray(q)
              if not hit.is_empty():
                  var hp: Vector3 = hit["position"]
                  desired = hp + (pivot - hp).normalized() * 0.25
              if cam_first:
                  cam.global_position = desired
                  cam_first = false
              else:
                  cam.global_position = cam.global_position.lerp(desired, minf(1.0, delta * 14.0))
              if shake > 0.0:
                  cam.global_position += Vector3(randf_range(-1.0, 1.0), randf_range(-1.0, 1.0), 0.0) * shake * 0.15
                  shake = maxf(0.0, shake - delta * 2.2)
              cam.look_at(pivot + _aim_dir() * 10.0, Vector3.UP)

          # ================= HUD =================
          func _build_hud() -> void:
              var v := _vs()
              sb_panel = _sbox(Color(0.02, 0.05, 0.04, 0.55), 14, Color(1, 1, 1, 0.08), 1)
              sb_slot = _sbox(Color(0.02, 0.04, 0.03, 0.6), 10, Color(1, 1, 1, 0.25), 2)
              sb_on = _sbox(Color(0.1, 0.08, 0.02, 0.7), 10, Color(1.0, 0.7, 0.1), 3)
              sb_red = _sbox(Color(0.8, 0.15, 0.15, 0.85), 16)

              hud = CanvasLayer.new()
              add_child(hud)

              hud_hurt = ColorRect.new()
              hud_hurt.set_anchors_preset(Control.PRESET_FULL_RECT)
              hud_hurt.mouse_filter = Control.MOUSE_FILTER_IGNORE
              hud_hurt.color = Color(0.9, 0.05, 0.05, 0.0)
              hud.add_child(hud_hurt)

              overlay = Control.new()
              overlay.set_anchors_preset(Control.PRESET_FULL_RECT)
              overlay.mouse_filter = Control.MOUSE_FILTER_IGNORE
              hud.add_child(overlay)
              overlay.draw.connect(_draw_hud)

              end_panel = VBoxContainer.new()
              end_panel.position = Vector2(v.x * 0.5 - 200.0, v.y * 0.22)
              end_panel.custom_minimum_size = Vector2(400, 0)
              end_panel.add_theme_constant_override("separation", 14)
              end_panel.visible = false
              hud.add_child(end_panel)
              end_title = Label.new()
              end_title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              end_title.add_theme_font_size_override("font_size", 52)
              end_panel.add_child(end_title)
              end_sub = Label.new()
              end_sub.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              end_sub.add_theme_font_size_override("font_size", 22)
              end_panel.add_child(end_sub)
              var back := Button.new()
              back.text = "VOLVER AL LOBBY"
              back.custom_minimum_size = Vector2(340, 70)
              back.add_theme_font_size_override("font_size", 24)
              back.add_theme_stylebox_override("normal", _sbox(Color(1.0, 0.6, 0.1), 16))
              back.add_theme_color_override("font_color", Color.BLACK)
              back.pressed.connect(_back_to_lobby)
              end_panel.add_child(back)

          func _txt(pos: Vector2, s: String, fs: int, col: Color, align: HorizontalAlignment = HORIZONTAL_ALIGNMENT_LEFT, w: float = -1.0) -> void:
              var f := ThemeDB.fallback_font
              overlay.draw_string(f, pos + Vector2(1.5, 1.5), s, align, w, fs, Color(0, 0, 0, 0.7))
              overlay.draw_string(f, pos, s, align, w, fs, col)

          func _btn(c: Vector2, r: float, label: String, fs: int, col: Color) -> void:
              overlay.draw_circle(c, r, col)
              overlay.draw_arc(c, r, 0.0, TAU, 40, Color(1, 1, 1, 0.75), 2.5)
              _txt(Vector2(c.x - r, c.y + fs * 0.35), label, fs, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, r * 2.0)

          func _update_hud(delta: float) -> void:
              if msg_t > 0.0:
                  msg_t -= delta
                  if msg_t <= 0.0:
                      msg_text = ""
              if hit_t > 0.0:
                  hit_t -= delta
              var hc: Color = hud_hurt.color
              hc.a = maxf(0.0, hc.a - delta * 1.4)
              hud_hurt.color = hc
              for i in range(feed_items.size() - 1, -1, -1):
                  feed_items[i]["life"] -= delta
                  if feed_items[i]["life"] <= 0.0:
                      feed_items.remove_at(i)

          func _msg(t: String, dur: float) -> void:
              msg_text = t
              msg_t = dur

          func _feed(t: String) -> void:
              feed_items.push_front({"t": t, "life": 3.5})
              while feed_items.size() > 4:
                  feed_items.pop_back()

          func _draw_hud() -> void:
              if not in_match or player == null or overlay == null:
                  return
              var v := _vs()
              var st: Dictionary = player.get_meta("st")
              var hpf: float = clampf(float(st["hp"]) / 100.0, 0.0, 1.0)

              # Panel de vida
              overlay.draw_style_box(sb_panel, Rect2(16, 16, 330, 84))
              var sk: Dictionary = SKINS[skin_index]
              overlay.draw_circle(Vector2(60, 58), 28.0, _skin_col(sk))
              overlay.draw_arc(Vector2(60, 58), 28.0, 0.0, TAU, 32, Color.WHITE, 3.0)
              _txt(Vector2(100, 40), "VIDA", 14, Color(0.8, 0.95, 0.85))
              overlay.draw_rect(Rect2(100, 46, 236, 16), Color(0, 0, 0, 0.6))
              var hc := Color(0.35, 1.0, 0.35).lerp(Color(1.0, 0.25, 0.2), 1.0 - hpf)
              overlay.draw_rect(Rect2(100, 46, 236.0 * hpf, 16), hc)
              _txt(Vector2(100, 88), str(ceili(float(st["hp"]))), 20, Color.WHITE)

              # Vivos y zona
              var alive: int = _alive_bots() + (1 if st["alive"] else 0)
              overlay.draw_style_box(sb_panel, Rect2(v.x * 0.5 - 110.0, 14, 220, 40))
              _txt(Vector2(v.x * 0.5 - 110.0, 41), "VIVOS  %d" % alive, 20, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, 220.0)
              overlay.draw_style_box(sb_red, Rect2(v.x * 0.5 - 110.0, 60, 220, 32))
              var zt := "ZONA FINAL"
              if zone_phase < ZONE_PHASES.size():
                  zt = "ZONA  %ds" % maxi(0, ceili(float(ZONE_PHASES[zone_phase][0]) - match_time))
              _txt(Vector2(v.x * 0.5 - 110.0, 82), zt, 17, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, 220.0)

              # Minimapa
              _draw_minimap(Vector2(v.x - 92.0, 96.0), 74.0)

              # Feed
              var fy := 204.0
              for item in feed_items:
                  var a: float = clampf(float(item["life"]), 0.0, 1.0)
                  _txt(Vector2(v.x - 326.0, fy), item["t"], 16, Color(1, 1, 1, a), HORIZONTAL_ALIGNMENT_RIGHT, 300.0)
                  fy += 24.0

              # Mira
              var c := v * 0.5
              var gap := 6.0 + (8.0 if (firing and WEAPONS[st["weapon"]]["auto"]) else 0.0)
              var wc := Color(1, 1, 1, 0.9)
              overlay.draw_line(c + Vector2(-gap - 9, 0), c + Vector2(-gap, 0), wc, 2.0)
              overlay.draw_line(c + Vector2(gap, 0), c + Vector2(gap + 9, 0), wc, 2.0)
              overlay.draw_line(c + Vector2(0, -gap - 9), c + Vector2(0, -gap), wc, 2.0)
              overlay.draw_line(c + Vector2(0, gap), c + Vector2(0, gap + 9), wc, 2.0)
              if hit_t > 0.0:
                  var hcol := Color(1, 0.25, 0.25, 0.95)
                  overlay.draw_line(c + Vector2(-7, -7), c + Vector2(7, 7), hcol, 2.5)
                  overlay.draw_line(c + Vector2(7, -7), c + Vector2(-7, 7), hcol, 2.5)

              # Joystick flotante
              if joy_id != -1:
                  overlay.draw_circle(joy_origin, JOY_R, Color(1, 1, 1, 0.1))
                  overlay.draw_arc(joy_origin, JOY_R, 0.0, TAU, 40, Color(1, 1, 1, 0.45), 2.0)
                  overlay.draw_circle(joy_origin + Vector2(joy_vec.x, -joy_vec.y) * JOY_R, 26.0, Color(1, 1, 1, 0.6))

              # Botones
              _btn(_fire_c(), FIRE_R, "FUEGO", 20, Color(0.92, 0.3, 0.1, 0.9))
              _btn(_jump_c(), JUMP_R, "SALTAR", 12, Color(0.08, 0.1, 0.1, 0.75))
              _btn(_reload_c(), RELOAD_R, "RECARGAR", 10, Color(0.08, 0.1, 0.1, 0.75))
              _btn(_arma_c(), ARMA_R, "ARMA", 11, Color(0.08, 0.1, 0.1, 0.75))

              # Panel de munición
              var ar := _ammo_rect()
              overlay.draw_style_box(sb_panel, ar)
              var wk: String = st["weapon"]
              var a: Array = ammo[wk]
              _txt(Vector2(ar.position.x + 14, ar.position.y + 20), WEAPONS[wk]["name"], 14, Color(1, 0.85, 0.4))
              _txt(Vector2(ar.position.x + 14, ar.position.y + 46), "%d / %d" % [a[0], a[1]], 26, Color.WHITE)
              if reloading > 0.0:
                  _txt(Vector2(ar.position.x + 150, ar.position.y + 20), "RECARGANDO", 12, Color(1, 0.6, 0.3))

              # Ranuras de arma
              var short := ["PIST", "RIFLE", "ESC"]
              for i in 3:
                  var sr := _slot_rect(i)
                  var sb: StyleBoxFlat = sb_on if i == weapon_idx else sb_slot
                  overlay.draw_style_box(sb, sr)
                  _txt(Vector2(sr.position.x + 8, sr.position.y + 17), str(i + 1) + " " + short[i], 12, Color.WHITE)
                  var wa: Array = ammo[WEAPON_ORDER[i]]
                  _txt(Vector2(sr.position.x + 8, sr.position.y + 36), str(wa[0]), 14, Color(1, 0.9, 0.5))

              # Mensaje central
              if msg_t > 0.0 and msg_text != "":
                  _txt(Vector2(v.x * 0.5 - 300.0, v.y * 0.36), msg_text, 96, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, 600.0)

          func _draw_minimap(c: Vector2, R: float) -> void:
              var k := R / 125.0
              overlay.draw_circle(c, R + 3.0, Color(1, 1, 1, 0.85))
              overlay.draw_circle(c, R, Color(0.12, 0.3, 0.45, 0.95))
              overlay.draw_circle(c, MAP_LIMIT * k, Color(0.45, 0.7, 0.35, 0.95))
              overlay.draw_arc(c, zone_radius * k, 0.0, TAU, 60, Color(1, 0.25, 0.25), 2.5)
              for b in bots:
                  if b.get_meta("st")["alive"]:
                      var bp: Vector3 = b.position
                      overlay.draw_circle(c + Vector2(bp.x, bp.z) * k, 2.5, Color(1, 0.3, 0.3))
              var pf := Vector2(sin(yaw), cos(yaw))
              var pp2 := Vector2(-pf.y, pf.x)
              var pp: Vector3 = player.position
              var pc := c + Vector2(pp.x, pp.z) * k
              overlay.draw_colored_polygon(PackedVector2Array([pc + pf * 9.0, pc - pf * 6.0 + pp2 * 6.0, pc - pf * 6.0 - pp2 * 6.0]), Color(1, 0.9, 0.3))

          func _fire_pos_unused() -> void:
              pass
          EOF

      - name: Exportar APK con Godot
        run: |
          cd game
          godot --headless --import || true
          godot --headless --export-debug "Android" ../battle_royale.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-royale-godot-apk
          path: battle_royale.apk
