name: EL ALMACÉN - Juego de terror (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar three.js (para que funcione sin internet en el APK)
        run: |
          mkdir -p /tmp/t site/lib/three/build site/lib/three/examples/jsm/loaders site/lib/three/examples/jsm/utils
          cd /tmp/t && npm init -y >/dev/null && npm install three@0.160.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          cp /tmp/t/node_modules/three/build/three.module.js site/lib/three/build/
          cp /tmp/t/node_modules/three/examples/jsm/loaders/GLTFLoader.js site/lib/three/examples/jsm/loaders/
          cp /tmp/t/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js site/lib/three/examples/jsm/utils/

      - name: Generar el juego
        run: |
          mkdir -p site
          if [ -d assets ]; then cp -r assets site/; fi
          cp index.html site/index.html

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar el juego para el APK
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el juego
        uses: actions/download-artifact@v4
        with:
          name: site
          path: www

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Bonnie's Terror" com.elalmacen.juego --web-dir=www
          node -e "const f='capacitor.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.backgroundColor='#000000';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowBackground">@android:color/black</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"

      - name: Generar y asignar iconos Android desde assets/app-cover.jpg
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const src = 'www/assets/app-cover.jpg';
          const res = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [density, size] of Object.entries(sizes)) {
              const dir = path.join(res, 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });
              await sharp(src).resize(size, size, { fit: 'cover' }).png().toFile(path.join(dir, 'game_launcher.png'));
              await sharp(src).resize(size, size, { fit: 'cover' }).png().toFile(path.join(dir, 'game_launcher_round.png'));
            }
            const hi = path.join(res, 'mipmap-xxxhdpi');
            const fg = await sharp(src).resize(320, 320, { fit: 'cover' }).png().toBuffer();
            await sharp({ create: { width: 432, height: 432, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([{ input: fg, left: 56, top: 56 }]).png().toFile(path.join(hi, 'game_launcher_foreground.png'));
            const adaptive = path.join(res, 'mipmap-anydpi-v26');
            fs.mkdirSync(adaptive, { recursive: true });
            const xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/icon_background"/><foreground android:drawable="@mipmap/game_launcher_foreground"/></adaptive-icon>';
            fs.writeFileSync(path.join(adaptive, 'game_launcher.xml'), xml);
            fs.writeFileSync(path.join(adaptive, 'game_launcher_round.xml'), xml);
            const values = path.join(res, 'values');
            fs.mkdirSync(values, { recursive: true });
            fs.writeFileSync(path.join(values, 'game_icon_background.xml'), '<?xml version="1.0" encoding="utf-8"?><resources><color name="icon_background">#08090c</color></resources>');
            const manifest = 'android/app/src/main/AndroidManifest.xml';
            let m = fs.readFileSync(manifest, 'utf8');
            m = m.replace(/android:icon="[^"]*"/, 'android:icon="@mipmap/game_launcher"');
            if (m.includes('android:roundIcon=')) m = m.replace(/android:roundIcon="[^"]*"/, 'android:roundIcon="@mipmap/game_launcher_round"');
            else m = m.replace(/<application\b/, '<application android:roundIcon="@mipmap/game_launcher_round"');
            fs.writeFileSync(manifest, m);
            console.log('Launcher icon now uses assets/app-cover.jpg');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Almacen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
