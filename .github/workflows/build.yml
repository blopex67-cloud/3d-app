name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3-stable"
    steps:
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes del SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Descargar Godot y templates
        run: |
          mkdir -p $HOME/godot && cd $HOME/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          mv templates/* $HOME/.local/share/godot/export_templates/4.3.stable/

      - name: Configurar Godot y keystore de debug
        run: |
          mkdir -p $HOME/.config/godot $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > $HOME/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Crear proyecto
        run: |
          mkdir -p juego/build && cd juego
          cat > project.godot <<'EOF'
          config_version=5

          [application]

          config/name="VideoEditor"
          run/main_scene="res://main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")
          EOF
          cat > main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://editor.gd" id="1"]

          [node name="Main" type="Control"]
          script = ExtResource("1")
          EOF
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/app-debug.apk"
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          package/unique_name="com.carlos.videoeditor"
          package/name="VideoEditor"
          package/signed=true
          permissions/read_media_images=true
          permissions/read_external_storage=true
          permissions/write_external_storage=true
          EOF
          cat > editor.gd <<'EOF'
          extends Control

          const SHADER_CODE := """
          shader_type canvas_item;
          uniform float brillo = 1.0;
          uniform float contraste = 1.0;
          void fragment() {
              vec4 c = texture(TEXTURE, UV);
              c.rgb = (c.rgb - 0.5) * contraste + 0.5;
              c.rgb *= brillo;
              COLOR = c;
          }
          """

          var clips: Array = []
          var idx := -1
          var preview: TextureRect
          var overlay: Label
          var mat: ShaderMaterial
          var lista: ItemList
          var ini: SpinBox
          var fin: SpinBox
          var texto: LineEdit
          var brillo: HSlider
          var contraste: HSlider
          var timer: Timer
          var dlg: FileDialog
          var estado: Label

          func _ready() -> void:
              set_anchors_preset(Control.PRESET_FULL_RECT)
              var raiz := VBoxContainer.new()
              raiz.set_anchors_preset(Control.PRESET_FULL_RECT)
              add_child(raiz)

              preview = TextureRect.new()
              preview.size_flags_vertical = Control.SIZE_EXPAND_FILL
              preview.expand_mode = TextureRect.EXPAND_IGNORE_SIZE
              preview.stretch_mode = TextureRect.STRETCH_KEEP_ASPECT_CENTERED
              var sh := Shader.new()
              sh.code = SHADER_CODE
              mat = ShaderMaterial.new()
              mat.shader = sh
              preview.material = mat
              raiz.add_child(preview)

              overlay = Label.new()
              overlay.set_anchors_preset(Control.PRESET_FULL_RECT)
              overlay.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              overlay.vertical_alignment = VERTICAL_ALIGNMENT_BOTTOM
              overlay.add_theme_font_size_override("font_size", 40)
              preview.add_child(overlay)

              lista = ItemList.new()
              lista.custom_minimum_size = Vector2(0, 120)
              lista.item_selected.connect(_seleccionar)
              raiz.add_child(lista)

              var fila := HBoxContainer.new()
              raiz.add_child(fila)
              fila.add_child(_boton("+ Imagen", func(): dlg.popup_centered_ratio(0.8)))
              fila.add_child(_boton("▶ Reproducir", _reproducir))
              fila.add_child(_boton("■ Parar", func(): timer.stop()))
              fila.add_child(_boton("Quitar", _quitar))

              var fila2 := HBoxContainer.new()
              raiz.add_child(fila2)
              ini = SpinBox.new()
              ini.prefix = "Inicio "
              ini.max_value = 600
              ini.step = 0.1
              ini.value_changed.connect(func(v): _set_campo("start", v))
              fin = SpinBox.new()
              fin.prefix = "Fin "
              fin.max_value = 600
              fin.step = 0.1
              fin.value = 3
              fin.value_changed.connect(func(v): _set_campo("end", v))
              fila2.add_child(ini)
              fila2.add_child(fin)

              texto = LineEdit.new()
              texto.placeholder_text = "Texto sobre el clip"
              texto.text_changed.connect(func(t): _set_campo("text", t))
              raiz.add_child(texto)

              brillo = _slider(0.0, 2.0, 1.0, "brillo")
              raiz.add_child(brillo)
              contraste = _slider(0.0, 2.0, 1.0, "contraste")
              raiz.add_child(contraste)

              estado = Label.new()
              raiz.add_child(estado)
              raiz.add_child(_boton("Exportar proyecto", _exportar))

              timer = Timer.new()
              timer.one_shot = true
              timer.timeout.connect(_siguiente)
              add_child(timer)

              dlg = FileDialog.new()
              dlg.file_mode = FileDialog.FILE_MODE_OPEN_FILE
              dlg.access = FileDialog.ACCESS_FILESYSTEM
              dlg.filters = PackedStringArray(["*.png, *.jpg, *.jpeg, *.webp ; Imágenes"])
              dlg.file_selected.connect(_agregar)
              add_child(dlg)

          func _boton(t: String, cb: Callable) -> Button:
              var b := Button.new()
              b.text = t
              b.pressed.connect(cb)
              return b

          func _slider(mn: float, mx: float, v: float, campo: String) -> HSlider:
              var s := HSlider.new()
              s.min_value = mn
              s.max_value = mx
              s.step = 0.01
              s.value = v
              s.custom_minimum_size.x = 200
              s.value_changed.connect(func(x): _set_campo(campo, x))
              return s

          func _agregar(path: String) -> void:
              var img := Image.load_from_file(path)
              if img == null:
                  estado.text = "No se pudo abrir la imagen"
                  return
              clips.append({
                  "path": path, "start": 0.0, "end": 3.0, "text": "",
                  "brillo": 1.0, "contraste": 1.0,
                  "tex": ImageTexture.create_from_image(img)
              })
              lista.add_item(path.get_file())
              _seleccionar(clips.size() - 1)

          func _seleccionar(i: int) -> void:
              idx = i
              var c: Dictionary = clips[i]
              ini.set_value_no_signal(c.start)
              fin.set_value_no_signal(c.end)
              texto.text = c.text
              brillo.set_value_no_signal(c.brillo)
              contraste.set_value_no_signal(c.contraste)
              mat.set_shader_parameter("brillo", c.brillo)
              mat.set_shader_parameter("contraste", c.contraste)
              preview.texture = c.tex
              overlay.text = c.text

          func _set_campo(campo: String, v) -> void:
              if idx < 0:
                  return
              clips[idx][campo] = v
              match campo:
                  "brillo", "contraste":
                      mat.set_shader_parameter(campo, v)
                  "text":
                      overlay.text = v

          func _reproducir() -> void:
              if clips.is_empty():
                  return
              _mostrar(0)

          func _mostrar(i: int) -> void:
              _seleccionar(i)
              lista.select(i)
              var c: Dictionary = clips[i]
              timer.start(max(c.end - c.start, 0.1))

          func _siguiente() -> void:
              var n := idx + 1
              if n >= clips.size():
                  estado.text = "Fin de la reproducción"
                  return
              _mostrar(n)

          func _quitar() -> void:
              if idx < 0:
                  return
              clips.remove_at(idx)
              lista.remove_item(idx)
              idx = -1
              preview.texture = null
              overlay.text = ""

          func _exportar() -> void:
              var datos: Array = []
              for c in clips:
                  datos.append({
                      "path": c.path, "start": c.start, "end": c.end,
                      "text": c.text, "brillo": c.brillo, "contraste": c.contraste
                  })
              var f := FileAccess.open("user://proyecto.json", FileAccess.WRITE)
              f.store_string(JSON.stringify(datos, "\t"))
              f.close()
              estado.text = "Proyecto guardado en user://proyecto.json"
          EOF

      - name: Importar proyecto
        working-directory: juego
        run: $HOME/godot/godot --headless --import || true

      - name: Exportar APK
        working-directory: juego
        run: $HOME/godot/godot --headless --export-debug "Android" build/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: juego/build/*.apk
