            { n: 'Neón', rar: 'Épico', type: 'sol', skin: 0xf2c4a0, shirt: 0x1d1f3a, vest: 0x00e5ff, pants: 0x1a1a2e, mask: 0x0b0b15, boots: 0x222244, bag: 0xff2bd6, hair: 0x00e5ff, glove: 0x111122, belt: 0x111122 },
            { n: 'Fuego', rar: 'Épico', type: 'sol', skin: 0xefb98c, shirt: 0xcfcfcf, vest: 0xb22222, pants: 0x2b2b2b, mask: 0x0d0d0d, boots: 0x3a1f1f, bag: 0x550000, hair: 0xff6a00, glove: 0x222222, belt: 0x222222 },
            { n: 'Springtrap', rar: 'Legendario', type: 'anim', body: 0xd9cf2b, muzzle: 0xe8e06a, dark: 0x8a7d12, ear: 0xc9bf22, bow: 0x6a2c91, eye: 0x39ff6a, pants: 0x2a2a2a, boots: 0x1a1a1a, glove: 0x3a3a3a },
            { n: 'Freddy', rar: 'Épico', type: 'anim', body: 0x7a4a2a, muzzle: 0x9a5f36, dark: 0x4a2c18, ear: 0x6a3e22, bow: 0xc1272d, eye: 0x4fc3ff, pants: 0x3a2416, boots: 0x1a1a1a, glove: 0x2a2a2a, hat: 0x111111 }
          ];
