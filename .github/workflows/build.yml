name: Build Godot APK Battle Royale

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.3-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Godot y plantillas
        run: |
          set -e
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR"/

      - name: Configurar Godot para Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Crear proyecto Godot
        run: |
          mkdir -p game/scripts game/scenes
          cd game

          cat > project.godot << 'EOF'
          config_version=5

          [application]

          config/name="Battle Royale"
          run/main_scene="res://scenes/main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=0
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"

          [input_devices]

          pointing/emulate_touch_from_mouse=false
          pointing/emulate_mouse_from_touch=true

          [rendering]

          renderer/rendering_method="mobile"
          textures/vram_compression/import_etc2_astc=true
          EOF

          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_path="../battle_royale.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.ejemplo.battleroyale"
          package/name="Battle Royale"
          package/signed=true
          package/app_category=3
          screen/orientation=0
          screen/immersive_mode=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

          cat > scenes/main.tscn << 'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/game.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/game.gd << 'EOF'
          extends Node3D

          const MAP_R := 380.0
          const SR := 22050.0
          const WEAPON_ORDER := ["pistola", "rifle", "escopeta"]
          const MODES := ["1v1", "4v4", "train"]
          const MODE_NAMES := ["1 VS 1", "4 VS 4", "ENTRENAMIENTO"]
          const FIRE_R := 62.0
          const JUMP_R := 42.0
          const RELOAD_R := 36.0
          const ARMA_R := 32.0
          const JOY_R := 70.0

          var WEAPONS := {
              "pistola": {"name": "PISTOLA", "dmg": 18.0, "rate": 0.25, "mag": 12, "reload": 1.0, "dist": 120.0, "spread": 0.012, "pellets": 1, "auto": false, "acc": 0.85, "col": Color(0.7, 0.72, 0.75)},
              "rifle": {"name": "RIFLE AK", "dmg": 14.0, "rate": 0.1, "mag": 30, "reload": 1.9, "dist": 160.0, "spread": 0.02, "pellets": 1, "auto": true, "acc": 0.7, "col": Color(1.0, 0.7, 0.2)},
              "escopeta": {"name": "ESCOPETA", "dmg": 11.0, "rate": 0.75, "mag": 6, "reload": 2.2, "dist": 45.0, "spread": 0.07, "pellets": 6, "auto": false, "acc": 0.6, "col": Color(1.0, 0.35, 0.2)}
          }

          var SKINS := [
              {"name": "Operador V", "rarity": "Común", "kind": "soldier", "cloth": Color(0.55, 0.57, 0.6), "armor": Color(0.72, 0.74, 0.76), "pants": Color(0.22, 0.23, 0.25), "mask": Color(0.04, 0.04, 0.05), "glow": true, "camo": false},
              {"name": "Camuflaje", "rarity": "Raro", "kind": "soldier", "cloth": Color(1, 1, 1), "armor": Color(0.3, 0.33, 0.2), "pants": Color(1, 1, 1), "mask": Color(0.2, 0.24, 0.14), "glow": false, "camo": true},
              {"name": "Springtrap", "rarity": "Legendario", "kind": "animatronic", "body": Color(0.85, 0.8, 0.17), "eye": Color(0.22, 1.0, 0.42), "bow": Color(0.42, 0.17, 0.57)},
              {"name": "Freddy", "rarity": "Épico", "kind": "animatronic", "body": Color(0.48, 0.29, 0.16), "eye": Color(0.31, 0.76, 1.0), "bow": Color(0.75, 0.15, 0.17)}
          ]

          var env_node: WorldEnvironment
          var lobby_root: Node3D
          var lobby_ui: CanvasLayer
          var lobby_char: CharacterBody3D
          var lobby_btns: Array = []
          var mode_btns: Array = []
          var skin_index := 0
          var sel_mode := "1v1"

          var mats := {}
          var mcache := {}
          var texs := {}
          var sounds := {}
          var sfx_pool: Array = []
          var time_s := 0.0

          var in_match := false
          var started := false
          var ended := false
          var end_t := 0.0
          var countdown := 3.0
          var last_count := -1
          var match_time := 0.0
          var kills := 0
          var mode := "1v1"
          var stats := {"shots": 0, "hits": 0}

          var world: Node3D
          var cam: Camera3D
          var cam_first := true
          var shake := 0.0
          var player: CharacterBody3D
          var bots: Array = []
          var all_chars: Array = []
          var obstacles: Array = []
          var drops: Array = []
          var ammo := {}
          var owned := {}
          var weapon_idx := 0
          var reloading := 0.0
          var yaw := 0.0
          var pitch := 0.0

          var joy_id := -1
          var joy_origin := Vector2.ZERO
          var joy_vec := Vector2.ZERO
          var look_id := -1
          var fire_id := -1
          var firing := false
          var fire_edge := false

          var hud: CanvasLayer
          var overlay: Control
          var hud_hurt: ColorRect
          var end_panel: VBoxContainer
          var end_title: Label
          var end_sub: Label
          var msg_text := ""
          var msg_t := 0.0
          var feed_items: Array = []
          var hit_t := 0.0
          var sb_panel: StyleBoxFlat
          var sb_slot: StyleBoxFlat
          var sb_on: StyleBoxFlat
          var sb_red: StyleBoxFlat

          func _ready() -> void:
              randomize()
              _setup_env()
              _make_sounds()
              for _i in 12:
                  var p := AudioStreamPlayer3D.new()
                  p.unit_size = 8.0
                  p.max_distance = 140.0
                  add_child(p)
                  sfx_pool.append(p)
              _build_lobby()

          func _process(delta: float) -> void:
              time_s += delta
              if not in_match:
                  _update_lobby(delta)
                  return
              if not started:
                  countdown -= delta
                  var n := ceili(countdown)
                  if countdown <= 0.0:
                      started = true
                      _msg("¡YA!", 0.8)
                      _feed("Partida iniciada")
                  elif n != last_count:
                      last_count = n
                      _msg(str(n), 0.9)
              elif not ended:
                  match_time += delta
                  _update_player(delta)
                  _update_bots(delta)
                  _update_drops(delta)
                  if mode != "train":
                      _check_end(delta)
              _animate_all(delta)
              _update_camera(delta)
              _update_hud(delta)
              if overlay:
                  overlay.queue_redraw()

          func _input(e: InputEvent) -> void:
              if e is InputEventKey:
                  if in_match and not ended and e.pressed and not e.echo:
                      match e.keycode:
                          KEY_1:
                              _switch_weapon(0)
                          KEY_2:
                              _switch_weapon(1)
                          KEY_3:
                              _switch_weapon(2)
                          KEY_R:
                              _start_reload()
                          KEY_SPACE:
                              _jump()
                          KEY_F:
                              firing = true
                              fire_edge = true
                  elif e.keycode == KEY_F and not e.pressed:
                      firing = false
                  return
              if not in_match or ended:
                  return
              if e is InputEventScreenTouch:
                  _on_touch(e)
              elif e is InputEventScreenDrag:
                  _on_drag(e)
              elif not OS.has_feature("mobile"):
                  if e is InputEventMouseButton and e.button_index == MOUSE_BUTTON_LEFT:
                      firing = e.pressed
                      if e.pressed:
                          fire_edge = true
                  elif e is InputEventMouseMotion and (e.button_mask & MOUSE_BUTTON_MASK_RIGHT) != 0:
                      _look(e.relative)

          # ================= CONTROLES TÁCTILES =================
          func _vs() -> Vector2:
              return get_viewport().get_visible_rect().size

          func _in(p: Vector2, c: Vector2, r: float) -> bool:
              return p.distance_to(c) <= r

          func _fire_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 120.0, v.y - 105.0)

          func _jump_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 252.0, v.y - 112.0)

          func _reload_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 60.0, v.y - 200.0)

          func _arma_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 368.0, v.y - 92.0)

          func _exit_rect() -> Rect2:
              return Rect2(16, 108, 120, 34)

          func _slot_rect(i: int) -> Rect2:
              var v := _vs()
              return Rect2(v.x - 350.0 + i * 84.0, v.y - 268.0, 78.0, 42.0)

          func _ammo_rect() -> Rect2:
              var v := _vs()
              return Rect2(v.x - 350.0, v.y - 216.0, 250.0, 52.0)

          func _on_touch(e: InputEventScreenTouch) -> void:
              var p: Vector2 = e.position
              if e.pressed:
                  if _in(p, _fire_c(), FIRE_R + 18.0):
                      fire_id = e.index
                      firing = true
                      fire_edge = true
                      return
                  if _in(p, _jump_c(), JUMP_R + 12.0):
                      _jump()
                      return
                  if _in(p, _reload_c(), RELOAD_R + 12.0):
                      _start_reload()
                      return
                  if _in(p, _arma_c(), ARMA_R + 12.0):
                      _cycle_weapon()
                      return
                  if _exit_rect().has_point(p):
                      _back_to_lobby()
                      return
                  for i in 3:
                      if _slot_rect(i).has_point(p):
                          _switch_weapon(i)
                          return
                  if p.x < _vs().x * 0.45 and joy_id == -1:
                      joy_id = e.index
                      joy_origin = p
                      joy_vec = Vector2.ZERO
                      return
                  if look_id == -1:
                      look_id = e.index
              else:
                  if e.index == fire_id:
                      fire_id = -1
                      firing = false
                  if e.index == joy_id:
                      joy_id = -1
                      joy_vec = Vector2.ZERO
                  if e.index == look_id:
                      look_id = -1

          func _on_drag(e: InputEventScreenDrag) -> void:
              if e.index == joy_id:
                  var d: Vector2 = e.position - joy_origin
                  joy_vec = (Vector2(d.x, -d.y) / JOY_R).limit_length(1.0)
              elif e.index == look_id:
                  _look(e.relative)

          func _look(rel: Vector2) -> void:
              yaw -= rel.x * 0.0065
              pitch = clampf(pitch - rel.y * 0.004, -0.5, 0.5)

          func _aim_dir() -> Vector3:
              return Vector3(sin(yaw) * cos(pitch), sin(pitch), cos(yaw) * cos(pitch))

          func _cycle_weapon() -> void:
              for k in range(1, WEAPON_ORDER.size() + 1):
                  var i: int = (weapon_idx + k) % WEAPON_ORDER.size()
                  if owned.get(WEAPON_ORDER[i], false):
                      _switch_weapon(i)
                      return

          # ================= SONIDO (sintetizado en código) =================
          func _setup_env() -> void:
              var sm := ProceduralSkyMaterial.new()
              sm.sky_top_color = Color(0.22, 0.45, 0.8)
              sm.sky_horizon_color = Color(0.74, 0.84, 0.93)
              sm.ground_horizon_color = Color(0.62, 0.7, 0.68)
              sm.ground_bottom_color = Color(0.18, 0.24, 0.18)
              sm.sun_angle_max = 18.0
              sm.sun_curve = 0.06
              var sky := Sky.new()
              sky.sky_material = sm
              var e := Environment.new()
              e.background_mode = Environment.BG_SKY
              e.sky = sky
              e.ambient_light_source = Environment.AMBIENT_SOURCE_SKY
              e.ambient_light_energy = 0.9
              e.tonemap_mode = Environment.TONE_MAPPER_ACES
              e.glow_enabled = false
              e.fog_enabled = true
              e.fog_density = 0.0009
              e.fog_light_color = Color(0.74, 0.84, 0.93)
              env_node = WorldEnvironment.new()
              env_node.environment = e
              add_child(env_node)

          func _nz(i: int) -> float:
              var x: float = sin(float(i) * 12.9898 + 78.233) * 43758.5453
              return (x - floorf(x)) * 2.0 - 1.0

          func _lp(i: int) -> float:
              return (_nz(i) + _nz(i - 1) + _nz(i - 2) + _nz(i - 3)) * 0.25

          func _synth(dur: float, fn: Callable) -> AudioStreamWAV:
              var n := int(dur * SR)
              var data := PackedByteArray()
              data.resize(n * 2)
              for i in n:
                  var v: float = clampf(float(fn.call(float(i) / SR, i)), -1.0, 1.0)
                  data.encode_s16(i * 2, int(v * 30000.0))
              var w := AudioStreamWAV.new()
              w.format = AudioStreamWAV.FORMAT_16_BITS
              w.mix_rate = int(SR)
              w.stereo = false
              w.data = data
              return w

          func _make_sounds() -> void:
              sounds["pistola"] = _synth(0.16, func(t, i): return (_lp(i) * 0.9 + sin(TAU * 160.0 * t) * 0.4 * exp(-t * 70.0)) * exp(-t * 28.0))
              sounds["rifle"] = _synth(0.2, func(t, i): return (_lp(i) * 0.8 + sin(TAU * 110.0 * t) * 0.35 * exp(-t * 35.0)) * exp(-t * 20.0))
              sounds["escopeta"] = _synth(0.4, func(t, i): return (_lp(i) + sin(TAU * 70.0 * t) * 0.5 * exp(-t * 20.0)) * exp(-t * 11.0))
              sounds["hit"] = _synth(0.12, func(t, i): return sin(TAU * (1200.0 - t * 3000.0) * t) * exp(-t * 35.0) * 0.35)
              sounds["hurt"] = _synth(0.25, func(t, i): return sin(TAU * 90.0 * t) * exp(-t * 12.0) * 0.6)
              sounds["reload"] = _synth(0.45, func(t, i): return (exp(-absf(t - 0.05) * 500.0) + 0.7 * exp(-absf(t - 0.33) * 500.0)) * _nz(i) * 0.5)
              sounds["pickup"] = _synth(0.3, func(t, i): return sin(TAU * (660.0 if t < 0.08 else 990.0) * t) * exp(-t * 9.0) * 0.35)

          func _sfx(n: String, pos: Vector3) -> void:
              if not sounds.has(n):
                  return
              for p in sfx_pool:
                  if not p.playing:
                      p.stream = sounds[n]
                      p.global_position = pos
                      p.play()
                      return

          # ================= TEXTURAS Y MATERIALES =================
          func _tex(n: String) -> Texture2D:
              if texs.has(n):
                  return texs[n]
              var fl := FastNoiseLite.new()
              fl.frequency = 0.09 if n == "grass" else 0.05
              var g := Gradient.new()
              match n:
                  "grass":
                      g.set_color(0, Color(0.36, 0.56, 0.26))
                      g.set_color(1, Color(0.52, 0.72, 0.34))
                  "camo":
                      g.set_color(0, Color(0.18, 0.25, 0.12))
                      g.set_color(1, Color(0.46, 0.42, 0.24))
                  _:
                      g.set_color(0, Color(0.8, 0.76, 0.7))
                      g.set_color(1, Color(0.97, 0.94, 0.88))
              var nt := NoiseTexture2D.new()
              nt.noise = fl
              nt.color_ramp = g
              nt.width = 256
              nt.height = 256
              nt.seamless = true
              texs[n] = nt
              return nt

          func _mat(c: Color, rough: float = 0.8, metal: float = 0.0, tex: String = "", uvs: float = 1.0) -> StandardMaterial3D:
              var key := "%s|%.2f|%.2f|%s|%.1f" % [c.to_html(), rough, metal, tex, uvs]
              if mats.has(key):
                  return mats[key]
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.roughness = rough
              m.metallic = metal
              if tex != "":
                  m.albedo_texture = _tex(tex)
                  m.uv1_scale = Vector3(uvs, uvs, 1.0)
              mats[key] = m
              return m

          func _glow(c: Color, e: float) -> StandardMaterial3D:
              var key := "g|%s|%.2f" % [c.to_html(), e]
              if mats.has(key):
                  return mats[key]
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.05, 0.05, 0.05)
              m.emission_enabled = true
              m.emission = c
              m.emission_energy_multiplier = e
              m.roughness = 0.3
              mats[key] = m
              return m

          func _unlit(c: Color) -> StandardMaterial3D:
              var key := "u|%s" % c.to_html()
              if mats.has(key):
                  return mats[key]
              var m := StandardMaterial3D.new()
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              m.albedo_color = c
              mats[key] = m
              return m

          func _sbox(bg: Color, r: int, border: Color = Color(0, 0, 0, 0), bw: int = 0) -> StyleBoxFlat:
              var sb := StyleBoxFlat.new()
              sb.bg_color = bg
              sb.set_corner_radius_all(r)
              if bw > 0:
                  sb.set_border_width_all(bw)
                  sb.border_color = border
              return sb

          func _boxm(size: Vector3) -> BoxMesh:
              var key := "b%s" % size
              if mcache.has(key):
                  return mcache[key]
              var bm := BoxMesh.new()
              bm.size = size
              mcache[key] = bm
              return bm

          func _box(p: Node, size: Vector3, pos: Vector3, m: Material, rot: Vector3 = Vector3.ZERO) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              mi.mesh = _boxm(size)
              mi.material_override = m
              mi.position = pos
              mi.rotation_degrees = rot
              p.add_child(mi)
              return mi

          func _sph(p: Node, r: float, pos: Vector3, m: Material, sc: Vector3 = Vector3.ONE) -> MeshInstance3D:
              var key := "s%.3f" % r
              var sm: SphereMesh
              if mcache.has(key):
                  sm = mcache[key]
              else:
                  sm = SphereMesh.new()
                  sm.radius = r
                  sm.height = r * 2.0
                  mcache[key] = sm
              var mi := MeshInstance3D.new()
              mi.mesh = sm
              mi.material_override = m
              mi.position = pos
              mi.scale = sc
              p.add_child(mi)
              return mi

          # Cápsula entre dos puntos (miembros y torso)
          func _seg(p: Node, a: Vector3, b: Vector3, r: float, m: Material) -> void:
              var d := b - a
              var L := d.length()
              var dn := d.normalized()
              var bas := Basis.IDENTITY
              if absf(dn.y) < 0.999:
                  bas = Basis(Quaternion(Vector3.UP, dn))
              var holder := Node3D.new()
              holder.transform = Transform3D(bas, (a + b) * 0.5)
              p.add_child(holder)
              var key := "c%.3f|%.3f" % [r, L + 2.0 * r]
              var cm: CapsuleMesh
              if mcache.has(key):
                  cm = mcache[key]
              else:
                  cm = CapsuleMesh.new()
                  cm.radius = r
                  cm.height = L + 2.0 * r
                  mcache[key] = cm
              var mi := MeshInstance3D.new()
              mi.mesh = cm
              mi.material_override = m
              holder.add_child(mi)

          func _mmi(mesh: Mesh, mat: Material, xs: Array) -> void:
              if xs.is_empty():
                  return
              var mm := MultiMesh.new()
              mm.transform_format = MultiMesh.TRANSFORM_3D
              mm.mesh = mesh
              mm.instance_count = xs.size()
              for i in xs.size():
                  mm.set_instance_transform(i, xs[i])
              var mi := MultiMeshInstance3D.new()
              mi.multimesh = mm
              mi.material_override = mat
              world.add_child(mi)

          func _collider(size: Vector3, pos: Vector3) -> void:
              var body := StaticBody3D.new()
              var cs := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              cs.shape = bs
              body.add_child(cs)
              body.position = pos
              world.add_child(body)

          # ================= PERSONAJES =================
          func _skin_col(s: Dictionary) -> Color:
              if s["kind"] == "animatronic":
                  return s["body"]
              return Color(0.86, 0.66, 0.5)

          func _build_char(s: Dictionary, is_bot: bool, team: int) -> CharacterBody3D:
              var root := CharacterBody3D.new()
              var cs := CollisionShape3D.new()
              var cap := CapsuleShape3D.new()
              cap.radius = 0.38
              cap.height = 1.9
              cs.shape = cap
              cs.position = Vector3(0, 0.95, 0)
              root.add_child(cs)

              var body := Node3D.new()
              root.add_child(body)
              var anim: bool = s["kind"] == "animatronic"
              var skin_c: Color = _skin_col(s)
              var cloth_c: Color = skin_c.darkened(0.2) if anim else s["cloth"]
              var tex := "camo" if s.get("camo", false) else ""
              var m_skin := _mat(skin_c, 0.45)
              var m_cloth := _mat(cloth_c, 0.9, 0.0, tex)
              var m_boot := _mat(Color(0.2, 0.13, 0.07), 0.5)
              var m_glove := _mat(Color(0.18, 0.13, 0.09), 0.8)
              var m_mask := _mat(s.get("mask", Color(0.04, 0.04, 0.05)), 0.97)
