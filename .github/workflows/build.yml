name: Build Unity APK Battle Royale

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.20f1
  PROJECT_PATH: unity-game

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Crear proyecto Unity (scripts y escena)
        run: |
          mkdir -p ${PROJECT_PATH}/Assets/Scripts ${PROJECT_PATH}/Assets/Editor ${PROJECT_PATH}/ProjectSettings

          cat > ${PROJECT_PATH}/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 2022.3.20f1
          m_EditorVersionWithRevision: 2022.3.20f1 (c3fb0c8b0a4b)
          EOF

          cat > ${PROJECT_PATH}/Assets/Editor/BuildScript.cs << 'EOF'
          using UnityEditor;
          using UnityEngine;

          public static class BuildScript
          {
              public static void BuildAndroid()
              {
                  PlayerSettings.companyName = "EjemploBR";
                  PlayerSettings.productName = "Battle Royale";
                  PlayerSettings.applicationIdentifier = "com.ejemplo.battleroyale";
                  PlayerSettings.defaultInterfaceOrientation = UIOrientation.LandscapeLeft;
                  PlayerSettings.allowedAutorotateToPortrait = false;
                  PlayerSettings.allowedAutorotateToPortraitUpsideDown = false;
                  PlayerSettings.allowedAutorotateToLandscapeLeft = true;
                  PlayerSettings.allowedAutorotateToLandscapeRight = true;
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;
                  PlayerSettings.SetScriptingBackend(BuildTargetGroup.Android, ScriptingImplementation.IL2CPP);
                  PlayerSettings.Android.minSdkVersion = AndroidSdkVersions.AndroidApiLevel24;
                  EditorUserBuildSettings.buildAppBundle = false;
                  EditorUserBuildSettings.androidBuildSystem = AndroidBuildSystem.Gradle;
                  EditorUserBuildSettings.SwitchActiveBuildTarget(BuildTargetGroup.Android, BuildTarget.Android);

                  string[] scenes = { "Assets/Scenes/Main.unity" };
                  BuildPipeline.BuildPlayer(scenes, "Build/BattleRoyale.apk", BuildTarget.Android, BuildOptions.None);
              }
          }
          EOF

          cat > ${PROJECT_PATH}/Assets/Scripts/GameManager.cs << 'EOF'
          using UnityEngine;
          using UnityEngine.UI;
          using System.Collections.Generic;

          public class GameManager : MonoBehaviour
          {
              public const int NumBots = 19;
              public static readonly float[][] ZonePhases = {
                  new float[]{50f, 85f}, new float[]{110f, 45f}, new float[]{170f, 20f}, new float[]{230f, 6f}
              };

              float matchTime, zoneRadius = 130f, zoneTarget = 130f;
              int zonePhase, kills;
              bool running, ready;
              float countdown = 3.5f;
              Transform zone;
              readonly List<Character> bots = new List<Character>();
              Character player;
              Text hud, msg;

              void Start()
              {
                  BuildEnvironment();
                  SpawnPlayer();
                  SpawnBots();
                  BuildHud();
                  running = true;
              }

              void Update()
              {
                  if (!running) return;
                  if (!ready)
                  {
                      countdown -= Time.deltaTime;
                      if (countdown <= 0f) { ready = true; msg.text = ""; }
                      else msg.text = Mathf.CeilToInt(countdown).ToString();
                      return;
                  }
                  matchTime += Time.deltaTime;
                  UpdateZone();
                  hud.text = "Vivos: " + (1 + bots.FindAll(b => b.alive).Count) + "   Eliminaciones: " + kills + "   Zona: " + Mathf.RoundToInt(zoneRadius) + " m";
              }

              void BuildEnvironment()
              {
                  var sun = new GameObject("Sun").AddComponent<Light>();
                  sun.type = LightType.Directional;
                  sun.transform.rotation = Quaternion.Euler(55, 30, 0);
                  sun.shadows = LightShadows.Soft;

                  var ground = GameObject.CreatePrimitive(PrimitiveType.Plane);
                  ground.name = "Ground";
                  ground.transform.localScale = new Vector3(26f, 1f, 26f);
                  ground.GetComponent<Renderer>().material.color = new Color(0.42f, 0.72f, 0.35f);

                  var water = GameObject.CreatePrimitive(PrimitiveType.Plane);
                  water.name = "Water";
                  water.transform.position = new Vector3(0, -0.8f, 0);
                  water.transform.localScale = new Vector3(90f, 1f, 90f);
                  water.GetComponent<Renderer>().material.color = new Color(0.23f, 0.65f, 0.91f);

                  for (int i = 0; i < 16; i++)
                  {
                      var p = RandomFree(24f, 105f);
                      float w = Random.Range(6f, 11f), d = Random.Range(6f, 11f), h = Random.Range(4f, 7f);
                      var b = GameObject.CreatePrimitive(PrimitiveType.Cube);
                      b.transform.localScale = new Vector3(w, h, d);
                      b.transform.position = new Vector3(p.x, h * 0.5f, p.y);
                      b.GetComponent<Renderer>().material.color = new Color(0.95f, 0.88f, 0.75f);
                      var roof = GameObject.CreatePrimitive(PrimitiveType.Cube);
                      roof.transform.localScale = new Vector3(w + 0.8f, 0.6f, d + 0.8f);
                      roof.transform.position = new Vector3(p.x, h + 0.3f, p.y);
                      roof.GetComponent<Renderer>().material.color = new Color(0.55f, 0.24f, 0.17f);
                  }

                  for (int i = 0; i < 90; i++)
                  {
                      var p = RandomFree(10f, 118f);
                      var trunk = GameObject.CreatePrimitive(PrimitiveType.Cube);
                      trunk.transform.localScale = new Vector3(0.5f, 2.4f, 0.5f);
                      trunk.transform.position = new Vector3(p.x, 1.2f, p.y);
                      trunk.GetComponent<Renderer>().material.color = new Color(0.42f, 0.27f, 0.14f);
                      var leaves = GameObject.CreatePrimitive(PrimitiveType.Sphere);
                      float r = Random.Range(1.4f, 2f);
                      leaves.transform.localScale = Vector3.one * r * 2f;
                      leaves.transform.position = new Vector3(p.x, 3.4f, p.y);
                      leaves.GetComponent<Renderer>().material.color = new Color(0.18f, 0.55f, 0.22f);
                  }

                  for (int i = 0; i < 40; i++)
                  {
                      var p = RandomFree(10f, 112f);
                      var rock = GameObject.CreatePrimitive(PrimitiveType.Sphere);
                      float r = Random.Range(0.9f, 1.5f);
                      rock.transform.localScale = new Vector3(r * 2f, r * 1.6f, r * 2f);
                      rock.transform.position = new Vector3(p.x, 0.6f, p.y);
                      rock.GetComponent<Renderer>().material.color = new Color(0.5f, 0.53f, 0.56f);
                  }

                  zone = GameObject.CreatePrimitive(PrimitiveType.Cylinder).transform;
                  zone.name = "Zone";
                  zone.localScale = new Vector3(zoneRadius * 2f, 7f, zoneRadius * 2f);
                  zone.position = new Vector3(0, 7f, 0);
                  Destroy(zone.GetComponent<Collider>());
                  var zm = zone.GetComponent<Renderer>().material;
                  zm.color = new Color(1f, 0.17f, 0.23f, 0.35f);
              }

              void SpawnPlayer()
              {
                  var p = RandomFree(30f, 80f);
                  player = Character.Build("Player", SkinData.Current(), p, true);
                  var cam = Camera.main;
                  cam.transform.SetParent(player.transform);
                  cam.transform.localPosition = new Vector3(0, 3.5f, -6f);
                  cam.transform.LookAt(player.transform.position + Vector3.up * 2f);
              }

              void SpawnBots()
              {
                  for (int i = 0; i < NumBots; i++)
                  {
                      var p = RandomFree(20f, 105f);
                      bots.Add(Character.Build("Bot" + i, SkinData.Random(), p, false));
                  }
              }

              void BuildHud()
              {
                  var canvas = new GameObject("HUD", typeof(Canvas), typeof(CanvasScaler)).GetComponent<Canvas>();
                  canvas.renderMode = RenderMode.ScreenSpaceOverlay;
                  hud = MakeText(canvas.transform, new Vector2(20, -20), 24, TextAnchor.UpperLeft);
                  msg = MakeText(canvas.transform, Vector2.zero, 96, TextAnchor.MiddleCenter);
              }

              Text MakeText(Transform parent, Vector2 pos, int size, TextAnchor anchor)
              {
                  var go = new GameObject("Text", typeof(Text));
                  go.transform.SetParent(parent, false);
                  var t = go.GetComponent<Text>();
                  t.font = Resources.GetBuiltinResource<Font>("LegacyRuntime.ttf");
                  t.fontSize = size;
                  t.alignment = anchor;
                  t.color = Color.white;
                  var rt = go.GetComponent<RectTransform>();
                  rt.anchorMin = rt.anchorMax = new Vector2(anchor == TextAnchor.UpperLeft ? 0 : 0.5f, anchor == TextAnchor.UpperLeft ? 1 : 0.5f);
                  rt.anchoredPosition = pos;
                  rt.sizeDelta = new Vector2(1200, 200);
                  return t;
              }

              void UpdateZone()
              {
                  if (zonePhase < ZonePhases.Length && matchTime >= ZonePhases[zonePhase][0])
                  {
                      zoneTarget = ZonePhases[zonePhase][1];
                      zonePhase++;
                  }
                  zoneRadius += (zoneTarget - zoneRadius) * Mathf.Min(1f, Time.deltaTime * 0.35f);
                  zone.localScale = new Vector3(zoneRadius * 2f, 7f, zoneRadius * 2f);
                  if (player.alive && new Vector2(player.transform.position.x, player.transform.position.z).magnitude > zoneRadius)
                      player.Damage(3f * Time.deltaTime, null);
                  foreach (var b in bots)
                      if (b.alive && new Vector2(b.transform.position.x, b.transform.position.z).magnitude > zoneRadius)
                          b.Damage(4f * Time.deltaTime, null);
              }

              public void RegisterKill(Character by, Character victim)
              {
                  if (by == player) kills++;
              }

              public static Vector2 RandomFree(float minR, float maxR)
              {
                  float a = Random.value * Mathf.PI * 2f, r = Random.Range(minR, maxR);
                  return new Vector2(Mathf.Cos(a) * r, Mathf.Sin(a) * r);
              }
          }
          EOF

          cat > ${PROJECT_PATH}/Assets/Scripts/Character.cs << 'EOF'
          using UnityEngine;

          public class Character : MonoBehaviour
          {
              public bool alive = true;
              public float hp = 100f;
              public bool isPlayer;
              float cd;

              public static Character Build(string name, SkinData skin, Vector2 pos, bool player)
              {
                  var go = new GameObject(name);
                  go.transform.position = new Vector3(pos.x, 0, pos.y);
                  var c = go.AddComponent<Character>();
                  c.isPlayer = player;
                  var col = go.AddComponent<CapsuleCollider>();
                  col.height = 2.3f; col.radius = 0.45f; col.center = new Vector3(0, 1.15f, 0);
                  var rb = go.AddComponent<Rigidbody>();
                  rb.freezeRotation = true;
                  c.BuildBody(skin);
                  return c;
              }

              void BuildBody(SkinData s)
              {
                  bool anim = s.isAnimatronic;
                  Color skinCol = anim ? s.bodyColor : new Color(0.94f, 0.72f, 0.55f);
                  Color vestCol = anim ? s.bodyColor * 0.75f : new Color(0.56f, 0.58f, 0.61f);
                  Color pantsCol = anim ? new Color(0.16f, 0.16f, 0.16f) : new Color(0.23f, 0.24f, 0.27f);
                  Color bootCol = new Color(0.35f, 0.23f, 0.12f);
                  Color dark = new Color(0.1f, 0.1f, 0.1f);

                  var body = new GameObject("Body").transform;
                  body.SetParent(transform, false);
                  Box(body, new Vector3(0.3f, 0.95f, 0.32f), new Vector3(-0.2f, 0.48f, 0), pantsCol);
                  Box(body, new Vector3(0.3f, 0.95f, 0.32f), new Vector3(0.2f, 0.48f, 0), pantsCol);
                  Box(body, new Vector3(0.36f, 0.22f, 0.46f), new Vector3(-0.2f, 0.11f, 0.05f), bootCol);
                  Box(body, new Vector3(0.36f, 0.22f, 0.46f), new Vector3(0.2f, 0.11f, 0.05f), bootCol);
                  Box(body, new Vector3(0.9f, 0.14f, 0.52f), new Vector3(0, 0.98f, 0), dark);
                  Box(body, new Vector3(0.9f, 1.0f, 0.5f), new Vector3(0, 1.45f, 0), vestCol);
                  Box(body, new Vector3(0.5f, 0.5f, 0.5f), new Vector3(0, 2.0f, 0), skinCol);
                  if (anim)
                  {
                      Box(body, new Vector3(0.5f, 0.12f, 0.3f), new Vector3(0, 1.72f, 0.2f), dark);
                      Box(body, new Vector3(0.2f, 0.9f, 0.12f), new Vector3(-0.2f, 2.7f, 0), skinCol);
                      Box(body, new Vector3(0.2f, 0.9f, 0.12f), new Vector3(0.2f, 2.7f, 0), skinCol);
                      for (int i = -1; i <= 1; i += 2)
                          Box(body, new Vector3(0.2f, 0.2f, 0.05f), new Vector3(i * 0.15f, 2.12f, 0.27f), s.eyeColor);
                  }
                  else
                  {
                      Box(body, new Vector3(0.52f, 0.28f, 0.52f), new Vector3(0, 1.84f, 0), dark);
                      Box(body, new Vector3(0.54f, 0.12f, 0.54f), new Vector3(0, 2.27f, 0), new Color(0.16f, 0.11f, 0.08f));
                      Box(body, new Vector3(0.62f, 0.78f, 0.26f), new Vector3(0, 1.42f, -0.38f), new Color(0.18f, 0.2f, 0.23f));
                      Box(body, new Vector3(0.12f, 0.16f, 1.0f), new Vector3(0.2f, 1.9f, -0.55f), new Color(0.1f, 0.1f, 0.1f));
                      Box(body, new Vector3(0.2f, 0.7f, 0.04f), new Vector3(0.33f, 1.42f, -0.38f), new Color(1f, 0.8f, 0f));
                      Box(body, new Vector3(0.06f, 0.28f, 0.1f), new Vector3(0.5f, 0.98f, 0.22f), dark);
                      Box(body, new Vector3(0.03f, 0.32f, 0.06f), new Vector3(0.5f, 0.7f, 0.22f), new Color(0.85f, 0.87f, 0.9f));
                  }
                  var armR = new GameObject("ArmR").transform;
                  armR.SetParent(body, false);
                  armR.localPosition = new Vector3(0.63f, 1.8f, 0);
                  armR.localRotation = Quaternion.Euler(-77f, 0, 0);
                  Box(armR, new Vector3(0.3f, 0.6f, 0.3f), new Vector3(0, -0.3f, 0), vestCol);
                  Box(armR, new Vector3(0.26f, 0.5f, 0.26f), new Vector3(0, -0.85f, 0), skinCol);
                  var gun = new GameObject("Gun").transform;
                  gun.SetParent(armR, false);
                  gun.localPosition = new Vector3(0, -1.1f, 0.05f);
                  Box(gun, new Vector3(0.1f, 0.15f, 0.9f), Vector3.zero, new Color(0.16f, 0.17f, 0.2f));
                  Box(gun, new Vector3(0.09f, 0.14f, 0.42f), new Vector3(0, 0, -0.45f), new Color(0.48f, 0.29f, 0.13f));
              }

              static void Box(Transform parent, Vector3 size, Vector3 pos, Color c)
              {
                  var b = GameObject.CreatePrimitive(PrimitiveType.Cube);
                  b.transform.SetParent(parent, false);
                  b.transform.localScale = size;
                  b.transform.localPosition = pos;
                  b.GetComponent<Renderer>().material.color = c;
                  Destroy(b.GetComponent<Collider>());
              }

              public void Damage(float amt, Character by)
              {
                  if (!alive) return;
                  hp -= amt;
                  if (hp <= 0f)
                  {
                      alive = false;
                      transform.rotation = Quaternion.Euler(-90, transform.eulerAngles.y, 0);
                  }
              }
          }
          EOF

          cat > ${PROJECT_PATH}/Assets/Scripts/SkinData.cs << 'EOF'
          using UnityEngine;

          public class SkinData
          {
              public string name;
              public bool isAnimatronic;
              public Color bodyColor = new Color(0.72f, 0.74f, 0.76f);
              public Color eyeColor = Color.green;

              public static readonly SkinData[] All = {
                  new SkinData { name = "Operador" },
                  new SkinData { name = "Springtrap", isAnimatronic = true, bodyColor = new Color(0.85f, 0.8f, 0.17f), eyeColor = new Color(0.22f, 1f, 0.42f) },
                  new SkinData { name = "Freddy", isAnimatronic = true, bodyColor = new Color(0.48f, 0.29f, 0.16f), eyeColor = new Color(0.31f, 0.76f, 1f) }
              };

              public static int selected = 0;
              public static SkinData Current() => All[selected];
              public static SkinData Random() => All[UnityEngine.Random.Range(0, All.Length)];
          }
          EOF

          cat > ${PROJECT_PATH}/Assets/Scripts/PlayerController.cs << 'EOF'
          using UnityEngine;

          public class PlayerController : MonoBehaviour
          {
              public float speed = 6f;

              void Update()
              {
                  float h = Input.GetAxis("Horizontal"), v = Input.GetAxis("Vertical");
                  Vector3 dir = (transform.forward * v + transform.right * h).normalized;
                  transform.position += dir * speed * Time.deltaTime;
                  transform.Rotate(0, Input.GetAxis("Mouse X") * 2f, 0);
              }
          }
          EOF

      - name: Crear escena inicial
        run: |
          mkdir -p ${PROJECT_PATH}/Assets/Scenes
          cat > ${PROJECT_PATH}/Assets/Editor/SceneSetup.cs << 'EOF'
          using UnityEditor;
          using UnityEditor.SceneManagement;
          using UnityEngine;

          public static class SceneSetup
          {
              public static void Create()
              {
                  var scene = EditorSceneManager.NewScene(NewSceneSetup.DefaultGameObjects, NewSceneMode.Single);
                  var gm = new GameObject("GameManager");
                  gm.AddComponent<GameManagerBootstrap>();
                  EditorSceneManager.SaveScene(scene, "Assets/Scenes/Main.unity");
              }
          }

          public class GameManagerBootstrap : MonoBehaviour
          {
              void Awake() { gameObject.AddComponent<GameManager>(); }
          }
          EOF

      - name: Activar Unity y compilar APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          buildName: BattleRoyale
          androidExportType: androidPackage
          versioning: None

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-royale-unity-apk
          path: ${{ env.PROJECT_PATH }}/build/Android
