              } else {
                const e1 = B(body, 0.2, 0.9, 0.12, FUR(s.ear), -0.2, 2.7, 0); e1.rotation.z = 0.12;
                const e2 = B(body, 0.2, 0.9, 0.12, FUR(s.ear), 0.2, 2.7, 0); e2.rotation.z = -0.12;
              }
