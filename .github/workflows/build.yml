name: EL ALMACÉN - Juego de terror (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar three.js (para que funcione sin internet en el APK)
        run: |
          mkdir -p /tmp/t site/lib/three/build site/lib/three/examples/jsm/loaders site/lib/three/examples/jsm/utils
          cd /tmp/t && npm init -y >/dev/null && npm install three@0.160.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          cp /tmp/t/node_modules/three/build/three.module.js site/lib/three/build/
          cp /tmp/t/node_modules/three/examples/jsm/loaders/GLTFLoader.js site/lib/three/examples/jsm/loaders/
          cp /tmp/t/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js site/lib/three/examples/jsm/utils/

      - name: Generar el juego
        run: |
          mkdir -p site
          if [ -d assets ]; then cp -r assets site/; fi
          cp index.html site/index.html

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar el juego para el APK
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el juego
        uses: actions/download-artifact@v4
        with:
          name: site
          path: www

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "El Almacén" com.elalmacen.juego --web-dir=www
          node -e "const f='capacitor.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.backgroundColor='#000000';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowBackground">@android:color/black</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Almacen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
