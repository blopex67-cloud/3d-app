              B(body, 0.92, 0.62, 0.54, vestM, 0, 1.42, 0.02);
              B(body, 0.5, 0.46, 0.06, mat(0x6d747c, TX.metal), 0, 1.47, 0.31);
              B(body, 0.1, 0.64, 0.56, F(0x1e2226), -0.3, 1.42, 0.02);
              B(body, 0.1, 0.64, 0.56, F(0x1e2226), 0.3, 1.42, 0.02);
              B(body, 0.2, 0.2, 0.12, F(0x2d3238), -0.28, 1.04, 0.32);
              B(body, 0.2, 0.2, 0.12, F(0x2d3238), 0.28, 1.04, 0.32);
              B(body, 0.26, 0.3, 0.22, mat(0xffffff, TX.hazard), -0.5, 1.0, 0.15);
              B(body, 0.36, 0.14, 0.36, vestM, -0.6, 1.9, 0);
              B(body, 0.36, 0.14, 0.36, vestM, 0.6, 1.9, 0);
            }

            // Brazo izquierdo
