name: Build Godot APK Battle Royale

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.3-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Godot y plantillas
        run: |
          set -e
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR"/

      - name: Configurar Godot para Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Crear proyecto Godot
        run: |
          mkdir -p game/scripts game/scenes
          cd game

          cat > project.godot << 'EOF'
          config_version=5

          [application]

          config/name="Battle Royale"
          run/main_scene="res://scenes/main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=0
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"

          [input_devices]

          pointing/emulate_touch_from_mouse=false
          pointing/emulate_mouse_from_touch=true

          [rendering]

          renderer/rendering_method="mobile"
          textures/vram_compression/import_etc2_astc=true
          EOF

          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_path="../battle_royale.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.ejemplo.battleroyale"
          package/name="Battle Royale"
          package/signed=true
          package/app_category=3
          screen/orientation=0
          screen/immersive_mode=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

          cat > scenes/main.tscn << 'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/game.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/game.gd << 'EOF'
          extends Node3D

          const MAP_LIMIT := 112.0
          const NUM_BOTS := 19
          const ZONE_PHASES := [[50.0, 85.0], [110.0, 45.0], [170.0, 20.0], [230.0, 6.0]]
          const WEAPON_ORDER := ["pistola", "rifle", "escopeta"]
          const FIRE_R := 62.0
          const JUMP_R := 42.0
          const RELOAD_R := 36.0
          const ARMA_R := 32.0
          const JOY_R := 70.0

          var WEAPONS := {
              "pistola": {"name": "PISTOLA", "dmg": 18.0, "rate": 0.25, "mag": 12, "reserve": 48, "reload": 1.0, "dist": 120.0, "spread": 0.012, "pellets": 1, "auto": false},
              "rifle": {"name": "RIFLE AK", "dmg": 14.0, "rate": 0.1, "mag": 30, "reserve": 90, "reload": 1.9, "dist": 150.0, "spread": 0.02, "pellets": 1, "auto": true},
              "escopeta": {"name": "ESCOPETA", "dmg": 11.0, "rate": 0.75, "mag": 6, "reserve": 12, "reload": 2.2, "dist": 45.0, "spread": 0.07, "pellets": 6, "auto": false}
          }

          var SKINS := [
              {"name": "Operador V", "rarity": "Común", "kind": "soldier", "cloth": Color(0.55, 0.57, 0.6), "armor": Color(0.72, 0.74, 0.76), "pants": Color(0.22, 0.23, 0.25), "boots": Color(0.25, 0.15, 0.08), "mask": Color(0.04, 0.04, 0.05), "glow": true},
              {"name": "Camuflaje", "rarity": "Raro", "kind": "soldier", "cloth": Color(0.33, 0.37, 0.2), "armor": Color(0.22, 0.25, 0.15), "pants": Color(0.3, 0.32, 0.18), "boots": Color(0.2, 0.14, 0.08), "mask": Color(0.25, 0.28, 0.16), "glow": false},
              {"name": "Springtrap", "rarity": "Legendario", "kind": "animatronic", "body": Color(0.85, 0.8, 0.17), "eye": Color(0.22, 1.0, 0.42), "bow": Color(0.42, 0.17, 0.57)},
              {"name": "Freddy", "rarity": "Épico", "kind": "animatronic", "body": Color(0.48, 0.29, 0.16), "eye": Color(0.31, 0.76, 1.0), "bow": Color(0.75, 0.15, 0.17)}
          ]

          var env_node: WorldEnvironment
          var lobby_root: Node3D
          var lobby_ui: CanvasLayer
          var lobby_char: CharacterBody3D
          var lobby_btns: Array = []
          var skin_index := 0

          var mats := {}
          var mcache := {}
          var bump_tex: Texture2D
          var haz_tex: Texture2D

          var in_match := false
          var started := false
          var ended := false
          var countdown := 3.0
          var last_count := -1
          var match_time := 0.0
          var kills := 0
          var zone_radius := 130.0
          var zone_target := 130.0
          var zone_phase := 0
          var zone_mesh: MeshInstance3D

          var world: Node3D
          var cam: Camera3D
          var cam_first := true
          var shake := 0.0
          var player: CharacterBody3D
          var bots: Array = []
          var obstacles: Array = []
          var ammo := {}
          var weapon_idx := 0
          var reloading := 0.0
          var yaw := 0.0
          var pitch := 0.0

          var joy_id := -1
          var joy_origin := Vector2.ZERO
          var joy_vec := Vector2.ZERO
          var look_id := -1
          var fire_id := -1
          var firing := false
          var fire_edge := false

          var hud: CanvasLayer
          var overlay: Control
          var hud_hurt: ColorRect
          var end_panel: VBoxContainer
          var end_title: Label
          var end_sub: Label
          var msg_text := ""
          var msg_t := 0.0
          var feed_items: Array = []
          var hit_t := 0.0
          var sb_panel: StyleBoxFlat
          var sb_slot: StyleBoxFlat
          var sb_on: StyleBoxFlat
          var sb_red: StyleBoxFlat

          func _ready() -> void:
              randomize()
              _build_lobby()

          func _process(delta: float) -> void:
              if not in_match:
                  _update_lobby(delta)
                  return
              if not started:
                  countdown -= delta
                  var n := ceili(countdown)
                  if countdown <= 0.0:
                      started = true
                      _msg("¡YA!", 0.8)
                      _feed("Partida iniciada")
                  elif n != last_count:
                      last_count = n
                      _msg(str(n), 0.9)
              elif not ended:
                  match_time += delta
                  _update_player(delta)
                  _update_bots(delta)
                  _update_zone(delta)
                  if _alive_bots() == 0 and player.get_meta("st")["alive"]:
                      _show_end(true)
              _animate_all(delta)
              _update_camera(delta)
              _update_hud(delta)
              overlay.queue_redraw()

          func _input(e: InputEvent) -> void:
              if e is InputEventKey:
                  if in_match and not ended and e.pressed and not e.echo:
                      match e.keycode:
                          KEY_1:
                              _switch_weapon(0)
                          KEY_2:
                              _switch_weapon(1)
                          KEY_3:
                              _switch_weapon(2)
                          KEY_R:
                              _start_reload()
                          KEY_SPACE:
                              _jump()
                          KEY_F:
                              firing = true
                              fire_edge = true
                  elif e.keycode == KEY_F and not e.pressed:
                      firing = false
                  return
              if not in_match or ended:
                  return
              if e is InputEventScreenTouch:
                  _on_touch(e)
              elif e is InputEventScreenDrag:
                  _on_drag(e)
              elif not OS.has_feature("mobile"):
                  if e is InputEventMouseButton and e.button_index == MOUSE_BUTTON_LEFT:
                      firing = e.pressed
                      if e.pressed:
                          fire_edge = true
                  elif e is InputEventMouseMotion and (e.button_mask & MOUSE_BUTTON_MASK_RIGHT) != 0:
                      _look(e.relative)

          func _vs() -> Vector2:
              return get_viewport().get_visible_rect().size

          func _in(p: Vector2, c: Vector2, r: float) -> bool:
              return p.distance_to(c) <= r

          func _fire_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 120.0, v.y - 105.0)

          func _jump_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 252.0, v.y - 112.0)

          func _reload_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 60.0, v.y - 200.0)

          func _arma_c() -> Vector2:
              var v := _vs()
              return Vector2(v.x - 368.0, v.y - 92.0)

          func _slot_rect(i: int) -> Rect2:
              var v := _vs()
              return Rect2(v.x - 350.0 + i * 84.0, v.y - 268.0, 78.0, 42.0)

          func _ammo_rect() -> Rect2:
              var v := _vs()
              return Rect2(v.x - 350.0, v.y - 216.0, 250.0, 52.0)

          func _on_touch(e: InputEventScreenTouch) -> void:
              var p: Vector2 = e.position
              if e.pressed:
                  if _in(p, _fire_c(), FIRE_R + 18.0):
                      fire_id = e.index
                      firing = true
                      fire_edge = true
                      return
                  if _in(p, _jump_c(), JUMP_R + 12.0):
                      _jump()
                      return
                  if _in(p, _reload_c(), RELOAD_R + 12.0):
                      _start_reload()
                      return
                  if _in(p, _arma_c(), ARMA_R + 12.0):
                      _switch_weapon((weapon_idx + 1) % WEAPON_ORDER.size())
                      return
                  for i in 3:
                      if _slot_rect(i).has_point(p):
                          _switch_weapon(i)
                          return
                  if p.x < _vs().x * 0.45 and joy_id == -1:
                      joy_id = e.index
                      joy_origin = p
                      joy_vec = Vector2.ZERO
                      return
                  if look_id == -1:
                      look_id = e.index
              else:
                  if e.index == fire_id:
                      fire_id = -1
                      firing = false
                  if e.index == joy_id:
                      joy_id = -1
                      joy_vec = Vector2.ZERO
                  if e.index == look_id:
                      look_id = -1

          func _on_drag(e: InputEventScreenDrag) -> void:
              if e.index == joy_id:
                  var d: Vector2 = e.position - joy_origin
                  joy_vec = (Vector2(d.x, -d.y) / JOY_R).limit_length(1.0)
              elif e.index == look_id:
                  _look(e.relative)

          func _look(rel: Vector2) -> void:
              yaw -= rel.x * 0.0065
              pitch = clampf(pitch - rel.y * 0.004, -0.5, 0.5)

          func _aim_dir() -> Vector3:
              return Vector3(sin(yaw) * cos(pitch), sin(pitch), cos(yaw) * cos(pitch))

          # ================= MATERIALES Y MALLAS =================
          func _bump() -> Texture2D:
              if bump_tex == null:
                  var fl := FastNoiseLite.new()
                  fl.noise_type = FastNoiseLite.TYPE_SIMPLEX_SMOOTH
                  fl.frequency = 0.06
                  var nt := NoiseTexture2D.new()
                  nt.noise = fl
                  nt.width = 256
                  nt.height = 256
                  nt.seamless = true
                  nt.as_normal_map = true
                  nt.bump_strength = 3.0
                  bump_tex = nt
              return bump_tex

          func _haz() -> Texture2D:
              if haz_tex == null:
                  var img := Image.create(64, 64, false, Image.FORMAT_RGBA8)
                  for y in 64:
                      for x in 64:
                          var s := ((x + y) / 8) % 2
                          img.set_pixel(x, y, Color(1.0, 0.8, 0.0) if s == 0 else Color(0.08, 0.08, 0.08))
                  haz_tex = ImageTexture.create_from_image(img)
              return haz_tex

          func _m(c: Color, rough: float = 0.75, metal: float = 0.0, bump: bool = true) -> StandardMaterial3D:
              var key := "%s|%.2f|%.2f|%s" % [c.to_html(), rough, metal, str(bump)]
              if mats.has(key):
                  return mats[key]
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.roughness = rough
              m.metallic = metal
              if bump:
                  m.normal_enabled = true
                  m.normal_texture = _bump()
                  m.normal_scale = 0.5
              mats[key] = m
              return m

          func _haz_mat() -> StandardMaterial3D:
              if mats.has("haz"):
                  return mats["haz"]
              var m := StandardMaterial3D.new()
              m.albedo_texture = _haz()
              m.roughness = 0.5
              mats["haz"] = m
              return m

          func _glow(c: Color, e: float) -> StandardMaterial3D:
              var key := "g|%s|%.2f" % [c.to_html(), e]
              if mats.has(key):
                  return mats[key]
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.05, 0.05, 0.05)
              m.emission_enabled = true
              m.emission = c
              m.emission_energy_multiplier = e
              m.roughness = 0.3
              mats[key] = m
              return m

          func _unlit(c: Color) -> StandardMaterial3D:
              var key := "u|%s" % c.to_html()
              if mats.has(key):
                  return mats[key]
              var m := StandardMaterial3D.new()
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              m.albedo_color = c
              mats[key] = m
              return m

          func _alpha_mat(c: Color) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              m.albedo_color = c
              m.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              return m

          func _grass_mat() -> StandardMaterial3D:
              if mats.has("grass"):
                  return mats["grass"]
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.4, 0.6, 0.27)
              m.roughness = 0.95
              m.normal_enabled = true
              m.normal_texture = _bump()
              m.normal_scale = 0.8
              m.uv1_scale = Vector3(40, 40, 1)
              mats["grass"] = m
              return m

          func _water_mat() -> StandardMaterial3D:
              if mats.has("water"):
                  return mats["water"]
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.1, 0.42, 0.6)
              m.roughness = 0.08
              m.metallic = 0.2
              mats["water"] = m
              return m

          func _boxm(size: Vector3) -> BoxMesh:
              var key := "b%s" % size
              if mcache.has(key):
                  return mcache[key]
              var bm := BoxMesh.new()
              bm.size = size
              mcache[key] = bm
              return bm

          func _box(p: Node, size: Vector3, pos: Vector3, m: Material, rot: Vector3 = Vector3.ZERO) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              mi.mesh = _boxm(size)
              mi.material_override = m
              mi.position = pos
              mi.rotation_degrees = rot
              p.add_child(mi)
              return mi

          func _sph(p: Node, r: float, pos: Vector3, m: Material, sc: Vector3 = Vector3.ONE) -> MeshInstance3D:
              var key := "s%.3f" % r
              var sm: SphereMesh
              if mcache.has(key):
                  sm = mcache[key]
              else:
                  sm = SphereMesh.new()
                  sm.radius = r
                  sm.height = r * 2.0
                  mcache[key] = sm
              var mi := MeshInstance3D.new()
              mi.mesh = sm
              mi.material_override = m
              mi.position = pos
              mi.scale = sc
              p.add_child(mi)
              return mi

          # Cápsula entre dos puntos (músculos, miembros, torso)
          func _seg(p: Node, a: Vector3, b: Vector3, r: float, m: Material) -> void:
              var d := b - a
              var L := d.length()
              var holder := Node3D.new()
              p.add_child(holder)
              holder.position = (a + b) * 0.5
              var dn := d.normalized()
              var up := Vector3.UP if absf(dn.dot(Vector3.UP)) < 0.95 else Vector3.RIGHT
              holder.basis = Basis.looking_at(dn, up)
              var key := "c%.3f|%.3f" % [r, L + 2.0 * r]
              var cm: CapsuleMesh
              if mcache.has(key):
                  cm = mcache[key]
              else:
                  cm = CapsuleMesh.new()
                  cm.radius = r
                  cm.height = L + 2.0 * r
                  mcache[key] = cm
              var mi := MeshInstance3D.new()
              mi.mesh = cm
              mi.material_override = m
              mi.rotation_degrees = Vector3(90, 0, 0)
              holder.add_child(mi)

          # ================= PERSONAJES HUMANOIDES =================
          func _skin_col(s: Dictionary) -> Color:
              if s["kind"] == "animatronic":
                  return s["body"]
              return Color(0.86, 0.66, 0.5)

          func _build_char(s: Dictionary, weapon: String, is_bot: bool) -> CharacterBody3D:
              var root := CharacterBody3D.new()
              var cs := CollisionShape3D.new()
              var cap := CapsuleShape3D.new()
              cap.radius = 0.38
              cap.height = 1.9
              cs.shape = cap
              cs.position = Vector3(0, 0.95, 0)
              root.add_child(cs)

              var body := Node3D.new()
              root.add_child(body)
              var anim: bool = s["kind"] == "animatronic"
              var skin_c: Color = _skin_col(s)
              var cloth_c: Color = skin_c.darkened(0.2)
              if not anim:
                  cloth_c = s["cloth"]

              var m_skin := _m(skin_c, 0.45, 0.0, false)
              var m_cloth := _m(cloth_c, 0.9, 0.0, true)
              var m_boot := _m(Color(0.2, 0.13, 0.07), 0.5, 0.0, true)
              var m_glove := _m(Color(0.18, 0.13, 0.09), 0.8, 0.0, true)
              var m_mask := _m(s.get("mask", Color(0.04, 0.04, 0.05)), 0.97, 0.0, true)
              var m_dark := _m(Color(0.08, 0.08, 0.09), 0.5, 0.4, false)
              var m_white := _m(Color(0.95, 0.95, 0.92), 0.35, 0.0, false)
              var m_bow := _m(s.get("bow", Color(0.4, 0.15, 0.55)), 0.5, 0.0, true)
              var m_pants: StandardMaterial3D
              var m_armor: StandardMaterial3D
              if anim:
                  m_pants = _m(Color(0.14, 0.14, 0.15), 0.9, 0.0, true)
                  m_armor = m_dark
              else:
                  m_pants = _m(s["pants"], 0.9, 0.0, true)
                  m_armor = _m(s["armor"], 0.35, 0.55, false)
              var m_haz := _haz_mat()

              # Piernas con rodilla y bota
              var legs: Array = []
              for sx in [-0.16, 0.16]:
                  var hip := Node3D.new()
                  hip.position = Vector3(sx, 0.94, 0)
                  body.add_child(hip)
                  _seg(hip, Vector3.ZERO, Vector3(0, -0.46, 0), 0.115, m_pants)
                  var knee := Node3D.new()
                  knee.position = Vector3(0, -0.46, 0)
                  hip.add_child(knee)
                  _sph(knee, 0.12, Vector3.ZERO, m_pants)
                  if not anim:
                      _box(knee, Vector3(0.2, 0.16, 0.08), Vector3(0, 0.0, 0.12), m_armor)
                  _seg(knee, Vector3.ZERO, Vector3(0, -0.38, 0), 0.105, m_pants)
                  _box(knee, Vector3(0.2, 0.14, 0.4), Vector3(0, -0.42, 0.06), m_boot)
                  legs.append(hip)

              # Pelvis, cinturón y gancho
              _box(body, Vector3(0.44, 0.2, 0.26), Vector3(0, 0.98, 0), m_pants)
              _box(body, Vector3(0.48, 0.07, 0.3), Vector3(0, 1.08, 0), m_dark)

              # Torso
              if anim:
                  _seg(body, Vector3(0, 1.02, 0), Vector3(0, 1.6, 0), 0.2, m_skin)
                  _box(body, Vector3(0.36, 0.26, 0.05), Vector3(0, 1.28, 0.2), m_dark)
                  _box(body, Vector3(0.14, 0.1, 0.06), Vector3(-0.08, 1.66, 0.2), m_bow)
                  _box(body, Vector3(0.14, 0.1, 0.06), Vector3(0.08, 1.66, 0.2), m_bow)
                  _box(body, Vector3(0.05, 0.06, 0.07), Vector3(0, 1.66, 0.21), m_bow)
              else:
                  _box(body, Vector3(0.44, 0.12, 0.26), Vector3(0, 1.14, 0), m_cloth)
                  _box(body, Vector3(0.46, 0.46, 0.28), Vector3(0, 1.42, 0), m_cloth)
                  _box(body, Vector3(0.5, 0.5, 0.12), Vector3(0, 1.4, 0.19), m_armor)
                  _box(body, Vector3(0.48, 0.46, 0.1), Vector3(0, 1.4, -0.19), m_armor)
                  _box(body, Vector3(0.14, 0.18, 0.1), Vector3(-0.27, 0.98, 0.2), m_haz)
                  _box(body, Vector3(0.06, 0.12, 0.1), Vector3(-0.27, 1.12, 0.2), m_dark)
                  _box(body, Vector3(0.1, 0.14, 0.2), Vector3(0.26, 0.98, -0.12), m_dark)
                  _box(body, Vector3(0.42, 0.5, 0.2), Vector3(0, 1.42, -0.27), m_pants)
                  _box(body, Vector3(0.05, 0.07, 0.95), Vector3(0.12, 1.66, -0.5), m_dark)
                  _sph(body, 0.12, Vector3(-0.3, 1.6, 0), m_armor, Vector3(1, 0.7, 1))
                  _sph(body, 0.12, Vector3(0.3, 1.6, 0), m_armor, Vector3(1, 0.7, 1))
              _seg(body, Vector3(0, 1.66, 0), Vector3(0, 1.74, 0), 0.065, m_skin)

              # Brazo izquierdo
              var arm_l := Node3D.new()
              arm_l.position = Vector3(-0.31, 1.58, 0)
              body.add_child(arm_l)
              var sleeve_m: StandardMaterial3D = m_cloth if not anim else m_skin
              _seg(arm_l, Vector3.ZERO, Vector3(0, -0.3, 0), 0.085, sleeve_m)
              var elbow_l := Node3D.new()
              elbow_l.position = Vector3(0, -0.3, 0)
              arm_l.add_child(elbow_l)
              _seg(elbow_l, Vector3.ZERO, Vector3(0, -0.26, 0), 0.075, m_skin)
              _box(elbow_l, Vector3(0.12, 0.1, 0.12), Vector3(0, -0.32, 0), m_glove if not anim else m_skin)

              # Brazo derecho (sostiene el arma)
              var arm_r := Node3D.new()
              arm_r.position = Vector3(0.31, 1.58, 0)
              arm_r.rotation.x = -1.35
              body.add_child(arm_r)
              _seg(arm_r, Vector3.ZERO, Vector3(0, -0.3, 0), 0.085, sleeve_m)
              var elbow_r := Node3D.new()
              elbow_r.position = Vector3(0, -0.3, 0)
              arm_r.add_child(elbow_r)
              _seg(elbow_r, Vector3.ZERO, Vector3(0, -0.26, 0), 0.075, m_skin)
              _box(elbow_r, Vector3(0.12, 0.1, 0.12), Vector3(0, -0.32, 0), m_glove if not anim else m_skin)
              var hold := Node3D.new()
              hold.position = Vector3(0, -0.34, 0)
              elbow_r.add_child(hold)

              # Cabeza
              var head := Node3D.new()
              head.position = Vector3(0, 1.86, 0)
              body.add_child(head)
              if anim:
                  _sph(head, 0.16, Vector3.ZERO, m_skin, Vector3(1.05, 1.0, 0.95))
                  _sph(head, 0.09, Vector3(0, -0.06, 0.14), _m(skin_c.darkened(0.2), 0.5, 0.0, false), Vector3(1.3, 0.8, 0.8))
                  for i in 5:
                      _box(head, Vector3(0.05, 0.06, 0.03), Vector3(-0.1 + i * 0.05, -0.12, 0.155), m_white)
                  for ex in [-0.07, 0.07]:
                      _sph(head, 0.04, Vector3(ex, 0.04, 0.14), _glow(s["eye"], 2.5))
                      _box(head, Vector3(0.1, 0.012, 0.012), Vector3(ex, 0.075, 0.165), m_dark)
                      _box(head, Vector3(0.1, 0.012, 0.012), Vector3(ex, 0.005, 0.165), m_dark)
                  _box(head, Vector3(0.06, 0.3, 0.03), Vector3(-0.11, 0.27, 0), m_skin, Vector3(0, 0, 10))
                  _box(head, Vector3(0.06, 0.3, 0.03), Vector3(0.11, 0.27, 0), m_skin, Vector3(0, 0, -10))
              else:
                  _sph(head, 0.15, Vector3.ZERO, m_skin, Vector3(0.92, 1.08, 0.95))
                  _sph(head, 0.165, Vector3(0, 0.005, 0), m_mask, Vector3(0.98, 1.12, 0.98))
                  if s.get("glow", false):
                      var lb := Label3D.new()
                      lb.text = "V"
                      lb.font_size = 96
                      lb.pixel_size = 0.0021
                      lb.modulate = Color(0.7, 0.97, 1.0)
                      lb.shaded = false
                      lb.outline_size = 0
                      lb.position = Vector3(0, 0.03, 0.175)
                      head.add_child(lb)

              # Arma en la mano
              var gun := _make_gun(weapon)
              gun.rotation_degrees = Vector3(90, 0, 0)
              hold.add_child(gun)

              var st := {
                  "hp": 100.0, "alive": true, "bot": is_bot, "weapon": weapon,
                  "cd": randf_range(0.5, 1.5), "yaw": 0.0, "recoil": 0.0, "phase": 0.0,
                  "flash_t": 0.0, "vy": 0.0, "last": Vector3.ZERO,
                  "wander": Vector2.ZERO, "wander_t": 0.0,
                  "strafe": 1.0 if randf() < 0.5 else -1.0,
                  "body": body, "legs": legs, "arm_l": arm_l, "arm_r": arm_r,
                  "hold": hold, "gun": gun, "flash": gun.get_node("Flash")
              }
              root.set_meta("st", st)
              return root

          func _make_gun(kind: String) -> Node3D:
              var g := Node3D.new()
              var metal := _m(Color(0.16, 0.17, 0.19), 0.4, 0.7, false)
              var steel := _m(Color(0.5, 0.54, 0.58), 0.3, 0.9, false)
              var wood := _m(Color(0.4, 0.25, 0.12), 0.6, 0.0, true)
              var fz := 0.32
              if kind == "escopeta":
                  _box(g, Vector3(0.1, 0.1, 0.85), Vector3(0, 0, 0.1), metal)
                  _box(g, Vector3(0.07, 0.07, 0.6), Vector3(0, 0.02, 0.5), steel)
                  _box(g, Vector3(0.09, 0.09, 0.25), Vector3(0, -0.02, 0.25), wood)
                  _box(g, Vector3(0.1, 0.14, 0.4), Vector3(0, -0.02, -0.45), wood)
                  fz = 0.95
              elif kind == "rifle":
                  _box(g, Vector3(0.1, 0.13, 0.5), Vector3(0, 0, 0.1), metal)
                  _box(g, Vector3(0.05, 0.05, 0.5), Vector3(0, 0.02, 0.7), steel)
                  _box(g, Vector3(0.07, 0.2, 0.12), Vector3(0, -0.14, 0.15), metal)
                  _box(g, Vector3(0.09, 0.14, 0.45), Vector3(0, -0.01, -0.4), wood)
                  fz = 0.97
              else:
                  _box(g, Vector3(0.07, 0.1, 0.32), Vector3(0, 0, 0.1), metal)
                  _box(g, Vector3(0.06, 0.16, 0.09), Vector3(0, -0.12, -0.04), metal)
              var fl := MeshInstance3D.new()
              var fs := SphereMesh.new()
              fs.radius = 0.14
              fs.height = 0.28
              fl.mesh = fs
              fl.material_override = _glow(Color(1.0, 0.8, 0.3), 4.0)
              fl.position = Vector3(0, 0, fz)
              fl.visible = false
              fl.name = "Flash"
              g.add_child(fl)
              return g

          func _equip(c: CharacterBody3D, kind: String) -> void:
              var st: Dictionary = c.get_meta("st")
              var old = st["gun"]
              if is_instance_valid(old):
                  old.queue_free()
              var g := _make_gun(kind)
              g.rotation_degrees = Vector3(90, 0, 0)
              st["hold"].add_child(g)
              st["gun"] = g
              st["flash"] = g.get_node("Flash")
              st["weapon"] = kind

          func _animate(st: Dictionary, delta: float, spd: float) -> void:
              var sw: float = clampf(spd / 4.0, 0.0, 1.0)
              st["phase"] = float(st["phase"]) + spd * delta * 1.7
              var ph: float = st["phase"]
              var k: float = minf(1.0, delta * 16.0)
              var legs: Array = st["legs"]
              legs[0].rotation.x = lerpf(legs[0].rotation.x, sin(ph) * 0.7 * sw, k)
              legs[1].rotation.x = lerpf(legs[1].rotation.x, -sin(ph) * 0.7 * sw, k)
              var al: Node3D = st["arm_l"]
              al.rotation.x = lerpf(al.rotation.x, -sin(ph) * 0.5 * sw, k)
              var ar: Node3D = st["arm_r"]
              ar.rotation.x = lerpf(ar.rotation.x, -1.35 + float(st["recoil"]) * 0.22 + sin(ph) * 0.03 * sw, minf(1.0, delta * 20.0))
              var body: Node3D = st["body"]
              body.position.y = lerpf(body.position.y, absf(sin(ph)) * 0.05 * sw, minf(1.0, delta * 14.0))
              st["recoil"] = maxf(0.0, float(st["recoil"]) - delta * 9.0)
              st["flash_t"] = maxf(0.0, float(st["flash_t"]) - delta)
              var fl = st["flash"]
              if is_instance_valid(fl):
                  fl.visible = float(st["flash_t"]) > 0.0

          func _animate_all(delta: float) -> void:
              for c in _all_chars():
                  var st: Dictionary = c.get_meta("st")
                  if not st["alive"]:
                      continue
                  var p: Vector3 = c.position
                  var lastv: Vector3 = st["last"]
                  var spd: float = Vector2(p.x - lastv.x, p.z - lastv.z).length() / maxf(delta, 0.0001)
                  st["last"] = p
                  _animate(st, delta, spd)

          func _all_chars() -> Array:
              var arr: Array = [player]
              arr.append_array(bots)
              return arr

          # ================= LOBBY =================
          func _setup_env() -> void:
              if env_node:
                  env_node.queue_free()
              env_node = WorldEnvironment.new()
              var e := Environment.new()
              e.background_mode = Environment.BG_SKY
              var s := Sky.new()
              s.sky_material = ProceduralSkyMaterial.new()
              e.sky = s
              e.ambient_light_source = Environment.AMBIENT_SOURCE_SKY
              e.ambient_light_energy = 0.8
              e.tonemap_mode = Environment.TONE_MAPPER_ACES
              e.glow_enabled = true
              e.glow_intensity = 0.5
              e.glow_bloom = 0.05
              e.adjustment_enabled = true
              e.adjustment_contrast = 1.08
              e.adjustment_saturation = 1.08
              e.fog_enabled = true
              e.fog_density = 0.0025
              e.fog_light_color = Color(0.75, 0.84, 0.92)
              env_node.environment = e
              add_child(env_node)

