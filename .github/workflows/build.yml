name: Build APK Battle Royale

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear juego
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>Battle Royale</title>
          <style>
          [hidden]{display:none!important}
          *{box-sizing:border-box}
          html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
          #game{position:fixed;inset:0;width:100%;height:100%;display:block}

          /* ================= LOBBY ================= */
          #lobby{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 30% 10%,#3f8f5e,#17402e 55%,#06150f);animation:fadeIn .45s ease-out}
          #lobby header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));background:rgba(0,0,0,.35);font-weight:bold;animation:slideDown .5s cubic-bezier(.2,.8,.2,1)}
          .logo{font-size:22px;letter-spacing:2px;text-shadow:0 2px 0 #000}
          .logo span{color:#ffb300;display:inline-block;animation:shine 3s ease-in-out infinite}
          .cur{font-size:14px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:14px}
          #lobby main{flex:1;display:flex;flex-direction:column;min-height:0}
          #stage{flex:1;position:relative;min-height:200px}
          #prev{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;animation:fadeIn .8s ease-out}
          #sInfo{position:absolute;left:14px;top:10px;pointer-events:none;animation:fadeUp .6s .15s both}
          #sName{font-size:26px;font-weight:bold;text-shadow:0 2px 6px #000}
          #sRar{font-size:13px;color:#ffd166;font-weight:bold}
          aside{padding:12px;overflow:auto;background:rgba(0,0,0,.3);animation:slideLeft .55s cubic-bezier(.2,.8,.2,1)}
          aside h3{margin:0 0 8px;font-size:14px;letter-spacing:1px;color:#cfe8d6}
          #skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
          .sk{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:12px;padding:6px;color:#fff;font-size:12px;font-weight:bold;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s,background .2s;animation:fadeUp .45s both;animation-delay:calc(var(--i) * 60ms)}
          .sk:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
          .sk:active{transform:scale(.94)}
          .sk small{display:block;color:#aaa;font-weight:normal;font-size:10px}
          .sk.on{border-color:#ffb300;box-shadow:0 0 14px rgba(255,179,0,.55);animation:pop .35s ease-out}
          .sw{height:46px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(0,0,0,.4);transition:transform .2s}
          .sk:hover .sw{transform:scale(1.05)}
          .info{margin-top:10px;font-size:13px;background:rgba(255,255,255,.07);padding:8px 10px;border-radius:10px}
          .info b{color:#ffd166;margin-right:6px}
          #lobby footer{display:flex;align-items:center;gap:10px;padding:12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:rgba(0,0,0,.45);animation:slideUp .5s cubic-bezier(.2,.8,.2,1)}
          nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
          .nv{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:bold;transition:transform .15s,background .2s,color .2s}
          .nv:hover{background:rgba(255,255,255,.2)}
          .nv:active{transform:scale(.93)}
          .nv.on{background:#ffb300;color:#000}
          #play{background:linear-gradient(#ffc83d,#ff8a00);color:#000;border:0;border-radius:28px;padding:14px 46px;font-size:22px;font-weight:900;letter-spacing:2px;box-shadow:0 5px 0 #a04b00;transition:transform .12s,box-shadow .12s;animation:glow 1.8s ease-in-out infinite}
          #play:hover{transform:translateY(-2px)}
          #play:active{transform:translateY(4px);box-shadow:0 1px 0 #a04b00}
          @media(min-width:700px){#lobby main{flex-direction:row}aside{width:360px;max-height:none}}
          #toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 16px;border-radius:12px;font-size:14px;z-index:30;pointer-events:none;animation:toastIn .3s ease-out}

          /* ================= HUD ================= */
          #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 3px #000;animation:fadeIn .4s ease-out}
          #hud button{pointer-events:auto}
          #tl{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;display:flex;gap:8px;align-items:center;animation:slideRight .5s cubic-bezier(.2,.8,.2,1)}
          #av{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #000}
          .bar{width:170px;height:14px;background:rgba(0,0,0,.55);border-radius:8px;overflow:hidden;margin-bottom:4px;border:1px solid rgba(255,255,255,.2)}
          .bar i{display:block;height:100%;width:100%;transition:width .25s cubic-bezier(.2,.8,.2,1)}
          .hp i{background:linear-gradient(#9dff7f,#2fbf2f)}
          .ar i{background:linear-gradient(#9fe3ff,#2a7fd6)}
          #hpt{font-size:12px;font-weight:bold}
          #tc{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;font-weight:bold;animation:slideDown .5s cubic-bezier(.2,.8,.2,1)}
          #alive{background:rgba(0,0,0,.5);padding:4px 14px;border-radius:14px;font-size:15px}
          #zone{margin-top:5px;background:rgba(200,30,40,.75);padding:3px 12px;border-radius:12px;font-size:12px;transition:background .3s}
          #zone.warn{animation:zoneWarn .8s infinite}
          #mini{position:absolute;right:max(12px,env(safe-area-inset-right));top:12px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.3);animation:slideLeft .5s cubic-bezier(.2,.8,.2,1)}
          #feed{position:absolute;right:max(12px,env(safe-area-inset-right));top:142px;text-align:right;font-size:13px;width:220px}
          #feed div{background:rgba(0,0,0,.45);margin-top:4px;padding:3px 8px;border-radius:6px;display:inline-block;animation:feedIn .35s cubic-bezier(.2,.8,.2,1);transition:opacity .4s,transform .4s}
          #feed div.out{opacity:0;transform:translateX(20px)}
          #cross{position:absolute;left:50%;top:50%;width:0;height:0}
          #cross i{position:absolute;background:#fff;box-shadow:0 0 3px #000;transition:transform .12s}
          #cross i:nth-child(1){top:-18px;left:-1px;width:2px;height:10px}
          #cross i:nth-child(2){top:8px;left:-1px;width:2px;height:10px}
          #cross i:nth-child(3){left:-18px;top:-1px;width:10px;height:2px}
          #cross i:nth-child(4){left:8px;top:-1px;width:10px;height:2px}
          #cross.spread i:nth-child(1){transform:translateY(-4px)}
          #cross.spread i:nth-child(2){transform:translateY(4px)}
          #cross.spread i:nth-child(3){transform:translateX(-4px)}
          #cross.spread i:nth-child(4){transform:translateX(4px)}
          #hitm{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:0}
          #hitm.on{opacity:1;animation:hitPop .2s ease-out}
          #hitm::before,#hitm::after{content:'';position:absolute;left:8px;top:-4px;width:2px;height:26px;background:#ff3b3b;transform:rotate(45deg)}
          #hitm::after{transform:rotate(-45deg)}
          #dmg{position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(255,0,0,.65));opacity:0;transition:opacity .3s}
          #slots{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:222px;display:flex;gap:8px;animation:slideUp .5s cubic-bezier(.2,.8,.2,1)}
          .slot{width:92px;height:54px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;pointer-events:auto;transition:transform .2s,border-color .2s,box-shadow .2s}
          .slot:active{transform:scale(.92)}
          .slot.on{border-color:#ffb300;box-shadow:0 0 12px rgba(255,179,0,.7);transform:translateY(-4px)}
          .slot b{font-size:11px;color:#ddd}
          .slot span{font-size:15px;font-weight:bold}
          #fire{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:20px;width:108px;height:108px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#ff9a6b,#c93a14);color:#fff;font-weight:900;font-size:15px;box-shadow:0 5px 0 #6b1c08;touch-action:none;transition:transform .08s,box-shadow .08s}
          #fire:active{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 #6b1c08}
          .rb{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:2px solid rgba(255,255,255,.6);font-size:11px;font-weight:bold;touch-action:none;transition:transform .1s,background .15s}
          .rb:active{transform:scale(.9);background:rgba(255,255,255,.25)}
          #jump{right:146px;bottom:44px}
          #reload{right:36px;bottom:140px}
          #joyBase{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);display:none;transform:translate(-50%,-50%);animation:pop .2s ease-out}
          #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7);transition:transform .03s linear}

          /* ================= CUENTA ATRÁS ================= */
          #cd{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:96px;font-weight:900;color:#fff;text-shadow:0 6px 0 #000,0 0 30px rgba(255,255,255,.4);pointer-events:none;z-index:15;opacity:0}
          #cd.pop{animation:cdPop .9s cubic-bezier(.2,.8,.2,1)}

          /* ================= FIN ================= */
          #end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);text-align:center;z-index:20;animation:fadeIn .5s ease-out}
          #endT{font-size:34px;font-weight:900;margin:0;animation:endIn .6s cubic-bezier(.2,.9,.3,1.3)}
          #endS{font-size:16px;color:#ddd;margin:14px 0 20px;animation:fadeUp .6s .2s both}
          #backLobby{background:linear-gradient(#ffc83d,#ff8a00);color:#000;border:0;border-radius:24px;padding:12px 40px;font-size:18px;font-weight:bold;animation:fadeUp .6s .4s both;transition:transform .12s}
          #backLobby:active{transform:scale(.95)}

          /* ================= KEYFRAMES ================= */
          @keyframes fadeIn{from{opacity:0}to{opacity:1}}
          @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
          @keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
          @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
          @keyframes slideLeft{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
          @keyframes slideRight{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
          @keyframes feedIn{from{opacity:0;transform:translateX(30px) scale(.9)}to{opacity:1;transform:none}}
          @keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
          @keyframes hitPop{from{transform:translate(-50%,-50%) scale(1.9)}to{transform:translate(-50%,-50%) scale(1)}}
          @keyframes cdPop{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}25%{opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
          @keyframes endIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
          @keyframes glow{0%,100%{box-shadow:0 5px 0 #a04b00,0 0 0 rgba(255,179,0,0)}50%{box-shadow:0 5px 0 #a04b00,0 0 22px rgba(255,179,0,.7)}}
          @keyframes shine{0%,100%{text-shadow:0 0 0 #ffb300}50%{text-shadow:0 0 12px #ffe08a}}
          @keyframes zoneWarn{0%,100%{opacity:1}50%{opacity:.45}}
          @keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
          </style>
          </head>
          <body>

          <canvas id="game"></canvas>

          <div id="lobby">
            <header>
              <div class="logo">BATTLE<span>ROYALE</span></div>
              <div class="cur">💎 1200 &nbsp; 🪙 500</div>
            </header>
            <main>
              <section id="stage">
                <canvas id="prev"></canvas>
                <div id="sInfo"><div id="sName"></div><div id="sRar"></div></div>
              </section>
              <aside>
                <h3>SKINS</h3>
                <div id="skins"></div>
                <div class="info"><b>Modo</b>Battle Royale · 20 jugadores</div>
                <div class="info"><b>Mapa</b>Isla Libre</div>
              </aside>
            </main>
            <footer>
              <nav>
                <button class="nv on">👕 Personaje</button>
                <button class="nv" onclick="toast('Próximamente')">🔫 Armas</button>
                <button class="nv" onclick="toast('Próximamente')">🎁 Tienda</button>
                <button class="nv" onclick="toast('Próximamente')">👥 Amigos</button>
              </nav>
              <button id="play">JUGAR</button>
            </footer>
          </div>

          <div id="hud" hidden>
            <div id="tl"><div id="av"></div><div><div class="bar hp"><i id="hp"></i></div><div class="bar ar"><i id="ar"></i></div><div id="hpt"></div></div></div>
            <div id="tc"><div id="alive"></div><div id="zone"></div></div>
            <canvas id="mini" width="260" height="260"></canvas>
            <div id="feed"></div>
            <div id="cross"><i></i><i></i><i></i><i></i></div>
            <div id="hitm"></div>
            <div id="dmg"></div>
            <div id="slots">
              <div class="slot" id="sl0"><b></b><span></span></div>
              <div class="slot" id="sl1"><b></b><span></span></div>
              <div class="slot" id="sl2"><b></b><span></span></div>
            </div>
            <div id="joyBase"><div id="joyKnob"></div></div>
            <button class="rb" id="jump">SALTAR</button>
            <button class="rb" id="reload">RECARGAR</button>
            <button id="fire">FUEGO</button>
          </div>

          <div id="cd"></div>

          <div id="end" hidden>
            <h1 id="endT"></h1>
            <p id="endS"></p>
            <button id="backLobby">VOLVER AL LOBBY</button>
          </div>

          <script src="three.min.js"></script>
          <script>
          // ================= UTILIDADES =================
          const $ = id => document.getElementById(id);
          const V = THREE.Vector3;
          const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
          const rnd = (a, b) => a + Math.random() * (b - a);
          const pick = a => a[(Math.random() * a.length) | 0];
          const M = c => new THREE.MeshLambertMaterial({ color: c });
          const hex = c => '#' + c.toString(16).padStart(6, '0');
          const ease = (cur, target, k, dt) => cur + (target - cur) * Math.min(1, dt * k);
          function toast(t) {
            const d = document.createElement('div'); d.id = 'toast'; d.textContent = t;
            document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
          }

          // ================= TEXTURAS =================
          function makeHazard() {
            const c = document.createElement('canvas'); c.width = c.height = 64;
            const x = c.getContext('2d');
            x.fillStyle = '#111'; x.fillRect(0, 0, 64, 64);
            x.fillStyle = '#f5c400';
            for (let i = -64; i < 128; i += 32) {
              x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 16, 0); x.lineTo(i + 80, 64); x.lineTo(i + 64, 64); x.closePath(); x.fill();
            }
            return new THREE.CanvasTexture(c);
          }
          function makeGrass() {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const x = c.getContext('2d');
            x.fillStyle = '#6fbf5a'; x.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 1600; i++) {
              x.fillStyle = pick(['#63b04f', '#7ccb62', '#5aa64a', '#8fd66f']);
              x.fillRect(Math.random() * 256, Math.random() * 256, 3, 3);
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30);
            return t;
          }
          const HZ = new THREE.MeshLambertMaterial({ map: makeHazard() });
          const GRASS = makeGrass();

          // ================= SKINS =================
          const SKINS = [
            { n: 'Operador', rar: 'Común', skin: 0xefb98c, shirt: 0xb9bdc2, vest: 0x8e959c, pants: 0x3b3e44, mask: 0x121212, boots: 0x5b3a1e, bag: 0x2e333b, hair: 0x2a1d14, glove: 0x3a2a1e },
            { n: 'Camuflaje', rar: 'Raro', skin: 0xefb98c, shirt: 0x5d6b3a, vest: 0x3f4d2a, pants: 0x4a5232, mask: 0x2a2f1c, boots: 0x3c2c1a, bag: 0x6b5a2e, hair: 0x1a120a, glove: 0x2f2a1a },
            { n: 'Neón', rar: 'Épico', skin: 0xf2c4a0, shirt: 0x1d1f3a, vest: 0x00e5ff, pants: 0x1a1a2e, mask: 0x0b0b15, boots: 0x222244, bag: 0xff2bd6, hair: 0x00e5ff, glove: 0x111122 },
            { n: 'Dorado', rar: 'Legendario', skin: 0xefb98c, shirt: 0xe8c15a, vest: 0xb8860b, pants: 0x222222, mask: 0x1b1b1b, boots: 0x111111, bag: 0x8b6914, hair: 0xffd166, glove: 0x333333 },
            { n: 'Fuego', rar: 'Épico', skin: 0xefb98c, shirt: 0xcfcfcf, vest: 0xb22222, pants: 0x2b2b2b, mask: 0x0d0d0d, boots: 0x3a1f1f, bag: 0x550000, hair: 0xff6a00, glove: 0x222222 },
            { n: 'Hielo', rar: 'Raro', skin: 0xf5d0b5, shirt: 0xeaf6ff, vest: 0x7fd8ff, pants: 0x2c3e50, mask: 0x1c2833, boots: 0x34495e, bag: 0x5dade2, hair: 0xffffff, glove: 0x2e4053 }
          ];
          let selIdx = Math.min(SKINS.length - 1, parseInt(localStorage.getItem('br_skin') || '0', 10) || 0);

          // ================= ARMAS =================
          const W = {
            pistol:  { name: 'PISTOLA',  dmg: 18, rate: 0.22, mag: 12, reload: 1.0, spread: 0.012, auto: false, pell: 1, range: 120 },
            rifle:   { name: 'RIFLE AK', dmg: 14, rate: 0.10, mag: 30, reload: 1.9, spread: 0.02,  auto: true,  pell: 1, range: 150 },
            shotgun: { name: 'ESCOPETA', dmg: 11, rate: 0.75, mag: 6,  reload: 2.2, spread: 0.07,  auto: false, pell: 6, range: 45 }
          };

          // ================= RENDER JUEGO =================
          const renderer = new THREE.WebGLRenderer({ canvas: $('game'), antialias: true });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0xbfe6ff);
          scene.fog = new THREE.Fog(0xbfe6ff, 120, 260);
          const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 500);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.1));
          const sun = new THREE.DirectionalLight(0xffffff, 0.8);
          sun.position.set(40, 80, 30); scene.add(sun);
          let world = new THREE.Group(); scene.add(world);
          const ray = new THREE.Raycaster();

          // ================= RENDER LOBBY =================
          const pr = new THREE.WebGLRenderer({ canvas: $('prev'), antialias: true, alpha: true });
          pr.setPixelRatio(Math.min(devicePixelRatio, 2));
          const pscene = new THREE.Scene();
          const pcam = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
          pcam.position.set(0, 1.7, 6.6); pcam.lookAt(0, 1.1, 0);
          pscene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.2));
          const psun = new THREE.DirectionalLight(0xffffff, 0.9); psun.position.set(3, 5, 5); pscene.add(psun);
          let prevChar = null, prevEnt = null, prevRot = 0.4, prevDrag = false;

          function resize() {
            renderer.setSize(innerWidth, innerHeight, false);
            camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
            resizePreview();
          }
          function resizePreview() {
            const c = $('prev'), w = c.clientWidth, h = c.clientHeight;
            if (!w || !h) return;
            pr.setSize(w, h, false);
            pcam.aspect = w / h; pcam.updateProjectionMatrix();
          }
          addEventListener('resize', resize); resize();

          // ================= PERSONAJE (con articulaciones) =================
          function box(p, w, h, d, mat, x, y, z) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat.isMaterial ? mat : M(mat));
            m.position.set(x, y, z); p.add(m); return m;
          }
          function buildChar(s) {
            const g = new THREE.Group();
            const body = new THREE.Group(); g.add(body);
            const B = (p, w, h, d, c, x, y, z) => box(p, w, h, d, c, x, y, z);

            // Piernas: pivotes en la cadera
            const legs = [-0.2, 0.2].map(x => {
              const p = new THREE.Group(); p.position.set(x, 0.96, 0); body.add(p);
              B(p, 0.3, 0.95, 0.32, s.pants, 0, -0.475, 0);
              B(p, 0.36, 0.22, 0.46, s.boots, 0, -0.85, 0.05);
              return p;
            });
