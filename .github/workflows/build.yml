                  _box(body, Vector3(0.06, 0.28, 0.1), Vector3(0.5, 0.98, 0.22), _mat(Color(0.13, 0.13, 0.13)))
                  _box(body, Vector3(0.03, 0.32, 0.06), Vector3(0.5, 0.7, 0.22), _mat(Color(0.85, 0.87, 0.9)))
              else:
                  _box(body, Vector3(0.64, 0.7, 0.06), Vector3(0, 1.42, 0.27), _mat(skin_c.darkened(0.2)))
                  var bow := _mat(s["bow"] if s.has("bow") else Color(0.42, 0.17, 0.57))
                  _box(body, Vector3(0.16, 0.12, 0.1), Vector3(-0.11, 1.75, 0.3), bow)
                  _box(body, Vector3(0.16, 0.12, 0.1), Vector3(0.11, 1.75, 0.3), bow)
                  _box(body, Vector3(0.07, 0.08, 0.11), Vector3(0, 1.75, 0.31), bow)

              var arm_l := Node3D.new()
              arm_l.position = Vector3(-0.63, 1.8, 0)
              body.add_child(arm_l)
              _box(arm_l, Vector3(0.3, 0.7, 0.3), Vector3(0, -0.35, 0), _mat(sleeve_c))
              _box(arm_l, Vector3(0.26, 0.55, 0.26), Vector3(0, -0.97, 0), _mat(skin_c))
              _box(arm_l, Vector3(0.28, 0.2, 0.28), Vector3(0, -1.2, 0), _mat(glove_c))

              var arm_r := Node3D.new()
              arm_r.position = Vector3(0.63, 1.8, 0)
              arm_r.rotation.x = -1.35
              body.add_child(arm_r)
              _box(arm_r, Vector3(0.3, 0.6, 0.3), Vector3(0, -0.3, 0), _mat(sleeve_c))
              _box(arm_r, Vector3(0.26, 0.5, 0.26), Vector3(0, -0.85, 0), _mat(skin_c))
              _box(arm_r, Vector3(0.28, 0.24, 0.28), Vector3(0, -1.1, 0), _mat(glove_c))
              var hold := Node3D.new()
              hold.position = Vector3(0, -1.1, 0.05)
              arm_r.add_child(hold)

              var head := Node3D.new()
              head.position = Vector3(0, 2.0, 0)
              body.add_child(head)
              if anim:
                  _box(head, Vector3(0.7, 0.62, 0.56), Vector3.ZERO, _mat(skin_c))
                  _box(head, Vector3(0.3, 0.3, 0.1), Vector3(0, -0.1, 0.32), _mat(skin_c.darkened(0.2)))
                  _box(head, Vector3(0.14, 0.1, 0.1), Vector3(0, 0.0, 0.36), _mat(dark_c))
                  _box(head, Vector3(0.5, 0.12, 0.3), Vector3(0, -0.22, 0.3), _mat(dark_c))
                  for i in 5:
                      _box(head, Vector3(0.08, 0.1, 0.04), Vector3(-0.2 + i * 0.1, -0.2, 0.33), _mat(Color(0.95, 0.95, 0.95)))
                  for ex in [-0.15, 0.15]:
                      _box(head, Vector3(0.1, 0.1, 0.06), Vector3(ex, 0.12, 0.33), _unlit(eye_c))
                      _frame(head, ex, 0.12, 0.34)
                  var ear_l := _box(head, Vector3(0.2, 0.9, 0.12), Vector3(-0.2, 0.7, 0), _mat(skin_c))
                  ear_l.rotation.z = 0.12
                  var ear_r := _box(head, Vector3(0.2, 0.9, 0.12), Vector3(0.2, 0.7, 0), _mat(skin_c))
                  ear_r.rotation.z = -0.12
              else:
                  _box(head, Vector3(0.5, 0.5, 0.5), Vector3.ZERO, _mat(skin_c))
                  _box(head, Vector3(0.52, 0.28, 0.52), Vector3(0, -0.16, 0), _mat(Color(0.07, 0.07, 0.07)))
                  _box(head, Vector3(0.54, 0.12, 0.54), Vector3(0, 0.27, 0), _mat(Color(0.16, 0.11, 0.08)))
                  for ex in [-0.12, 0.12]:
                      _box(head, Vector3(0.11, 0.05, 0.02), Vector3(ex, 0.05, 0.26), _mat(Color(0.95, 0.95, 0.95)))

              var gun := _make_gun(weapon)
              hold.add_child(gun)

              var st := {
                  "hp": 100.0, "alive": true, "bot": is_bot, "weapon": weapon,
                  "cd": randf_range(0.5, 1.5), "yaw": 0.0, "recoil": 0.0, "phase": 0.0,
                  "flash_t": 0.0, "vy": 0.0, "speed": 0.0, "last": Vector3.ZERO,
                  "wander": Vector2.ZERO, "wander_t": 0.0, "strafe": 1.0,
                  "body": body, "legs": legs, "arm_l": arm_l, "arm_r": arm_r,
                  "hold": hold, "gun": gun, "flash_node": gun.get_node("Flash")
              }
              root.set_meta("st", st)
              return root

          func _frame(p: Node, x: float, y: float, z: float) -> void:
              var c := _mat(Color(0.07, 0.07, 0.07))
              _box(p, Vector3(0.2, 0.035, 0.04), Vector3(x, y + 0.08, z), c)
              _box(p, Vector3(0.2, 0.035, 0.04), Vector3(x, y - 0.08, z), c)
              _box(p, Vector3(0.035, 0.16, 0.04), Vector3(x - 0.1, y, z), c)
              _box(p, Vector3(0.035, 0.16, 0.04), Vector3(x + 0.1, y, z), c)

          func _make_gun(kind: String) -> Node3D:
              var g := Node3D.new()
              var dk := _mat(Color(0.16, 0.17, 0.2))
              var steel := _mat(Color(0.6, 0.64, 0.68))
              var wood := _mat(Color(0.48, 0.29, 0.13))
              if kind == "escopeta":
                  _box(g, Vector3(0.13, 0.13, 0.9), Vector3(0, 0, 0.05), wood)
                  _box(g, Vector3(0.1, 0.08, 0.6), Vector3(0, 0.04, 0.45), steel)
                  _box(g, Vector3(0.12, 0.15, 0.4), Vector3(0, -0.02, -0.5), wood)
              elif kind == "rifle":
                  _box(g, Vector3(0.1, 0.15, 0.9), Vector3(0, 0, 0.05), dk)
                  _box(g, Vector3(0.04, 0.05, 0.4), Vector3(0, 0.02, 0.6), steel)
                  _box(g, Vector3(0.09, 0.2, 0.12), Vector3(0, -0.17, 0.1), dk)
                  _box(g, Vector3(0.09, 0.14, 0.42), Vector3(0, 0, -0.45), wood)
              else:
                  _box(g, Vector3(0.1, 0.14, 0.36), Vector3.ZERO, dk)
                  _box(g, Vector3(0.04, 0.04, 0.12), Vector3(0, 0.02, 0.22), steel)
                  _box(g, Vector3(0.08, 0.22, 0.1), Vector3(0, -0.16, -0.1), dk)
              var flash := MeshInstance3D.new()
              var sph := SphereMesh.new()
              sph.radius = 0.16
              sph.height = 0.32
              flash.mesh = sph
              flash.material_override = _unlit(Color(1, 0.87, 0.33))
              flash.position = Vector3(0, 0.05, 0.8)
              flash.visible = false
              flash.name = "Flash"
              g.add_child(flash)
              return g

          func _equip(c: CharacterBody3D, kind: String) -> void:
              var st = c.get_meta("st")
              st.weapon = kind
              if is_instance_valid(st.gun):
                  st.gun.queue_free()
              var g := _make_gun(kind)
              st.hold.add_child(g)
              st.gun = g
              st.flash_node = g.get_node("Flash")

          func _animate(st: Dictionary, delta: float, spd: float) -> void:
              var sw: float = clampf(spd / 4.0, 0.0, 1.0)
              st.phase += spd * delta * 1.7
              var ph: float = st.phase
              var k: float = min(1.0, delta * 16.0)
              var legs: Array = st.legs
              legs[0].rotation.x = lerpf(legs[0].rotation.x, sin(ph) * 0.8 * sw, k)
              legs[1].rotation.x = lerpf(legs[1].rotation.x, -sin(ph) * 0.8 * sw, k)
              st.arm_l.rotation.x = lerpf(st.arm_l.rotation.x, -sin(ph) * 0.55 * sw, k)
              st.arm_r.rotation.x = lerpf(st.arm_r.rotation.x, -1.35 + st.recoil * 0.22, min(1.0, delta * 20.0))
              st.body.position.y = lerpf(st.body.position.y, absf(sin(ph)) * 0.06 * sw, min(1.0, delta * 14.0))
              st.recoil = max(0.0, st.recoil - delta * 9.0)
              st.flash_t = max(0.0, st.flash_t - delta)
              if is_instance_valid(st.flash_node):
                  st.flash_node.visible = st.flash_t > 0.0

          func _animate_all(delta: float) -> void:
              for c in _all_chars():
                  var st = c.get_meta("st")
                  var p: Vector3 = c.position
                  var spd := Vector2(p.x - st.last.x, p.z - st.last.z).length() / maxf(delta, 0.0001)
                  st.last = p
                  if st.alive:
                      _animate(st, delta, spd)

          # ================= JUGADOR =================
          func _update_player(delta: float) -> void:
              var st = player.get_meta("st")
              if not st.alive:
                  return
              var mv := joy_vec
              if Input.is_key_pressed(KEY_D):
                  mv.x += 1.0
              if Input.is_key_pressed(KEY_A):
                  mv.x -= 1.0
              if Input.is_key_pressed(KEY_W):
                  mv.y += 1.0
              if Input.is_key_pressed(KEY_S):
                  mv.y -= 1.0
              if Input.is_key_pressed(KEY_LEFT):
                  yaw += 2.5 * delta
              if Input.is_key_pressed(KEY_RIGHT):
                  yaw -= 2.5 * delta
              mv = mv.limit_length(1.0)
              var fwd := Vector3(sin(yaw), 0, cos(yaw))
              var right := Vector3(-cos(yaw), 0, sin(yaw))
              var dir := right * mv.x + fwd * mv.y
              if dir.length() > 0.01:
                  _move(player, dir * 6.0 * delta)

              st.vy -= 22.0 * delta
              var py: float = player.position.y + st.vy * delta
              if py <= 0.0:
                  py = 0.0
                  st.vy = 0.0
              player.position.y = py
              player.rotation.y = yaw

              st.cd = max(0.0, st.cd - delta)
              if reloading > 0.0:
                  reloading -= delta
                  if reloading <= 0.0:
                      _finish_reload()
              var wants := firing or Input.is_key_pressed(KEY_F)
              if wants and st.cd <= 0.0 and reloading <= 0.0:
                  var k: String = st.weapon
                  var a = ammo[k]
                  if a[0] > 0:
                      a[0] -= 1
                      st.cd = WEAPONS[k]["rate"]
                      st.recoil = 1.0
                      st.flash_t = 0.05
                      _fire(player, cam.global_position, _aim_dir(), 1.0, 1.0)
                  else:
                      _start_reload()

          func _jump() -> void:
              if not started or not player.get_meta("st").alive:
                  return
              var st = player.get_meta("st")
              if player.position.y <= 0.01:
                  st.vy = 8.5

          func _switch_weapon(i: int) -> void:
              if not started or not player.get_meta("st").alive:
                  return
              weapon_idx = i
              reloading = 0.0
              _equip(player, WEAPON_ORDER[i])

          func _start_reload() -> void:
              if reloading > 0.0 or not started:
                  return
              var k: String = player.get_meta("st").weapon
              var a = ammo[k]
              if a[0] >= WEAPONS[k]["mag"] or a[1] <= 0:
                  return
              reloading = WEAPONS[k]["reload"]

          func _finish_reload() -> void:
              reloading = 0.0
              var k: String = player.get_meta("st").weapon
              var a = ammo[k]
              var take: int = min(WEAPONS[k]["mag"] - a[0], a[1])
              a[0] += take
              a[1] -= take

          func _aim_dir() -> Vector3:
              return Vector3(sin(yaw) * cos(pitch), sin(pitch), cos(yaw) * cos(pitch))

          func _look(rel: Vector2) -> void:
              yaw -= rel.x * 0.006
              pitch = clampf(pitch - rel.y * 0.004, -0.5, 0.5)

          func _fire_pos() -> Vector2:
              var vs := get_viewport().get_visible_rect().size
              return Vector2(vs.x - 110.0, vs.y - 110.0)

          func _jump_pos() -> Vector2:
              var vs := get_viewport().get_visible_rect().size
              return Vector2(vs.x - 240.0, vs.y - 100.0)

          func _weap_pos() -> Vector2:
              var vs := get_viewport().get_visible_rect().size
              return Vector2(vs.x - 110.0, vs.y - 240.0)

          # ================= DISPARO =================
          func _fire(shooter: Node3D, origin: Vector3, dir: Vector3, spread_mul: float, dmg_mul: float) -> void:
              var st = shooter.get_meta("st")
              var w = WEAPONS[st.weapon]
              var space := get_world_3d().direct_space_state
              for i in w["pellets"]:
                  var sp: float = w["spread"] * spread_mul
                  var d: Vector3 = (dir + Vector3(randf_range(-sp, sp), randf_range(-sp, sp), randf_range(-sp, sp))).normalized()
                  var end: Vector3 = origin + d * float(w["dist"])
                  var q := PhysicsRayQueryParameters3D.create(origin, end)
                  q.exclude = [shooter.get_rid()]
                  var hit := space.intersect_ray(q)
                  if not hit.is_empty():
                      end = hit.position
                      var col: Node3D = hit.collider
                      if col != shooter and col.has_meta("st"):
                          if col.get_meta("st").alive:
                              _damage(col, float(w["dmg"]) * dmg_mul, shooter)
                  _tracer(origin, end, not st.bot)

          func _tracer(a: Vector3, b: Vector3, mine: bool) -> void:
              var mi := MeshInstance3D.new()
              var im := ImmediateMesh.new()
              im.surface_begin(Mesh.PRIMITIVE_LINES)
              im.surface_add_vertex(a)
              im.surface_add_vertex(b)
              im.surface_end()
              mi.mesh = im
              mi.material_override = _unlit(Color(1, 0.9, 0.4) if mine else Color(1, 0.4, 0.4))
              world.add_child(mi)
              get_tree().create_timer(0.07).timeout.connect(func():
                  if is_instance_valid(mi):
                      mi.queue_free())

          func _damage(c: Node3D, amt: float, by: Node3D) -> void:
              var st = c.get_meta("st")
              if not st.alive:
                  return
              st.hp -= amt
              if c == player:
                  hurt_rect.color = Color(1, 0, 0, 0.35)
                  shake = min(0.5, shake + 0.2)
              if st.hp > 0.0:
                  return
              st.hp = 0.0
              st.alive = false
              var t := create_tween()
              t.tween_property(c, "rotation:x", -PI / 2.0, 0.35).set_trans(Tween.TRANS_QUAD)
              if c == player:
                  _feed("Te eliminaron")
                  get_tree().create_timer(1.3).timeout.connect(_show_end.bind(false))
              elif by == player:
                  kills += 1
                  _feed("Eliminaste a un enemigo")

          # ================= BOTS =================
          func _update_bots(delta: float) -> void:
              var pp: Vector3 = player.position
              var pl_alive: bool = player.get_meta("st").alive
              for b in bots:
                  var st = b.get_meta("st")
                  if not st.alive:
                      continue
                  var p: Vector3 = b.position
                  var to := Vector2(pp.x - p.x, pp.z - p.z)
                  var d := to.length()
                  var dirv := to.normalized()
                  st.cd -= delta
                  if pl_alive and d < 42.0:
                      st.yaw = atan2(dirv.x, dirv.y)
                      var step := 3.2 * delta
                      if d > 18.0:
                          _move(b, Vector3(dirv.x, 0, dirv.y) * step)
                      elif d < 9.0:
                          _move(b, -Vector3(dirv.x, 0, dirv.y) * step)
                      else:
                          var perp: Vector2 = Vector2(-dirv.y, dirv.x) * st.strafe
                          _move(b, Vector3(perp.x, 0, perp.y) * step)
                      if st.cd <= 0.0:
                          var origin: Vector3 = p + Vector3(0, 2.0, 0) + Vector3(sin(st.yaw), 0, cos(st.yaw)) * 0.6
                          var target: Vector3 = pp + Vector3(0, 1.3, 0)
                          _fire(b, origin, (target - origin).normalized(), 2.2, 0.6)
                          st.cd = randf_range(0.7, 1.4)
                  else:
                      st.wander_t -= delta
                      var wp: Vector2 = st.wander
                      if st.wander_t <= 0.0 or Vector2(p.x, p.z).distance_to(wp) < 1.0:
                          st.wander = _random_free(10.0, 95.0)
                          st.wander_t = randf_range(4.0, 9.0)
                          wp = st.wander
                      var tw: Vector2 = (wp - Vector2(p.x, p.z)).normalized()
                      _move(b, Vector3(tw.x, 0, tw.y) * 2.2 * delta)
                      st.yaw = atan2(tw.x, tw.y)
                  b.rotation.y = lerp_angle(b.rotation.y, st.yaw, min(1.0, delta * 8.0))

          func _alive_bots() -> int:
              var n := 0
              for b in bots:
                  if b.get_meta("st").alive:
                      n += 1
              return n

          func _all_chars() -> Array:
              var arr: Array = [player]
              arr.append_array(bots)
              return arr

          # ================= ZONA =================
          func _update_zone(delta: float) -> void:
              if zone_phase < ZONE_PHASES.size() and match_time >= ZONE_PHASES[zone_phase][0]:
                  zone_target = ZONE_PHASES[zone_phase][1]
                  zone_phase += 1
                  _feed("La zona se reduce")
              zone_radius = lerpf(zone_radius, zone_target, min(1.0, delta * 0.35))
              zone_mesh.scale = Vector3(zone_radius, 1.0, zone_radius)
              for c in _all_chars():
                  var p: Vector3 = c.position
                  if Vector2(p.x, p.z).length() > zone_radius:
                      _damage(c, (3.0 if c == player else 4.0) * delta, null)

          # ================= CÁMARA =================
          func _update_camera(delta: float) -> void:
              if not player or not cam:
                  return
              var pp: Vector3 = player.position
              var pivot := pp + Vector3(0, 2.4, 0)
              var flat := Vector3(sin(yaw), 0, cos(yaw))
              var desired := pivot - flat * 6.5 + Vector3.UP * (1.2 + pitch * 3.0)
              var q := PhysicsRayQueryParameters3D.create(pivot, desired)
              q.exclude = [player.get_rid()]
              var hit := get_world_3d().direct_space_state.intersect_ray(q)
              if not hit.is_empty():
                  var hp: Vector3 = hit.position
                  desired = hp + (pivot - hp).normalized() * 0.3
              if cam_first:
                  cam.global_position = desired
                  cam_first = false
              else:
                  cam.global_position = cam.global_position.lerp(desired, minf(1.0, delta * 14.0))
              if shake > 0.0:
                  cam.global_position += Vector3(randf_range(-1, 1), randf_range(-1, 1), 0) * shake * 0.2
                  shake = max(0.0, shake - delta * 2.2)
              cam.look_at(pivot + _aim_dir() * 10.0, Vector3.UP)

          # ================= HUD =================
          func _build_hud() -> void:
              var vs := get_viewport().get_visible_rect().size
              hud = CanvasLayer.new()
              add_child(hud)

              overlay = Control.new()
              overlay.set_anchors_preset(Control.PRESET_FULL_RECT)
              overlay.mouse_filter = Control.MOUSE_FILTER_IGNORE
              hud.add_child(overlay)
              overlay.draw.connect(_draw_overlay)

              hurt_rect = ColorRect.new()
              hurt_rect.set_anchors_preset(Control.PRESET_FULL_RECT)
              hurt_rect.mouse_filter = Control.MOUSE_FILTER_IGNORE
              hurt_rect.color = Color(1, 0, 0, 0)
              hud.add_child(hurt_rect)

              hud_hp = ProgressBar.new()
              hud_hp.position = Vector2(20, 20)
              hud_hp.size = Vector2(260, 22)
              hud_hp.max_value = 100.0
              hud_hp.show_percentage = false
              hud.add_child(hud_hp)

              hud_top = _label(hud, Vector2(20, 50), 20, HORIZONTAL_ALIGNMENT_LEFT, Vector2(500, 30))
              hud_ammo = _label(hud, Vector2(vs.x - 380, vs.y - 90), 26, HORIZONTAL_ALIGNMENT_RIGHT, Vector2(360, 40))
              feed_label = _label(hud, Vector2(vs.x - 420, 20), 18, HORIZONTAL_ALIGNMENT_RIGHT, Vector2(400, 30))
              hud_msg = _label(hud, Vector2(vs.x * 0.5 - 300, vs.y * 0.3), 96, HORIZONTAL_ALIGNMENT_CENTER, Vector2(600, 140))

              end_panel = VBoxContainer.new()
              end_panel.position = Vector2(vs.x * 0.5 - 200, vs.y * 0.22)
              end_panel.custom_minimum_size = Vector2(400, 0)
              end_panel.add_theme_constant_override("separation", 14)
              end_panel.visible = false
              hud.add_child(end_panel)
              end_title = Label.new()
              end_title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              end_title.add_theme_font_size_override("font_size", 52)
              end_panel.add_child(end_title)
              end_sub = Label.new()
              end_sub.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              end_sub.add_theme_font_size_override("font_size", 22)
              end_panel.add_child(end_sub)
              var back := Button.new()
              back.text = "VOLVER AL LOBBY"
              back.custom_minimum_size = Vector2(340, 70)
              back.add_theme_font_size_override("font_size", 24)
              back.pressed.connect(_back_to_lobby)
              end_panel.add_child(back)

          func _label(parent: Node, pos: Vector2, fsize: int, align: HorizontalAlignment, sz: Vector2) -> Label:
              var l := Label.new()
              l.position = pos
              l.size = sz
              l.horizontal_alignment = align
              l.add_theme_font_size_override("font_size", fsize)
              l.add_theme_color_override("font_outline_color", Color.BLACK)
              l.add_theme_constant_override("outline_size", 6)
              parent.add_child(l)
              return l

          func _update_hud(delta: float) -> void:
              if msg_t > 0.0:
                  msg_t -= delta
                  if msg_t <= 0.0:
                      hud_msg.text = ""
              if feed_t > 0.0:
                  feed_t -= delta
                  if feed_t <= 0.0:
                      feed_label.text = ""
              var st = player.get_meta("st")
              hud_hp.value = st.hp
              var alive: int = _alive_bots() + (1 if st.alive else 0)
              hud_top.text = "Vivos: %d     Eliminaciones: %d     Zona: %d m" % [alive, kills, int(zone_radius)]
              var k: String = st.weapon
              var a = ammo[k]
              var rec := "  RECARGANDO" if reloading > 0.0 else ""
              hud_ammo.text = "%s   %d / %d%s" % [WEAPONS[k]["name"], a[0], a[1], rec]
              hurt_rect.color = Color(1, 0, 0, max(0.0, hurt_rect.color.a - delta * 1.5))

          func _msg(t: String, dur: float) -> void:
              hud_msg.text = t
              msg_t = dur

          func _feed(t: String) -> void:
              feed_label.text = t
              feed_t = 3.0

          func _show_end(win: bool) -> void:
              if ended:
                  return
              ended = true
              end_title.text = "VICTORIA" if win else "ELIMINADO"
              var s := int(match_time)
              end_sub.text = "Eliminaciones: %d    Tiempo: %d:%02d" % [kills, s / 60, s % 60]
              end_panel.visible = true

          func _draw_overlay() -> void:
              var vs := get_viewport().get_visible_rect().size
              var c := vs * 0.5
              overlay.draw_circle(c, 2.5, Color(1, 1, 1, 0.9))
              overlay.draw_arc(c, 10.0, 0.0, TAU, 24, Color(1, 1, 1, 0.5), 1.5)
              if joy_id != -1:
                  overlay.draw_circle(joy_origin, 60.0, Color(1, 1, 1, 0.12))
                  overlay.draw_arc(joy_origin, 60.0, 0.0, TAU, 40, Color(1, 1, 1, 0.4), 2.0)
                  overlay.draw_circle(joy_origin + Vector2(joy_vec.x, -joy_vec.y) * 60.0, 24.0, Color(1, 1, 1, 0.6))
              _draw_btn(_fire_pos(), 60.0, "FUEGO", Color(0.85, 0.25, 0.12, 0.85))
              _draw_btn(_jump_pos(), 44.0, "SALTAR", Color(0, 0, 0, 0.5))
              _draw_btn(_weap_pos(), 34.0, "ARMA", Color(0, 0, 0, 0.5))

          func _draw_btn(p: Vector2, r: float, txt: String, col: Color) -> void:
              overlay.draw_circle(p, r, col)
              overlay.draw_arc(p, r, 0.0, TAU, 32, Color(1, 1, 1, 0.7), 3.0)
              overlay.draw_string(ThemeDB.fallback_font, p + Vector2(-r, 6.0), txt, HORIZONTAL_ALIGNMENT_CENTER, r * 2.0, 16, Color.WHITE)
          EOF

      - name: Exportar APK con Godot
        run: |
          cd game
          godot --headless --import || true
          godot --headless --export-debug "Android" ../battle_royale.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-royale-godot-apk
          path: battle_royale.apk
