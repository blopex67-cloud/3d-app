              box(g, 0.04, 0.04, 0.12, st, 0, 0.02, 0.22);
              box(g, 0.08, 0.22, 0.1, dk, 0, -0.16, -0.1);
            } else if (id === 'rifle') {
              box(g, 0.1, 0.15, 0.9, dk, 0, 0, 0.05);
              box(g, 0.04, 0.05, 0.4, st, 0, 0.02, 0.6);
              box(g, 0.09, 0.2, 0.12, dk, 0, -0.17, 0.1);
              box(g, 0.09, 0.14, 0.42, wd, 0, 0, -0.45);
              box(g, 0.06, 0.06, 0.2, dk, 0, 0.12, 0.1);
