name: Build Godot APK Battle Royale

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.3-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Godot y plantillas
        run: |
          set -e
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL_DIR"/

      - name: Configurar Godot para Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Crear proyecto Godot
        run: |
          mkdir -p game/scripts game/scenes
          cd game

          cat > project.godot << 'EOF'
          config_version=5

          [application]

          config/name="Battle Royale"
          run/main_scene="res://scenes/main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=6
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"

          [input_devices]

          pointing/emulate_mouse_from_touch=false
          pointing/emulate_touch_from_mouse=false

          [rendering]

          renderer/rendering_method="mobile"
          textures/vram_compression/import_etc2_astc=true
          EOF

          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_path="../battle_royale.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.ejemplo.battleroyale"
          package/name="Battle Royale"
          package/signed=true
          package/app_category=3
          screen/orientation=6
          screen/immersive_mode=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

          cat > scenes/main.tscn << 'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/game.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/game.gd << 'EOF'
          extends Node3D

          const MAP_LIMIT := 112.0
          const NUM_BOTS := 19
          const ZONE_PHASES := [[50.0, 85.0], [110.0, 45.0], [170.0, 20.0], [230.0, 6.0]]
          const WEAPON_ORDER := ["pistola", "rifle", "escopeta"]

          var WEAPONS := {
              "pistola": {"name": "PISTOLA", "dmg": 18.0, "rate": 0.25, "mag": 12, "reserve": 48, "reload": 1.0, "dist": 120.0, "spread": 0.012, "pellets": 1},
              "rifle": {"name": "RIFLE AK", "dmg": 14.0, "rate": 0.1, "mag": 30, "reserve": 90, "reload": 1.9, "dist": 150.0, "spread": 0.02, "pellets": 1},
              "escopeta": {"name": "ESCOPETA", "dmg": 11.0, "rate": 0.75, "mag": 6, "reserve": 12, "reload": 2.2, "dist": 45.0, "spread": 0.07, "pellets": 6}
          }

          var SKINS := [
              {"name": "Operador", "rarity": "Común", "type": "soldier"},
              {"name": "Springtrap", "rarity": "Legendario", "type": "animatronic", "color": Color(0.85, 0.8, 0.17), "eye": Color(0.22, 1.0, 0.42)},
              {"name": "Freddy", "rarity": "Épico", "type": "animatronic", "color": Color(0.48, 0.29, 0.16), "eye": Color(0.31, 0.76, 1.0)}
          ]

          var _mats := {}
          var env_node: WorldEnvironment
          var lobby_root: Node3D
          var lobby_ui: CanvasLayer
          var lobby_char: CharacterBody3D
          var skin_label: Label
          var skin_index := 0

          var in_match := false
          var started := false
          var ended := false
          var countdown := 3.0
          var last_count := -1
          var match_time := 0.0
          var kills := 0
          var zone_radius := 130.0
          var zone_target := 130.0
          var zone_phase := 0
          var zone_mesh: MeshInstance3D

          var world: Node3D
          var cam: Camera3D
          var cam_first := true
          var shake := 0.0
          var player: CharacterBody3D
          var bots: Array = []
          var obstacles: Array = []
          var ammo := {}
          var weapon_idx := 0
          var reloading := 0.0
          var yaw := 0.0
          var pitch := 0.0

          var joy_id := -1
          var joy_origin := Vector2.ZERO
          var joy_vec := Vector2.ZERO
          var look_id := -1
          var fire_id := -1
          var firing := false

          var hud: CanvasLayer
          var overlay: Control
          var hud_hp: ProgressBar
          var hud_top: Label
          var hud_ammo: Label
          var hud_msg: Label
          var msg_t := 0.0
          var feed_label: Label
          var feed_t := 0.0
          var hurt_rect: ColorRect
          var end_panel: VBoxContainer
          var end_title: Label
          var end_sub: Label

          func _ready() -> void:
              randomize()
              _build_lobby()

          func _process(delta: float) -> void:
              if not in_match:
                  _update_lobby(delta)
                  return
              if not started:
                  countdown -= delta
                  var n := ceili(countdown)
                  if countdown <= 0.0:
                      started = true
                      _msg("¡YA!", 0.8)
                      _feed("Partida iniciada")
                  elif n != last_count:
                      last_count = n
                      _msg(str(n), 0.9)
              elif not ended:
                  match_time += delta
                  _update_player(delta)
                  _update_bots(delta)
                  _update_zone(delta)
                  if _alive_bots() == 0 and player.get_meta("st").alive:
                      _show_end(true)
              _animate_all(delta)
              _update_camera(delta)
              _update_hud(delta)
              overlay.queue_redraw()

          func _input(e):
              if not in_match or ended:
                  return
              var vs := get_viewport().get_visible_rect().size
              if e is InputEventScreenTouch:
                  if e.pressed:
                      if e.position.x < vs.x * 0.45 and joy_id == -1:
                          joy_id = e.index
                          joy_origin = e.position
                          joy_vec = Vector2.ZERO
                      elif e.position.distance_to(_fire_pos()) < 70.0:
                          fire_id = e.index
                          firing = true
                      elif e.position.distance_to(_jump_pos()) < 50.0:
                          _jump()
                      elif e.position.distance_to(_weap_pos()) < 40.0:
                          _switch_weapon((weapon_idx + 1) % WEAPON_ORDER.size())
                      elif look_id == -1:
                          look_id = e.index
                  else:
                      if e.index == joy_id:
                          joy_id = -1
                          joy_vec = Vector2.ZERO
                      if e.index == fire_id:
                          fire_id = -1
                          firing = false
                      if e.index == look_id:
                          look_id = -1
              elif e is InputEventScreenDrag:
                  if e.index == joy_id:
                      var d: Vector2 = e.position - joy_origin
                      joy_vec = (Vector2(d.x, -d.y) / 60.0).limit_length(1.0)
                  elif e.index == look_id:
                      _look(e.relative)
              elif e is InputEventMouseButton:
                  if e.button_index == MOUSE_BUTTON_LEFT:
                      firing = e.pressed
              elif e is InputEventMouseMotion:
                  if e.button_mask & MOUSE_BUTTON_MASK_RIGHT:
                      _look(e.relative)
              elif e is InputEventKey and e.pressed and not e.echo:
                  match e.keycode:
                      KEY_1: _switch_weapon(0)
                      KEY_2: _switch_weapon(1)
                      KEY_3: _switch_weapon(2)
                      KEY_R: _start_reload()
                      KEY_SPACE: _jump()

          # ================= LOBBY =================
          func _build_lobby() -> void:
              _setup_env(false)
              lobby_root = Node3D.new()
              add_child(lobby_root)
              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-45, 30, 0)
              lobby_root.add_child(sun)
              var lcam := Camera3D.new()
              lcam.position = Vector3(0, 2.2, 5.5)
              lobby_root.add_child(lcam)
              lcam.current = true
              lcam.look_at(Vector3(0, 1.2, 0), Vector3.UP)
              lobby_char = build_character(SKINS[skin_index], "pistola", false)
              lobby_root.add_child(lobby_char)

              lobby_ui = CanvasLayer.new()
              add_child(lobby_ui)
              var vb := VBoxContainer.new()
              vb.position = Vector2(40, 40)
              vb.add_theme_constant_override("separation", 12)
              lobby_ui.add_child(vb)
              var title := Label.new()
              title.text = "BATTLE ROYALE"
              title.add_theme_font_size_override("font_size", 44)
              vb.add_child(title)
              skin_label = Label.new()
              skin_label.add_theme_font_size_override("font_size", 24)
              vb.add_child(skin_label)
              for i in SKINS.size():
                  var b := Button.new()
                  b.text = SKINS[i]["name"] + "  ·  " + SKINS[i]["rarity"]
                  b.custom_minimum_size = Vector2(340, 56)
                  b.pressed.connect(_select_skin.bind(i))
                  vb.add_child(b)
              var play := Button.new()
              play.text = "JUGAR"
              play.custom_minimum_size = Vector2(340, 80)
              play.add_theme_font_size_override("font_size", 32)
              play.pressed.connect(_start_match)
              vb.add_child(play)
              _refresh_skin_label()

          func _refresh_skin_label() -> void:
              skin_label.text = "Skin: " + SKINS[skin_index]["name"] + " (" + SKINS[skin_index]["rarity"] + ")"

          func _select_skin(i: int) -> void:
              skin_index = i
              if lobby_char:
                  lobby_char.queue_free()
              lobby_char = build_character(SKINS[i], "pistola", false)
              lobby_root.add_child(lobby_char)
              _refresh_skin_label()

          func _update_lobby(delta: float) -> void:
              if lobby_char:
                  lobby_char.rotation.y += delta * 0.5
                  _animate(lobby_char.get_meta("st"), delta, 0.0)

          func _start_match() -> void:
              if lobby_ui:
                  lobby_ui.queue_free()
                  lobby_ui = null
              if lobby_root:
                  lobby_root.queue_free()
                  lobby_root = null
                  lobby_char = null
              if world:
                  world.queue_free()
              world = Node3D.new()
              add_child(world)
              _setup_env(true)
              _build_map()
              _spawn_player()
              _spawn_bots()
              _build_hud()
              in_match = true
              started = false
              ended = false
              countdown = 3.0
              last_count = -1
              match_time = 0.0
              kills = 0
              zone_radius = 130.0
              zone_target = 130.0
              zone_phase = 0
              reloading = 0.0
              firing = false
              joy_id = -1
              look_id = -1
              fire_id = -1
              joy_vec = Vector2.ZERO
              weapon_idx = 0
              ammo = {}
              for k in WEAPON_ORDER:
                  ammo[k] = [WEAPONS[k]["mag"], WEAPONS[k]["reserve"]]

          func _back_to_lobby() -> void:
              in_match = false
              ended = false
              if hud:
                  hud.queue_free()
                  hud = null
              if world:
                  world.queue_free()
                  world = null
              player = null
              bots.clear()
              _build_lobby()

          func _setup_env(sky: bool) -> void:
              if env_node:
                  env_node.queue_free()
              env_node = WorldEnvironment.new()
              var e := Environment.new()
              if sky:
                  e.background_mode = Environment.BG_SKY
                  var s := Sky.new()
                  s.sky_material = ProceduralSkyMaterial.new()
                  e.sky = s
                  e.ambient_light_source = Environment.AMBIENT_SOURCE_SKY
                  e.fog_enabled = true
                  e.fog_density = 0.004
              else:
                  e.background_mode = Environment.BG_COLOR
                  e.background_color = Color(0.1, 0.25, 0.18)
                  e.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
                  e.ambient_light_color = Color(0.7, 0.75, 0.7)
              env_node.environment = e
              add_child(env_node)

          # ================= MAPA =================
          func _build_map() -> void:
              obstacles.clear()
              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-55, 30, 0)
              world.add_child(sun)
              _box(world, Vector3(260, 0.2, 260), Vector3(0, -0.1, 0), _mat(Color(0.42, 0.72, 0.35)))
              _box(world, Vector3(900, 0.2, 900), Vector3(0, -0.9, 0), _mat(Color(0.23, 0.65, 0.91)))

              var walls := [Color(0.95, 0.88, 0.75), Color(0.96, 0.7, 0.42), Color(0.66, 0.85, 0.86), Color(0.85, 0.7, 0.56)]
              var roofs := [Color(0.55, 0.24, 0.17), Color(0.24, 0.25, 0.36), Color(0.43, 0.3, 0.26)]
              var glass := _mat(Color(0.17, 0.29, 0.37))
              for i in 16:
                  var p := _random_free(24.0, 105.0)
                  var w := randf_range(6.0, 11.0)
                  var d := randf_range(6.0, 11.0)
                  var h := randf_range(4.0, 7.0)
                  _box(world, Vector3(w, h, d), Vector3(p.x, h * 0.5, p.y), _mat(walls.pick_random()))
                  _box(world, Vector3(w + 0.8, 0.6, d + 0.8), Vector3(p.x, h + 0.3, p.y), _mat(roofs.pick_random()))
                  _box(world, Vector3(1.2, 1.0, 0.12), Vector3(p.x, h * 0.5, p.y + d * 0.5 + 0.02), glass)
                  _collider(Vector3(w, h, d), Vector3(p.x, h * 0.5, p.y))
                  obstacles.append(Rect2(p.x - w * 0.5 - 0.4, p.y - d * 0.5 - 0.4, w + 0.8, d + 0.8))

              var leaf_cols := [Color(0.18, 0.55, 0.22), Color(0.24, 0.61, 0.29), Color(0.15, 0.48, 0.21)]
              var trunk_m := _mat(Color(0.42, 0.27, 0.14))
              for i in 90:
                  var p := _random_free(10.0, 118.0)
                  if not _is_free(p, 1.0):
                      continue
                  _box(world, Vector3(0.5, 2.4, 0.5), Vector3(p.x, 1.2, p.y), trunk_m)
                  _collider(Vector3(0.5, 2.4, 0.5), Vector3(p.x, 1.2, p.y))
                  _sphere(world, randf_range(1.4, 2.0), Vector3(p.x, 3.4, p.y), _mat(leaf_cols.pick_random()))
                  obstacles.append(Rect2(p.x - 0.45, p.y - 0.45, 0.9, 0.9))

              for i in 40:
                  var p := _random_free(10.0, 112.0)
                  if not _is_free(p, 1.0):
                      continue
                  var r := randf_range(0.9, 1.5)
                  var rock := _sphere(world, r, Vector3(p.x, r * 0.6, p.y), _mat(Color(0.5, 0.53, 0.56)))
                  rock.scale = Vector3(1.0, 0.7, 1.0)
                  _collider(Vector3(r * 1.8, r * 1.2, r * 1.8), Vector3(p.x, r * 0.6, p.y))
                  obstacles.append(Rect2(p.x - r * 0.9, p.y - r * 0.9, r * 1.8, r * 1.8))

              zone_mesh = MeshInstance3D.new()
              var cyl := CylinderMesh.new()
              cyl.top_radius = 1.0
              cyl.bottom_radius = 1.0
              cyl.height = 14.0
              zone_mesh.mesh = cyl
              zone_mesh.material_override = _mat_alpha(Color(1, 0.17, 0.23, 0.35))
              zone_mesh.position.y = 7.0
              zone_mesh.scale = Vector3(zone_radius, 1.0, zone_radius)
              world.add_child(zone_mesh)

          func _collider(size: Vector3, pos: Vector3) -> void:
              var body := StaticBody3D.new()
              var cs := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              cs.shape = bs
              body.add_child(cs)
              body.position = pos
              world.add_child(body)

          func _box(parent: Node, size: Vector3, pos: Vector3, m: Material) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = m
              mi.position = pos
              parent.add_child(mi)
              return mi

          func _sphere(parent: Node, r: float, pos: Vector3, m: Material) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var sm := SphereMesh.new()
              sm.radius = r
              sm.height = r * 2.0
              mi.mesh = sm
              mi.material_override = m
              mi.position = pos
              parent.add_child(mi)
              return mi

          func _mat(c: Color) -> StandardMaterial3D:
              var k := c.to_html()
              if not _mats.has(k):
                  var m := StandardMaterial3D.new()
                  m.albedo_color = c
                  m.roughness = 0.85
                  _mats[k] = m
              return _mats[k]

          func _unlit(c: Color) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              return m

          func _mat_alpha(c: Color) -> StandardMaterial3D:
              var m := _unlit(c)
              m.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              return m

          func _is_free(p: Vector2, r: float) -> bool:
              if p.length() > MAP_LIMIT - r:
                  return false
              for o in obstacles:
                  var rect: Rect2 = o
                  var cx := clampf(p.x, rect.position.x, rect.end.x)
                  var cz := clampf(p.y, rect.position.y, rect.end.y)
                  if Vector2(cx, cz).distance_to(p) < r:
                      return false
              return true

          func _random_free(minr: float, maxr: float) -> Vector2:
              var p := Vector2.ZERO
              for i in 80:
                  var a := randf() * TAU
                  var r := randf_range(minr, maxr)
                  p = Vector2(cos(a) * r, sin(a) * r)
                  if _is_free(p, 1.0):
                      break
              return p

          func _move(n: Node3D, v: Vector3) -> void:
              var p: Vector3 = n.position
              var tx := Vector2(p.x + v.x, p.z)
              if _is_free(tx, 0.45):
                  p.x = tx.x
              var tz := Vector2(p.x, p.z + v.z)
              if _is_free(tz, 0.45):
                  p.z = tz.y
              n.position = p

          # ================= PERSONAJES =================
          func _spawn_player() -> void:
              var p := _random_free(30.0, 80.0)
              player = build_character(SKINS[skin_index], "pistola", false)
              player.position = Vector3(p.x, 0, p.y)
              world.add_child(player)
              player.get_meta("st").last = player.position
              yaw = randf() * TAU
              pitch = 0.0
              cam = Camera3D.new()
              world.add_child(cam)
              cam.current = true
              cam_first = true
              shake = 0.0

          func _spawn_bots() -> void:
              bots.clear()
              for i in NUM_BOTS:
                  var b := build_character(SKINS[randi() % SKINS.size()], "rifle", true)
                  var p := _random_free(20.0, 105.0)
                  b.position = Vector3(p.x, 0, p.y)
                  world.add_child(b)
                  var st = b.get_meta("st")
                  st.last = b.position
                  st.wander = _random_free(10.0, 95.0)
                  st.strafe = 1.0 if randf() < 0.5 else -1.0
                  bots.append(b)

          func build_character(s: Dictionary, weapon: String, is_bot: bool) -> CharacterBody3D:
              var root := CharacterBody3D.new()
              var anim: bool = s["type"] == "animatronic"
              var skin_c := Color(0.94, 0.72, 0.55)
              var vest_c := Color(0.56, 0.58, 0.61)
              var pants_c := Color(0.23, 0.24, 0.27)
              var boot_c := Color(0.35, 0.23, 0.12)
              var glove_c := Color(0.22, 0.17, 0.12)
              var dark_c := Color(0.1, 0.1, 0.1)
              var eye_c := Color.GREEN
              var sleeve_c := Color(0.72, 0.74, 0.76)
              if anim:
                  skin_c = s["color"]
                  vest_c = s["color"].darkened(0.25)
                  pants_c = Color(0.16, 0.16, 0.16)
                  glove_c = Color(0.2, 0.2, 0.2)
                  eye_c = s["eye"]
                  sleeve_c = skin_c

              var cs := CollisionShape3D.new()
              var cap := CapsuleShape3D.new()
              cap.radius = 0.45
              cap.height = 2.3
              cs.shape = cap
              cs.position = Vector3(0, 1.15, 0)
              root.add_child(cs)

              var body := Node3D.new()
              body.name = "Body"
              root.add_child(body)

              var legs: Array = []
              for x in [-0.2, 0.2]:
                  var hip := Node3D.new()
                  hip.position = Vector3(x, 0.96, 0)
                  body.add_child(hip)
                  _box(hip, Vector3(0.3, 0.95, 0.32), Vector3(0, -0.475, 0), _mat(pants_c))
                  _box(hip, Vector3(0.36, 0.22, 0.46), Vector3(0, -0.85, 0.05), _mat(boot_c))
                  legs.append(hip)

              _box(body, Vector3(0.9, 0.14, 0.52), Vector3(0, 0.98, 0), _mat(Color(0.12, 0.12, 0.12)))
              _box(body, Vector3(0.84, 0.95, 0.46), Vector3(0, 1.45, 0), _mat(sleeve_c))

              if not anim:
                  _box(body, Vector3(0.92, 0.62, 0.54), Vector3(0, 1.42, 0.02), _mat(vest_c))
                  _box(body, Vector3(0.5, 0.46, 0.06), Vector3(0, 1.47, 0.31), _mat(Color(0.43, 0.45, 0.48)))
                  _box(body, Vector3(0.26, 0.3, 0.22), Vector3(-0.5, 1.0, 0.15), _mat(Color(0.97, 0.8, 0.05)))
                  _box(body, Vector3(0.62, 0.78, 0.26), Vector3(0, 1.42, -0.38), _mat(Color(0.18, 0.2, 0.23)))
                  _box(body, Vector3(0.2, 0.7, 0.04), Vector3(0.33, 1.42, -0.38), _mat(Color(1, 0.8, 0)))
