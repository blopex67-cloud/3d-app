              class Renderer implements GLSurfaceView.Renderer {
                  volatile float rotX = 25f, rotY = 35f, dist = 10f;
                  volatile boolean real, camView, capture, hasSky, ready;
                  volatile int vw = 1, vh = 1;
                  private int skyId, prog, progSky;
                  private int aPos, aNrm, aUv, uMvp, uModel, uTint, uUseTex, uTex, uReal, uShadow, uCam,
                      uRough, uMetal, uHor, uZen;
                  private int aSky, uInvVP, sSkyTex, sHas, sHor, sZen;
                  private FloatBuffer gridBuf, axisX, axisY, axisZ, skyBuf, frustumBuf, markerCube;
                  private final FloatBuffer[] gAxis = new FloatBuffer[3];
                  private final FloatBuffer[] ringBufs = new FloatBuffer[3];
                  private final float[] proj = new float[16], view = new float[16], inv = new float[16];
                  private final float[] model = new float[16], tmp = new float[16], mvp = new float[16];
                  private final float[] vp = new float[16], vr = new float[16], invVP = new float[16], sm = new float[16];
                  private final float[] lastVP = new float[16];
                  private final float[] shadowM = shadowMatrix();

                  private static final String MAIN_VS =
                      "attribute vec3 aPos; attribute vec3 aNrm; attribute vec2 aUv;"
                      + "uniform mat4 uMvp; uniform mat4 uModel;"
                      + "varying vec3 vN; varying vec3 vW; varying vec2 vUv;"
                      + "void main(){ vec4 w = uModel * vec4(aPos,1.0); vW = w.xyz;"
                      + " vN = (uModel * vec4(aNrm,0.0)).xyz; vUv = aUv;"
                      + " gl_Position = uMvp * vec4(aPos,1.0); }";

                  private static final String MAIN_FS =
                      "precision mediump float;"
                      + "varying vec3 vN; varying vec3 vW; varying vec2 vUv;"
                      + "uniform vec3 uTint; uniform sampler2D uTex; uniform float uUseTex;"
                      + "uniform float uReal; uniform float uShadow; uniform vec3 uCam;"
                      + "uniform float uRough; uniform float uMetal; uniform vec3 uHor; uniform vec3 uZen;"
                      + "vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }"
                      + "void main(){"
                      + " if (uShadow > 0.5) { gl_FragColor = vec4(0.0,0.0,0.0,0.35); return; }"
                      + " vec3 base = uTint;"
                      + " if (uUseTex > 0.5) base = texture2D(uTex, vUv).rgb * uTint;"
                      + " vec3 N = normalize(vN);"
                      + " vec3 L = normalize(vec3(0.4,0.8,0.6));"
                      + " float ndl = max(dot(N,L),0.0);"
                      + " if (uReal < 0.5) { gl_FragColor = vec4(base*(0.35+0.65*ndl),1.0); return; }"
                      + " vec3 V = normalize(uCam - vW);"
                      + " vec3 H = normalize(L+V);"
                      + " float shin = mix(160.0, 8.0, uRough);"
                      + " float spec = pow(max(dot(N,H),0.0), shin) * (shin+8.0)/25.13;"
                      + " vec3 F0 = mix(vec3(0.04), base, uMetal);"
                      + " float fres = pow(1.0 - max(dot(N,V),0.0), 5.0);"
                      + " vec3 env = mix(uHor, uZen, clamp(N.y*0.5+0.5,0.0,1.0));"
                      + " vec3 kd = base*(1.0-uMetal);"
                      + " vec3 col = kd*ndl*vec3(1.0,0.97,0.9)*1.3;"
                      + " col += kd*env*0.45;"
                      + " col += F0*spec*ndl*2.5;"
                      + " col += (F0+(1.0-F0)*fres)*env*(1.0-uRough*0.8)*0.6;"
                      + " col = aces(col);"
                      + " gl_FragColor = vec4(pow(col, vec3(0.4545)), 1.0); }";

                  private static final String SKY_VS =
                      "attribute vec2 aSky; uniform mat4 uInvVP; varying vec3 vDir;"
                      + "void main(){ vec4 q = uInvVP * vec4(aSky, 0.9999, 1.0);"
                      + " vDir = q.xyz / q.w; gl_Position = vec4(aSky, 0.9999, 1.0); }";

                  private static final String SKY_FS =
                      "precision mediump float; varying vec3 vDir;"
                      + "uniform sampler2D uSkyTex; uniform float uHasSky; uniform vec3 uHor; uniform vec3 uZen;"
                      + "vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }"
                      + "void main(){"
                      + " vec3 d = normalize(vDir);"
                      + " vec3 col;"
                      + " if (uHasSky > 0.5) {"
                      + "   float u = atan(d.z, d.x)/6.28318 + 0.5;"
                      + "   float v = 0.5 + asin(clamp(d.y,-1.0,1.0))/3.14159;"
                      + "   col = pow(texture2D(uSkyTex, vec2(u, 1.0 - v)).rgb, vec3(2.2));"
                      + " } else {"
                      + "   col = mix(uHor, uZen, pow(max(d.y,0.0),0.5));"
                      + "   float sd = max(dot(d, normalize(vec3(0.4,0.8,0.6))),0.0);"
                      + "   col += vec3(1.0,0.95,0.8)*(pow(sd,600.0)*4.0 + pow(sd,8.0)*0.25);"
                      + "   if (d.y < 0.0) col = mix(col, uHor*0.35, 0.85);"
                      + " }"
                      + " col = aces(col);"
                      + " gl_FragColor = vec4(pow(col, vec3(0.4545)), 1.0); }";

                  void requestCapture() {
                      capture = true;
                  }

                  @Override
                  public void onSurfaceCreated(GL10 gl, EGLConfig c) {
                      GLES20.glClearColor(0.12f, 0.12f, 0.14f, 1f);
                      GLES20.glEnable(GLES20.GL_DEPTH_TEST);
                      GLES20.glEnable(GLES20.GL_BLEND);
                      GLES20.glBlendFunc(GLES20.GL_SRC_ALPHA, GLES20.GL_ONE_MINUS_SRC_ALPHA);
                      prog = link(MAIN_VS, MAIN_FS);
                      progSky = link(SKY_VS, SKY_FS);
                      aPos = GLES20.glGetAttribLocation(prog, "aPos");
                      aNrm = GLES20.glGetAttribLocation(prog, "aNrm");
                      aUv = GLES20.glGetAttribLocation(prog, "aUv");
                      uMvp = GLES20.glGetUniformLocation(prog, "uMvp");
                      uModel = GLES20.glGetUniformLocation(prog, "uModel");
                      uTint = GLES20.glGetUniformLocation(prog, "uTint");
                      uUseTex = GLES20.glGetUniformLocation(prog, "uUseTex");
                      uTex = GLES20.glGetUniformLocation(prog, "uTex");
                      uReal = GLES20.glGetUniformLocation(prog, "uReal");
                      uShadow = GLES20.glGetUniformLocation(prog, "uShadow");
                      uCam = GLES20.glGetUniformLocation(prog, "uCam");
                      uRough = GLES20.glGetUniformLocation(prog, "uRough");
                      uMetal = GLES20.glGetUniformLocation(prog, "uMetal");
                      uHor = GLES20.glGetUniformLocation(prog, "uHor");
                      uZen = GLES20.glGetUniformLocation(prog, "uZen");
                      aSky = GLES20.glGetAttribLocation(progSky, "aSky");
                      uInvVP = GLES20.glGetUniformLocation(progSky, "uInvVP");
                      sSkyTex = GLES20.glGetUniformLocation(progSky, "uSkyTex");
                      sHas = GLES20.glGetUniformLocation(progSky, "uHasSky");
                      sHor = GLES20.glGetUniformLocation(progSky, "uHor");
                      sZen = GLES20.glGetUniformLocation(progSky, "uZen");
                      buildStatic();
                  }

                  private int link(String vs, String fs) {
                      int p = GLES20.glCreateProgram();
                      GLES20.glAttachShader(p, compile(GLES20.GL_VERTEX_SHADER, vs));
                      GLES20.glAttachShader(p, compile(GLES20.GL_FRAGMENT_SHADER, fs));
                      GLES20.glLinkProgram(p);
                      return p;
                  }

                  private int compile(int type, String src) {
                      int s = GLES20.glCreateShader(type);
                      GLES20.glShaderSource(s, src);
                      GLES20.glCompileShader(s);
                      return s;
                  }

                  private FloatBuffer ring(int ax) {
                      int seg = 48;
                      float[] v = new float[seg * 2 * 8];
                      int k = 0;
                      for (int i = 0; i < seg; i++) {
                          double a0 = 2 * Math.PI * i / seg, a1 = 2 * Math.PI * (i + 1) / seg;
                          float[] p0 = ringPt(ax, a0), p1 = ringPt(ax, a1);
                          k = vtx(v, k, p0[0], p0[1], p0[2], 0, 1, 0, 0, 0);
                          k = vtx(v, k, p1[0], p1[1], p1[2], 0, 1, 0, 0, 0);
                      }
                      return toBuffer(v);
                  }

                  private FloatBuffer frustum() {
                      float[][] c = {
                          {-0.6f, -0.4f, -1.2f}, {0.6f, -0.4f, -1.2f},
                          {0.6f, 0.4f, -1.2f}, {-0.6f, 0.4f, -1.2f}
                      };
                      float[] v = new float[16 * 8];
                      int k = 0;
                      for (float[] p : c) {
                          k = vtx(v, k, 0, 0, 0, 0, 1, 0, 0, 0);
                          k = vtx(v, k, p[0], p[1], p[2], 0, 1, 0, 0, 0);
                      }
                      for (int i = 0; i < 4; i++) {
                          float[] a = c[i], b = c[(i + 1) % 4];
                          k = vtx(v, k, a[0], a[1], a[2], 0, 1, 0, 0, 0);
                          k = vtx(v, k, b[0], b[1], b[2], 0, 1, 0, 0, 0);
                      }
                      return toBuffer(v);
                  }

                  private void buildStatic() {
                      float[] g = new float[80 * 8];
                      int k = 0;
                      for (int i = -10; i <= 10; i++) {
                          if (i == 0) continue;
                          k = vtx(g, k, -10, -1, i, 0, 1, 0, 0, 0);
                          k = vtx(g, k, 10, -1, i, 0, 1, 0, 0, 0);
                          k = vtx(g, k, i, -1, -10, 0, 1, 0, 0, 0);
                          k = vtx(g, k, i, -1, 10, 0, 1, 0, 0, 0);
                      }
                      gridBuf = toBuffer(g);
                      axisX = lineBuf(-10, -1, 0, 10, -1, 0);
                      axisZ = lineBuf(0, -1, -10, 0, -1, 10);
                      axisY = lineBuf(0, -1, 0, 0, 4, 0);
                      for (int a = 0; a < 3; a++) {
                          gAxis[a] = lineBuf(0, 0, 0, a == 0 ? 1 : 0, a == 1 ? 1 : 0, a == 2 ? 1 : 0);
                          ringBufs[a] = ring(a);
                      }
                      skyBuf = toBuffer(new float[]{-1, -1, 3, -1, -1, 3});
                      markerCube = cubeGL().buf;
                      frustumBuf = frustum();
                  }

                  private int uploadTex(Bitmap src) {
                      Bitmap bmp = src;
                      if (src.getWidth() > 2048 || src.getHeight() > 2048) {
                          float sc = 2048f / Math.max(src.getWidth(), src.getHeight());
                          bmp = Bitmap.createScaledBitmap(src,
                              Math.round(src.getWidth() * sc), Math.round(src.getHeight() * sc), true);
                      }
                      int[] t = new int[1];
                      GLES20.glGenTextures(1, t, 0);
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, t[0]);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE);
                      GLUtils.texImage2D(GLES20.GL_TEXTURE_2D, 0, bmp, 0);
                      return t[0];
                  }

                  private Obj makeObj(Model m) {
                      Obj o = new Obj(m.name, new float[]{1f, 1f, 1f});
                      float[] mn = {1e9f, 1e9f, 1e9f}, mx = {-1e9f, -1e9f, -1e9f};
                      for (Part p : m.parts) {
                          GLPart g = new GLPart();
                          g.buf = toBuffer(p.verts);
                          g.count = p.verts.length / 8;
                          g.tex = p.tex != null ? uploadTex(p.tex) : 0;
                          o.parts.add(g);
                          for (int i = 0; i < p.verts.length; i += 8) {
                              for (int a = 0; a < 3; a++) {
                                  mn[a] = Math.min(mn[a], p.verts[i + a]);
                                  mx[a] = Math.max(mx[a], p.verts[i + a]);
                              }
                          }
                      }
                      o.bmin = mn;
                      o.bmax = mx;
                      o.box = boxEdges(mn, mx);
                      return o;
                  }

                  private void processPending() {
                      Model m;
                      while ((m = pendingModels.poll()) != null) {
                          Obj o = makeObj(m);
                          synchronized (scene) {
                              for (Obj x : scene) x.selected = false;
                              o.selected = true;
                              scene.add(o);
                          }
                          uiRefresh();
                      }
                      Bitmap bm;
                      while ((bm = pendingTex.poll()) != null) {
                          int id = uploadTex(bm);
                          synchronized (scene) {
                              for (Obj x : scene) {
                                  if (x.selected) {
                                      for (GLPart g : x.parts) g.tex = id;
                                  }
                              }
                          }
                          uiRefresh();
                      }
                      while ((bm = pendingSky.poll()) != null) {
                          skyId = uploadTex(bm);
                          hasSky = true;
                          real = true;
                          uiRefresh();
                      }
                  }

                  float[] project(float x, float y, float z) {
                      if (!ready) return null;
                      float[] src = {x, y, z, 1f};
                      float[] out = new float[4];
                      synchronized (lastVP) {
                          Matrix.multiplyMV(out, 0, lastVP, 0, src, 0);
                      }
                      if (out[3] <= 0.0001f) return null;
                      return new float[]{
                          (out[0] / out[3] + 1f) * 0.5f * vw,
                          (1f - out[1] / out[3]) * 0.5f * vh
                      };
                  }

                  private void setMats(float[] m) {
                      Matrix.multiplyMM(tmp, 0, view, 0, m, 0);
                      Matrix.multiplyMM(mvp, 0, proj, 0, tmp, 0);
                      GLES20.glUniformMatrix4fv(uMvp, 1, false, mvp, 0);
                      GLES20.glUniformMatrix4fv(uModel, 1, false, m, 0);
                  }

                  private void setTint(float[] c) {
                      GLES20.glUniform3f(uTint, c[0], c[1], c[2]);
                  }

                  private void draw(FloatBuffer b, int mode, int count) {
                      b.position(0);
                      GLES20.glVertexAttribPointer(aPos, 3, GLES20.GL_FLOAT, false, 32, b);
                      b.position(3);
                      GLES20.glVertexAttribPointer(aNrm, 3, GLES20.GL_FLOAT, false, 32, b);
                      b.position(6);
                      GLES20.glVertexAttribPointer(aUv, 2, GLES20.GL_FLOAT, false, 32, b);
                      b.position(0);
                      GLES20.glDrawArrays(mode, 0, count);
                  }

                  private void enableAttribs(boolean on) {
                      if (on) {
                          GLES20.glEnableVertexAttribArray(aPos);
                          GLES20.glEnableVertexAttribArray(aNrm);
                          GLES20.glEnableVertexAttribArray(aUv);
                      } else {
                          GLES20.glDisableVertexAttribArray(aPos);
                          GLES20.glDisableVertexAttribArray(aNrm);
                          GLES20.glDisableVertexAttribArray(aUv);
                      }
                  }

                  private void drawSky() {
                      System.arraycopy(view, 0, vr, 0, 16);
                      vr[12] = 0; vr[13] = 0; vr[14] = 0;
                      Matrix.multiplyMM(tmp, 0, proj, 0, vr, 0);
                      Matrix.invertM(invVP, 0, tmp, 0);
                      GLES20.glDepthMask(false);
                      GLES20.glUseProgram(progSky);
                      GLES20.glEnableVertexAttribArray(aSky);
                      GLES20.glUniformMatrix4fv(uInvVP, 1, false, invVP, 0);
                      GLES20.glUniform3f(sHor, 0.70f, 0.76f, 0.86f);
                      GLES20.glUniform3f(sZen, 0.25f, 0.42f, 0.75f);
                      GLES20.glUniform1f(sHas, hasSky ? 1f : 0f);
                      GLES20.glActiveTexture(GLES20.GL_TEXTURE0);
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, skyId);
                      GLES20.glUniform1i(sSkyTex, 0);
                      skyBuf.position(0);
                      GLES20.glVertexAttribPointer(aSky, 2, GLES20.GL_FLOAT, false, 0, skyBuf);
                      GLES20.glDrawArrays(GLES20.GL_TRIANGLES, 0, 3);
                      GLES20.glDisableVertexAttribArray(aSky);
                      GLES20.glDepthMask(true);
                  }

                  private void drawGizmo(Obj o) {
                      float L = dist * 0.12f;
                      float[] m = new float[16];
                      GLES20.glDisable(GLES20.GL_DEPTH_TEST);
                      GLES20.glUniform1f(uReal, 0f);
                      GLES20.glUniform1f(uUseTex, 0f);
                      GLES20.glLineWidth(3f);
                      for (int a = 0; a < 3; a++) {
                          float ex = a == 0 ? 1 : 0, ey = a == 1 ? 1 : 0, ez = a == 2 ? 1 : 0;
                          setTint(AX_COL[a]);
                          Matrix.setIdentityM(m, 0);
                          Matrix.translateM(m, 0, o.x, o.y, o.z);
                          Matrix.scaleM(m, 0, L, L, L);
                          setMats(m);
                          if (tool == TOOL_ROT) {
                              draw(ringBufs[a], GLES20.GL_LINES, 96);
                          } else {
                              draw(gAxis[a], GLES20.GL_LINES, 2);
                              float ms = L * (tool == TOOL_SCA ? 0.07f : 0.10f);
                              Matrix.setIdentityM(m, 0);
                              Matrix.translateM(m, 0, o.x + ex * L, o.y + ey * L, o.z + ez * L);
                              Matrix.scaleM(m, 0, ms, ms, ms);
                              setMats(m);
                              draw(markerCube, GLES20.GL_TRIANGLES, 36);
                          }
                      }
                      GLES20.glLineWidth(2f);
                      GLES20.glEnable(GLES20.GL_DEPTH_TEST);
                  }

                  @Override
                  public void onSurfaceChanged(GL10 gl, int w, int h) {
                      vw = w;
                      vh = h;
                      GLES20.glViewport(0, 0, w, h);
                      Matrix.perspectiveM(proj, 0, 45f, w / (float) h, 0.1f, 100f);
                  }

                  @Override
                  public void onDrawFrame(GL10 gl) {
                      processPending();
                      GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);

                      Obj cam = camView ? findCamera() : null;
                      if (cam != null) {
                          camModel(cam, model);
                          Matrix.invertM(view, 0, model, 0);
                      } else {
                          Matrix.setIdentityM(view, 0);
                          Matrix.translateM(view, 0, 0, 0, -dist);
                          Matrix.rotateM(view, 0, rotX, 1, 0, 0);
                          Matrix.rotateM(view, 0, rotY, 0, 1, 0);
                      }
                      Matrix.multiplyMM(vp, 0, proj, 0, view, 0);
                      synchronized (lastVP) {
                          System.arraycopy(vp, 0, lastVP, 0, 16);
                      }
                      ready = true;

                      Matrix.invertM(inv, 0, view, 0);
                      float[] eye = new float[4];
                      Matrix.multiplyMV(eye, 0, inv, 0, new float[]{0, 0, 0, 1}, 0);

                      boolean isReal = real;
                      if (isReal) drawSky();

                      GLES20.glUseProgram(prog);
                      enableAttribs(true);
                      GLES20.glUniform1i(uTex, 0);
                      GLES20.glUniform1f(uUseTex, 0f);
                      GLES20.glUniform1f(uShadow, 0f);
                      GLES20.glUniform3f(uCam, eye[0], eye[1], eye[2]);
                      GLES20.glUniform3f(uHor, 0.70f, 0.76f, 0.86f);
                      GLES20.glUniform3f(uZen, 0.25f, 0.42f, 0.75f);

                      GLES20.glUniform1f(uReal, 0f);
                      Matrix.setIdentityM(model, 0);
                      setMats(model);
                      GLES20.glUniform3f(uTint, 0.30f, 0.30f, 0.34f);
                      draw(gridBuf, GLES20.GL_LINES, 80);

                      GLES20.glLineWidth(2f);
                      setTint(AX_COL[0]);
                      draw(axisX, GLES20.GL_LINES, 2);
                      setTint(AX_COL[1]);
                      draw(axisY, GLES20.GL_LINES, 2);
                      setTint(AX_COL[2]);
                      draw(axisZ, GLES20.GL_LINES, 2);

                      synchronized (scene) {
                          Obj sel = null;
                          if (isReal) {
                              GLES20.glUniform1f(uShadow, 1f);
                              for (Obj o : scene) {
                                  if (o.isCam) continue;
                                  buildModel(o, model);
                                  Matrix.multiplyMM(sm, 0, shadowM, 0, model, 0);
                                  setMats(sm);
                                  for (GLPart g : o.parts) draw(g.buf, GLES20.GL_TRIANGLES, g.count);
                              }
                              GLES20.glUniform1f(uShadow, 0f);
                          }

                          for (Obj o : scene) {
                              if (o.selected) sel = o;
                              if (o.isCam) {
                                  camModel(o, model);
                                  setMats(model);
                                  GLES20.glUniform1f(uReal, 0f);
                                  setTint(o.selected ? SEL_COL : OFF_COL);
                                  GLES20.glLineWidth(2f);
                                  draw(frustumBuf, GLES20.GL_LINES, 16);
                                  continue;
                              }

                              buildModel(o, model);
                              setMats(model);
                              GLES20.glUniform1f(uReal, isReal ? 1f : 0f);
                              GLES20.glUniform1f(uRough, MAT_ROUGH[o.mat]);
                              GLES20.glUniform1f(uMetal, MAT_METAL[o.mat]);
                              for (GLPart g : o.parts) {
                                  if (g.tex != 0) {
                                      GLES20.glActiveTexture(GLES20.GL_TEXTURE0);
                                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, g.tex);
                                      GLES20.glUniform1f(uUseTex, 1f);
                                      GLES20.glUniform3f(uTint, 1f, 1f, 1f);
                                  } else {
                                      GLES20.glUniform1f(uUseTex, 0f);
                                      GLES20.glUniform3f(uTint, o.col[0], o.col[1], o.col[2]);
                                  }
                                  draw(g.buf, GLES20.GL_TRIANGLES, g.count);
                              }
                              GLES20.glUniform1f(uUseTex, 0f);
                              GLES20.glUniform1f(uReal, 0f);
                              setTint(o.selected ? SEL_COL : OFF_COL);
                              draw(o.box, GLES20.GL_LINES, 24);
                          }

                          if (sel != null && tool != TOOL_SEL) drawGizmo(sel);
                      }

                      enableAttribs(false);
                      if (capture) {
                          capture = false;
                          saveFrame();
                      }
                  }

                  private void saveFrame() {
                      int w = vw, h = vh;
                      ByteBuffer buf = ByteBuffer.allocateDirect(w * h * 4).order(ByteOrder.nativeOrder());
                      GLES20.glReadPixels(0, 0, w, h, GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, buf);
                      int[] px = new int[w * h];
                      for (int y = 0; y < h; y++) {
                          for (int x = 0; x < w; x++) {
                              int i = (y * w + x) * 4;
                              int r = buf.get(i) & 0xFF;
                              int g = buf.get(i + 1) & 0xFF;
                              int bl = buf.get(i + 2) & 0xFF;
                              px[(h - 1 - y) * w + x] = 0xFF000000 | (r << 16) | (g << 8) | bl;
                          }
                      }
                      try {
                          File dir = MainActivity.this.getExternalFilesDir(null);
                          String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                          File f = new File(dir, "render_" + stamp + ".png");
                          Bitmap bmp = Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888);
                          FileOutputStream out = new FileOutputStream(f);
                          bmp.compress(Bitmap.CompressFormat.PNG, 100, out);
                          out.close();
                          uiToast("Render guardado: " + f.getAbsolutePath());
                      } catch (Exception ex) {
                          uiToast("Error al guardar: " + ex.getMessage());
                      }
                  }
              }
          }
          EOF

          javac -source 8 -target 8 -Xlint:-options -cp "$AJAR" -d out $(find src -name '*.java')
          "$BT/d8" --release --min-api 21 --lib "$AJAR" --output build $(find out -name '*.class')
          "$BT/aapt" package -f -M AndroidManifest.xml -S res -I "$AJAR" -F build/base.apk
          (cd build && zip -j base.apk classes.dex)
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias debug --key-pass pass:android --out build/prisma3d.apk build/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prisma3d-apk
          path: build/prisma3d.apk
