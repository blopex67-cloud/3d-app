          func _refresh_lobby() -> void:
              for i in mode_btns.size():
                  _style_btn(mode_btns[i], i == MODES.find(sel_mode), Color(1.0, 0.7, 0.1))
              for i in lobby_btns.size():
                  var rc: Color = _rarity_col(SKINS[i]["rarity"])
                  _style_btn(lobby_btns[i], i == skin_index, rc)

          func _style_btn(b: Button, sel: bool, col: Color) -> void:
              var bg := Color(0.22, 0.16, 0.02, 0.95) if sel else Color(0.07, 0.12, 0.09, 0.9)
              var border := col if sel else Color(1, 1, 1, 0.12)
              var bw := 3 if sel else 1
              b.add_theme_stylebox_override("normal", _sbox(bg, 12, border, bw))
              b.add_theme_stylebox_override("hover", _sbox(bg.lightened(0.1), 12, border, bw))
              b.add_theme_stylebox_override("pressed", _sbox(bg.darkened(0.1), 12, border, bw))
              b.add_theme_stylebox_override("focus", StyleBoxEmpty.new())
              b.add_theme_color_override("font_color", Color.WHITE)

          func _rarity_col(r: String) -> Color:
              if r == "Raro":
                  return Color(0.3, 0.6, 1.0)
              if r == "Épico":
                  return Color(0.7, 0.35, 1.0)
              if r == "Legendario":
                  return Color(1.0, 0.75, 0.2)
              return Color(0.7, 0.7, 0.7)

          func _select_mode(i: int) -> void:
              sel_mode = MODES[i]
              _refresh_lobby()

          func _select_skin(i: int) -> void:
              skin_index = i
              if lobby_char:
                  lobby_char.queue_free()
              lobby_char = _build_char(SKINS[i], false, 0)
              lobby_root.add_child(lobby_char)
              _equip(lobby_char, "pistola")
              _refresh_lobby()

          func _update_lobby(delta: float) -> void:
              if lobby_char and is_instance_valid(lobby_char):
                  lobby_char.rotation.y += delta * 0.5
                  var st: Dictionary = lobby_char.get_meta("st")
                  st["speed"] = 0.0
                  st["lf"] = 0.0
                  st["ls"] = 0.0
                  _pose(lobby_char, st, delta)

          # ================= PARTIDA =================
          func _start_match(m: String) -> void:
              mode = m
              if lobby_ui:
                  lobby_ui.queue_free()
                  lobby_ui = null
              if lobby_root:
                  lobby_root.queue_free()
                  lobby_root = null
                  lobby_char = null
              if world:
                  world.queue_free()
              world = Node3D.new()
              add_child(world)
              _build_map()
              _spawn_all()
              _build_hud()
              cam = Camera3D.new()
              cam.fov = 68.0
              world.add_child(cam)
              cam.current = true
              cam_first = true
              shake = 0.0
              in_match = true
              started = false
              ended = false
              end_t = 0.0
              countdown = 3.0
              last_count = -1
              match_time = 0.0
              kills = 0
              stats = {"shots": 0, "hits": 0}
              reloading = 0.0
              firing = false
              fire_edge = false
              fire_id = -1
              look_id = -1
              joy_id = -1
              joy_vec = Vector2.ZERO
              weapon_idx = 0
              feed_items.clear()
              msg_text = ""
              msg_t = 0.0

          func _back_to_lobby() -> void:
              in_match = false
              started = false
              ended = false
              if hud:
                  hud.queue_free()
                  hud = null
                  overlay = null
              if world:
                  world.queue_free()
                  world = null
              player = null
              cam = null
              all_chars.clear()
              bots.clear()
              drops.clear()
              firing = false
              fire_id = -1
              look_id = -1
              joy_id = -1
              joy_vec = Vector2.ZERO
              _build_lobby()

          func _spawn_all() -> void:
              all_chars.clear()
              bots.clear()
              ammo = {}
              for k in WEAPON_ORDER:
                  ammo[k] = [WEAPONS[k]["mag"], WEAPONS[k]["reserve"]]
              owned = {"pistola": true, "rifle": mode == "train", "escopeta": mode == "train"}

              if mode == "train":
                  var tp := _random_free(20.0, 60.0)
                  player = _build_char(SKINS[skin_index], false, 0)
                  player.position = Vector3(tp.x, 0, tp.y)
                  world.add_child(player)
                  all_chars.append(player)
                  _equip(player, "pistola")
                  player.get_meta("st")["last"] = player.position
                  yaw = randf() * TAU
                  pitch = 0.0
                  return

              var per := 1 if mode == "1v1" else 4
              var base := randf() * TAU
              for team in 2:
                  var ang: float = base + (PI if team == 1 else 0.0)
                  for i in per:
                      var a: float = ang + (float(i) - (per - 1) * 0.5) * 0.25
                      var p: Vector2 = _spawn_at(a, randf_range(120.0, 150.0))
                      var c: CharacterBody3D
                      if team == 0 and i == 0:
                          c = _build_char(SKINS[skin_index], false, 0)
                          player = c
                          yaw = atan2(-p.x, -p.y)
                      else:
                          c = _build_char(SKINS[randi() % SKINS.size()], true, team)
                          bots.append(c)
                      c.position = Vector3(p.x, 0, p.y)
                      world.add_child(c)
                      all_chars.append(c)
                      c.get_meta("st")["last"] = c.position
              _equip(player, "pistola")
              pitch = 0.0

          func _spawn_at(a: float, r: float) -> Vector2:
              for _k in 60:
                  var p := Vector2(cos(a), sin(a)) * (r + randf_range(-20.0, 20.0)) + Vector2(randf_range(-10.0, 10.0), randf_range(-10.0, 10.0))
                  if _is_free(p, 1.0):
                      return p
              return Vector2(cos(a), sin(a)) * r

          # ================= MAPA =================
          func _build_map() -> void:
              obstacles.clear()
              drops.clear()
              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-52, 35, 0)
              sun.light_color = Color(1.0, 0.95, 0.85)
              sun.light_energy = 1.15
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 110.0
              world.add_child(sun)

              var ground := MeshInstance3D.new()
              var pm := PlaneMesh.new()
              pm.size = Vector2(800, 800)
              ground.mesh = pm
              ground.material_override = _mat(Color(1, 1, 1), 0.95, 0.0, "grass", 80.0)
              world.add_child(ground)
              var sea := MeshInstance3D.new()
              var sp := PlaneMesh.new()
              sp.size = Vector2(3000, 3000)
              sea.mesh = sp
              sea.position.y = -1.0
              sea.material_override = _mat(Color(0.1, 0.42, 0.6), 0.1, 0.2)
              world.add_child(sea)

              var walls := [Color(0.92, 0.86, 0.74), Color(0.85, 0.6, 0.42), Color(0.6, 0.78, 0.8), Color(0.8, 0.7, 0.6)]
              var roofs := [Color(0.5, 0.22, 0.16), Color(0.25, 0.25, 0.33), Color(0.38, 0.28, 0.22)]
              var glass := _mat(Color(0.12, 0.18, 0.24), 0.1, 0.5)
              var built := 0
              for _t in 400:
                  if built >= 28:
                      break
                  var bp := _random_free(40.0, 340.0)
                  var w := randf_range(7.0, 12.0)
                  var d := randf_range(7.0, 12.0)
                  var h := randf_range(4.5, 8.0)
                  if not _is_free(bp, maxf(w, d) * 0.7):
                      continue
                  built += 1
                  var wc: Color = walls[randi() % walls.size()]
                  _box(world, Vector3(w, h, d), Vector3(bp.x, h * 0.5, bp.y), _mat(wc, 0.85, 0.0, "plaster"))
                  var rc: Color = roofs[randi() % roofs.size()]
                  _box(world, Vector3(w + 0.8, 0.6, d + 0.8), Vector3(bp.x, h + 0.3, bp.y), _mat(rc, 0.7))
                  for sz in [-1.0, 1.0]:
                      for sx in [-0.28, 0.28]:
                          _box(world, Vector3(1.2, 1.1, 0.08), Vector3(bp.x + sx * w, h * 0.55, bp.y + sz * (d * 0.5 + 0.03)), glass)
                  _collider(Vector3(w, h, d), Vector3(bp.x, h * 0.5, bp.y))
                  obstacles.append(Rect2(bp.x - w * 0.5 - 0.4, bp.y - d * 0.5 - 0.4, w + 0.8, d + 0.8))

              var trunk_t: Array = []
              var leaf_t: Array = []
              for _i in 170:
                  var p := _random_free(12.0, 370.0)
                  if not _is_free(p, 1.2):
                      continue
                  var s := randf_range(0.8, 1.3)
                  trunk_t.append(Transform3D(Basis.from_scale(Vector3(s, s, s)), Vector3(p.x, 1.2 * s, p.y)))
                  leaf_t.append(Transform3D(Basis.from_scale(Vector3(s, s, s)), Vector3(p.x, 3.4 * s, p.y)))
                  _collider(Vector3(0.5, 2.4, 0.5), Vector3(p.x, 1.2, p.y))
                  obstacles.append(Rect2(p.x - 0.5, p.y - 0.5, 1.0, 1.0))
              var trunk_mesh := CylinderMesh.new()
              trunk_mesh.top_radius = 0.18
              trunk_mesh.bottom_radius = 0.24
              trunk_mesh.height = 2.4
              _mmi(trunk_mesh, _mat(Color(0.36, 0.24, 0.14), 0.95), trunk_t)
              var leaf_mesh := SphereMesh.new()
              leaf_mesh.radius = 1.5
              leaf_mesh.height = 3.0
              _mmi(leaf_mesh, _mat(Color(0.2, 0.5, 0.22), 0.9), leaf_t)

              var rock_t: Array = []
              for _i in 70:
                  var p := _random_free(10.0, 360.0)
                  if not _is_free(p, 1.0):
                      continue
                  var r := randf_range(0.9, 1.5)
                  rock_t.append(Transform3D(Basis.from_scale(Vector3(r * 1.2, r * 0.75, r * 1.1)), Vector3(p.x, r * 0.5, p.y)))
                  _collider(Vector3(r * 2.4, r, r * 2.2), Vector3(p.x, r * 0.5, p.y))
                  obstacles.append(Rect2(p.x - r, p.y - r, r * 2.0, r * 2.0))
              var rock_mesh := SphereMesh.new()
              rock_mesh.radius = 1.0
              rock_mesh.height = 2.0
              _mmi(rock_mesh, _mat(Color(0.5, 0.53, 0.56), 0.9), rock_t)

              var bush_t: Array = []
              for _i in 120:
                  var p := _random_free(8.0, 360.0)
                  var s := randf_range(0.6, 1.0)
                  bush_t.append(Transform3D(Basis.from_scale(Vector3(s * 1.2, s * 0.8, s * 1.2)), Vector3(p.x, 0.4, p.y)))
              var bush_mesh := SphereMesh.new()
              bush_mesh.radius = 0.7
              bush_mesh.height = 1.2
              _mmi(bush_mesh, _mat(Color(0.22, 0.5, 0.2), 0.95), bush_t)

              var kinds := ["pistola", "rifle", "rifle", "escopeta", "escopeta", "pistola"]
              for _i in 30:
                  var dp := _random_free(20.0, 350.0)
                  var kind: String = kinds[randi() % kinds.size()]
                  var g := Node3D.new()
                  g.position = Vector3(dp.x, 0.3, dp.y)
                  world.add_child(g)
                  _box(g, Vector3(0.6, 0.3, 0.25), Vector3.ZERO, _mat(WEAPONS[kind]["col"], 0.5, 0.6))
                  var ring := MeshInstance3D.new()
                  var rc2 := CylinderMesh.new()
                  rc2.top_radius = 0.8
                  rc2.bottom_radius = 0.8
                  rc2.height = 0.02
                  ring.mesh = rc2
                  ring.material_override = _glow(Color(1.0, 0.8, 0.3), 1.5)
                  ring.position.y = -0.25
                  g.add_child(ring)
                  drops.append({"kind": kind, "pos": Vector3(dp.x, 0.0, dp.y), "node": g, "taken": false})

          func _update_drops(_delta: float) -> void:
              for d in drops:
                  if d["taken"]:
                      continue
                  var n: Node3D = d["node"]
                  var pos: Vector3 = d["pos"]
                  n.rotation.y += _delta * 1.2
                  n.position.y = 0.3 + sin(time_s * 3.0 + pos.x) * 0.08

          func _is_free(p: Vector2, r: float) -> bool:
              if p.length() > MAP_R - r:
                  return false
              for o in obstacles:
                  var rect: Rect2 = o
                  var cx := clampf(p.x, rect.position.x, rect.end.x)
                  var cz := clampf(p.y, rect.position.y, rect.end.y)
                  if Vector2(cx, cz).distance_to(p) < r:
                      return false
              return true

          func _random_free(minr: float, maxr: float) -> Vector2:
              var p := Vector2.ZERO
              for _i in 80:
                  var a := randf() * TAU
                  var r := randf_range(minr, maxr)
                  p = Vector2(cos(a) * r, sin(a) * r)
                  if _is_free(p, 1.0):
                      break
              return p

          func _move(n: Node3D, v: Vector3) -> void:
              var p: Vector3 = n.position
              var tx := Vector2(p.x + v.x, p.z)
              if _is_free(tx, 0.45):
                  p.x = tx.x
              var tz := Vector2(p.x, p.z + v.z)
              if _is_free(tz, 0.45):
                  p.z = tz.y
              n.position = p

          func _steer(n: Node3D, target: Vector3, step: float) -> void:
              var d := Vector3(target.x - n.position.x, 0.0, target.z - n.position.z)
              if d.length() < 0.001:
                  return
              _move(n, d.normalized() * step)

          func _face(b: CharacterBody3D, st: Dictionary, delta: float) -> void:
              b.rotation.y = lerp_angle(b.rotation.y, float(st["yaw"]), minf(1.0, delta * 8.0))

          func _gravity(c: CharacterBody3D, st: Dictionary, delta: float) -> void:
              var vy: float = float(st["vy"]) - 22.0 * delta
              var py: float = c.position.y + vy * delta
              if py <= 0.0:
                  py = 0.0
                  vy = 0.0
              st["vy"] = vy
              c.position.y = py

          # ================= JUGADOR =================
          func _update_player(delta: float) -> void:
              var st: Dictionary = player.get_meta("st")
              if not st["alive"] or not started:
                  return
              var mv := joy_vec
              if Input.is_key_pressed(KEY_D):
                  mv.x += 1.0
              if Input.is_key_pressed(KEY_A):
                  mv.x -= 1.0
              if Input.is_key_pressed(KEY_W):
                  mv.y += 1.0
              if Input.is_key_pressed(KEY_S):
                  mv.y -= 1.0
              if Input.is_key_pressed(KEY_LEFT):
                  yaw += 2.5 * delta
              if Input.is_key_pressed(KEY_RIGHT):
                  yaw -= 2.5 * delta
              mv = mv.limit_length(1.0)
              var fwd := Vector3(sin(yaw), 0.0, cos(yaw))
              var right := Vector3(-cos(yaw), 0.0, sin(yaw))
              var dir := right * mv.x + fwd * mv.y
              if dir.length() > 0.01:
                  _move(player, dir * 5.0 * delta)
              _gravity(player, st, delta)
              player.rotation.y = yaw
              _check_player_pickup()

              st["cd"] = maxf(0.0, float(st["cd"]) - delta)
              if reloading > 0.0:
                  reloading -= delta
                  if reloading <= 0.0:
                      _finish_reload()
              var wk: String = st["weapon"]
              if wk == "":
                  return
              var w: Dictionary = WEAPONS[wk]
              var wants: bool = (firing or Input.is_key_pressed(KEY_F)) and (bool(w["auto"]) or fire_edge)
              if wants and float(st["cd"]) <= 0.0 and reloading <= 0.0:
                  fire_edge = false
                  var a: Array = ammo[wk]
                  if a[0] > 0 or mode == "train":
                      if mode != "train":
                          a[0] = int(a[0]) - 1
                      st["cd"] = float(w["rate"])
                      stats["shots"] = int(stats["shots"]) + 1
                      _fire(player, cam.global_position, _aim_dir(), 1.0 + float(st["speed"]) * 0.12)
                  else:
                      _start_reload()
              if not firing and not Input.is_key_pressed(KEY_F):
                  fire_edge = false

          func _jump() -> void:
              if not started or not player.get_meta("st")["alive"]:
                  return
              var st: Dictionary = player.get_meta("st")
              if player.position.y <= 0.01:
                  st["vy"] = 8.5

          func _switch_weapon(i: int) -> void:
              if not started or i < 0 or i >= WEAPON_ORDER.size():
                  return
              if not player.get_meta("st")["alive"]:
                  return
              var kind: String = WEAPON_ORDER[i]
              if not owned.get(kind, false):
                  return
              weapon_idx = i
              reloading = 0.0
              _equip(player, kind)

          func _start_reload() -> void:
              if reloading > 0.0 or not started:
                  return
              var st: Dictionary = player.get_meta("st")
              var wk: String = st["weapon"]
              if wk == "":
                  return
              var a: Array = ammo[wk]
              if int(a[0]) >= int(WEAPONS[wk]["mag"]) or int(a[1]) <= 0:
                  return
              reloading = float(WEAPONS[wk]["reload"])
              _sfx("reload", player.position)

          func _finish_reload() -> void:
              reloading = 0.0
              var st: Dictionary = player.get_meta("st")
              var wk: String = st["weapon"]
              var a: Array = ammo[wk]
              var take: int = mini(int(WEAPONS[wk]["mag"]) - int(a[0]), int(a[1]))
              a[0] = int(a[0]) + take
              a[1] = int(a[1]) - take

          func _check_player_pickup() -> void:
              var st: Dictionary = player.get_meta("st")
              if not st["alive"]:
                  return
              for dr in drops:
                  if dr["taken"]:
                      continue
                  if player.position.distance_to(dr["pos"]) < 2.0:
                      dr["taken"] = true
                      dr["node"].visible = false
                      var kind: String = dr["kind"]
                      owned[kind] = true
                      var a: Array = ammo[kind]
                      a[1] = int(a[1]) + int(WEAPONS[kind]["mag"])
                      _switch_weapon(WEAPON_ORDER.find(kind))
                      _sfx("pickup", player.position)
                      _feed("Recogiste " + WEAPONS[kind]["name"])

          # ================= DISPARO Y PROBABILIDAD =================
          func _fire(sh: CharacterBody3D, origin: Vector3, dir: Vector3, spread_mul: float) -> void:
              var st: Dictionary = sh.get_meta("st")
              var wk: String = st["weapon"]
              var w: Dictionary = WEAPONS[wk]
              var space := get_world_3d().direct_space_state
              var sp: float = float(w["spread"]) * spread_mul
              st["recoil"] = 1.0
              st["flash_t"] = 0.05
              _sfx(wk, origin)
              var any_hit := false
              for _i in int(w["pellets"]):
                  var d: Vector3 = (dir + Vector3(randf_range(-sp, sp), randf_range(-sp, sp), randf_range(-sp, sp))).normalized()
                  var endp: Vector3 = origin + d * float(w["dist"])
                  var q := PhysicsRayQueryParameters3D.create(origin, endp)
                  q.exclude = [sh.get_rid()]
                  var hit: Dictionary = space.intersect_ray(q)
                  if not hit.is_empty():
                      endp = hit["position"]
                      var col = hit["collider"]
                      if col is CharacterBody3D and col != sh and col.has_meta("st"):
                          var cs: Dictionary = col.get_meta("st")
                          if cs["alive"] and int(cs["team"]) != int(st["team"]):
                              var dist: float = origin.distance_to(endp)
                              if randf() < _hit_chance(sh, col, dist, w):
                                  var head: bool = (endp.y - col.position.y) > 1.45
                                  var dmg: float = float(w["dmg"]) * (1.8 if head else 1.0) * (1.0 - 0.35 * clampf(dist / float(w["dist"]), 0.0, 1.0))
                                  _damage(col, dmg, sh)
                                  any_hit = true
                                  if sh == player:
                                      hit_t = 0.2
                                  _sfx("hit", endp)
                  _tracer(origin, endp, sh == player)
              if sh == player and any_hit:
                  stats["hits"] = int(stats["hits"]) + 1

          func _hit_chance(sh: CharacterBody3D, tg: CharacterBody3D, dist: float, w: Dictionary) -> float:
              var ss: Dictionary = sh.get_meta("st")
              var ts: Dictionary = tg.get_meta("st")
              var c: float = float(w["acc"]) * float(ss["skill"])
              c *= clampf(1.0 - dist / (float(w["dist"]) * 1.1), 0.12, 1.0)
              if float(ss["speed"]) > 2.5:
                  c *= 0.55
              c *= 1.0 - clampf(float(ts["speed"]) / 7.0, 0.0, 0.45)
              return clampf(c, 0.03, 0.92)

          func _tracer(a: Vector3, b: Vector3, mine: bool) -> void:
              var mi := MeshInstance3D.new()
              var im := ImmediateMesh.new()
              im.surface_begin(Mesh.PRIMITIVE_LINES)
              im.surface_add_vertex(a)
              im.surface_add_vertex(b)
              im.surface_end()
              mi.mesh = im
              mi.material_override = _unlit(Color(1.0, 0.9, 0.45) if mine else Color(1.0, 0.45, 0.4))
              world.add_child(mi)
              get_tree().create_timer(0.06).timeout.connect(mi.queue_free)

          func _damage(c: CharacterBody3D, amt: float, by) -> void:
              var st: Dictionary = c.get_meta("st")
              if not st["alive"]:
                  return
              st["hp"] = float(st["hp"]) - amt
              if c == player:
                  hud_hurt.color = Color(0.9, 0.05, 0.05, 0.4)
                  shake = minf(0.4, shake + 0.15)
              if float(st["hp"]) > 0.0:
                  return
              st["hp"] = 0.0
              st["alive"] = false
              var t := create_tween()
              t.tween_property(c, "rotation:x", -PI / 2.0, 0.35).set_trans(Tween.TRANS_QUAD)
              if c == player:
                  _feed("Te eliminaron")
              elif by == player:
                  kills += 1
                  _feed("Eliminaste a un enemigo")

          # ================= BOTS =================
          func _visible(a: CharacterBody3D, c: CharacterBody3D) -> bool:
              var q := PhysicsRayQueryParameters3D.create(a.position + Vector3(0, 1.5, 0), c.position + Vector3(0, 1.5, 0))
              q.exclude = [a.get_rid()]
              var hit: Dictionary = get_world_3d().direct_space_state.intersect_ray(q)
              return hit.is_empty() or hit["collider"] == c

          func _nearest_enemy(b: CharacterBody3D):
              var st: Dictionary = b.get_meta("st")
              var best = null
              var bd := 115.0
              for c in all_chars:
                  var cs: Dictionary = c.get_meta("st")
                  if not cs["alive"] or int(cs["team"]) == int(st["team"]):
                      continue
                  var dd: float = b.position.distance_to(c.position)
                  if dd < bd and _visible(b, c):
                      bd = dd
                      best = c
              return best

          func _nearest_drop(p: Vector3):
              var best = null
              var bd := 150.0
              for d in drops:
                  if d["taken"]:
                      continue
                  var dd: float = p.distance_to(d["pos"])
                  if dd < bd:
                      bd = dd
                      best = d
              return best

          func _bot_pickup(b: CharacterBody3D, dr: Dictionary) -> void:
              dr["taken"] = true
              dr["node"].visible = false
              var kind: String = dr["kind"]
              var st: Dictionary = b.get_meta("st")
              _equip(b, kind)
              st["mag"] = int(WEAPONS[kind]["mag"])
              st["res"] = int(WEAPONS[kind]["mag"]) * 2
              _sfx("pickup", b.position)

          func _bot_reload(b: CharacterBody3D, st: Dictionary) -> void:
              var wk: String = st["weapon"]
              var w: Dictionary = WEAPONS[wk]
              var take: int = mini(int(w["mag"]), int(st["res"]))
              if take <= 0:
                  st["mag"] = 0
                  st["res"] = 0
                  _equip(b, "")
                  return
              st["mag"] = take
              st["res"] = int(st["res"]) - take
              st["cd"] = float(w["reload"])

          func _wander(b: CharacterBody3D, st: Dictionary, delta: float, speed: float) -> void:
              st["wander_t"] = float(st["wander_t"]) - delta
              var p: Vector3 = b.position
              var wp: Vector2 = st["wander"]
              if float(st["wander_t"]) <= 0.0 or Vector2(p.x, p.z).distance_to(wp) < 2.0:
                  wp = _random_free(20.0, 340.0)
                  st["wander"] = wp
                  st["wander_t"] = randf_range(5.0, 10.0)
              _steer(b, Vector3(wp.x, 0.0, wp.y), speed * delta)
              st["yaw"] = atan2(wp.x - p.x, wp.y - p.z)

          func _bot_think(b: CharacterBody3D, st: Dictionary, delta: float) -> void:
              var p: Vector3 = b.position
              var wk: String = st["weapon"]
              if wk == "":
                  var dr = _nearest_drop(p)
                  if dr != null:
                      var dp: Vector3 = dr["pos"]
                      _steer(b, dp, 4.0 * delta)
                      st["yaw"] = atan2(dp.x - p.x, dp.z - p.z)
                      if p.distance_to(dp) < 1.6:
                          _bot_pickup(b, dr)
                  else:
                      _wander(b, st, delta, 3.0)
                  return
              var foe = _nearest_enemy(b)
              if foe == null:
                  st["aim_t"] = 0.0
                  _wander(b, st, delta, 2.2)
                  return
              var fp: Vector3 = foe.position
              var to := Vector3(fp.x - p.x, 0.0, fp.z - p.z)
              var dist := to.length()
              var dirv := to / maxf(dist, 0.01)
              st["yaw"] = atan2(dirv.x, dirv.z)
              st["aim_t"] = float(st["aim_t"]) + delta
              var sk: float = st["skill"]
              var perp := Vector3(-dirv.z, 0.0, dirv.x)
              if dist > 25.0:
                  _steer(b, fp, 3.4 * delta)
              elif dist < 10.0:
                  _steer(b, p - dirv * 3.0, 3.0 * delta)
              else:
                  _move(b, perp * float(st["strafe"]) * 3.0 * delta)
              var w: Dictionary = WEAPONS[wk]
              if float(st["aim_t"]) > 0.4 + (1.0 - sk) * 0.6 and float(st["cd"]) <= 0.0 and dist < float(w["dist"]) * 0.9:
                  if int(st["mag"]) <= 0:
                      _bot_reload(b, st)
                  else:
                      st["mag"] = int(st["mag"]) - 1
                      st["cd"] = float(w["rate"]) * randf_range(1.1, 1.5)
                      var origin: Vector3 = p + Vector3(0, 1.6, 0) + dirv * 0.5
                      var target: Vector3 = fp + Vector3(0, 1.3, 0)
                      _fire(b, origin, (target - origin).normalized(), 1.0 + (1.0 - sk) * 2.2)

          func _update_bots(delta: float) -> void:
              for b in bots:
                  var st: Dictionary = b.get_meta("st")
                  if not st["alive"]:
                      continue
                  st["cd"] = float(st["cd"]) - delta
                  st["strafe_t"] = float(st["strafe_t"]) - delta
                  if float(st["strafe_t"]) <= 0.0:
                      st["strafe"] = -float(st["strafe"])
                      st["strafe_t"] = randf_range(1.5, 3.0)
                  _gravity(b, st, delta)
                  _bot_think(b, st, delta)
                  _face(b, st, delta)

          func _team_alive(t: int) -> int:
              var n := 0
              for c in all_chars:
                  var st: Dictionary = c.get_meta("st")
                  if st["alive"] and int(st["team"]) == t:
                      n += 1
              return n

          func _check_end(delta: float) -> void:
              var a := _team_alive(0)
              var b := _team_alive(1)
              if a == 0 or b == 0:
                  end_t += delta
                  if end_t > 1.5:
                      _show_end(a > 0)
              else:
                  end_t = 0.0

          func _show_end(win: bool) -> void:
              if ended:
                  return
              ended = true
              firing = false
              end_title.text = "VICTORIA" if win else "DERROTA"
              var s := int(match_time)
              end_sub.text = "Eliminaciones: %d    Tiempo: %d:%02d" % [kills, s / 60, s % 60]
              end_panel.visible = true

          # ================= CÁMARA =================
          func _update_camera(delta: float) -> void:
              if player == null or cam == null:
                  return
              var pivot: Vector3 = player.position + Vector3(0, 1.6, 0)
              var flat := Vector3(sin(yaw), 0.0, cos(yaw))
              var right := Vector3(-cos(yaw), 0.0, sin(yaw))
              var desired: Vector3 = pivot - flat * 4.2 + right * 0.6 + Vector3.UP * (0.7 + pitch * 2.0)
              var q := PhysicsRayQueryParameters3D.create(pivot, desired)
              q.exclude = [player.get_rid()]
              var hit: Dictionary = get_world_3d().direct_space_state.intersect_ray(q)
              if not hit.is_empty():
                  var hp: Vector3 = hit["position"]
                  desired = hp + (pivot - hp).normalized() * 0.25
              if cam_first:
                  cam.global_position = desired
                  cam_first = false
              else:
                  cam.global_position = cam.global_position.lerp(desired, minf(1.0, delta * 14.0))
              if shake > 0.0:
                  cam.global_position += Vector3(randf_range(-1.0, 1.0), randf_range(-1.0, 1.0), 0.0) * shake * 0.15
                  shake = maxf(0.0, shake - delta * 2.2)
              cam.look_at(pivot + _aim_dir() * 10.0, Vector3.UP)

          # ================= HUD =================
          func _build_hud() -> void:
              var v := _vs()
              sb_panel = _sbox(Color(0.02, 0.05, 0.04, 0.6), 14, Color(1, 1, 1, 0.1), 1)
              sb_slot = _sbox(Color(0.02, 0.04, 0.03, 0.65), 10, Color(1, 1, 1, 0.25), 2)
              sb_on = _sbox(Color(0.12, 0.09, 0.02, 0.75), 10, Color(1.0, 0.7, 0.1), 3)
              sb_red = _sbox(Color(0.75, 0.15, 0.12, 0.9), 14)

              hud = CanvasLayer.new()
              add_child(hud)
              hud_hurt = ColorRect.new()
              hud_hurt.set_anchors_preset(Control.PRESET_FULL_RECT)
              hud_hurt.mouse_filter = Control.MOUSE_FILTER_IGNORE
              hud_hurt.color = Color(0.9, 0.05, 0.05, 0.0)
              hud.add_child(hud_hurt)

              overlay = Control.new()
              overlay.set_anchors_preset(Control.PRESET_FULL_RECT)
              overlay.mouse_filter = Control.MOUSE_FILTER_IGNORE
              hud.add_child(overlay)
              overlay.draw.connect(_draw_hud)

              end_panel = VBoxContainer.new()
              end_panel.position = Vector2(v.x * 0.5 - 200.0, v.y * 0.22)
              end_panel.custom_minimum_size = Vector2(400, 0)
              end_panel.add_theme_constant_override("separation", 14)
              end_panel.visible = false
              hud.add_child(end_panel)
              end_title = Label.new()
              end_title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              end_title.add_theme_font_size_override("font_size", 52)
              end_panel.add_child(end_title)
              end_sub = Label.new()
              end_sub.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              end_sub.add_theme_font_size_override("font_size", 22)
              end_panel.add_child(end_sub)
              var back := Button.new()
              back.text = "VOLVER AL LOBBY"
              back.custom_minimum_size = Vector2(340, 70)
              back.add_theme_font_size_override("font_size", 24)
              back.add_theme_stylebox_override("normal", _sbox(Color(1.0, 0.6, 0.1), 16))
              back.add_theme_color_override("font_color", Color.BLACK)
              back.pressed.connect(_back_to_lobby)
              end_panel.add_child(back)

          func _txt(pos: Vector2, s: String, fs: int, col: Color, align: HorizontalAlignment = HORIZONTAL_ALIGNMENT_LEFT, w: float = -1.0) -> void:
              var f := ThemeDB.fallback_font
              overlay.draw_string(f, pos + Vector2(1.5, 1.5), s, align, w, fs, Color(0, 0, 0, 0.7))
              overlay.draw_string(f, pos, s, align, w, fs, col)

          func _btn(c: Vector2, r: float, label: String, fs: int, col: Color) -> void:
              overlay.draw_circle(c, r, col)
              _sketch_arc(c, r, Color(1, 1, 1, 0.75))
              _txt(Vector2(c.x - r, c.y + fs * 0.35), label, fs, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, r * 2.0)

          # Trazo doble y ligeramente irregular, para dar aspecto dibujado
          func _sketch_arc(c: Vector2, r: float, col: Color) -> void:
              overlay.draw_arc(c + Vector2(0.6, -0.4), r, 0.0, TAU, 40, col, 2.0)
              overlay.draw_arc(c + Vector2(-0.5, 0.5), r + 0.8, 0.0, TAU, 40, Color(col.r, col.g, col.b, col.a * 0.5), 1.0)

          func _sketch(a: Vector2, b: Vector2, col: Color) -> void:
              overlay.draw_line(a + Vector2(0.6, -0.4), b + Vector2(-0.5, 0.5), col, 2.0)
              overlay.draw_line(a, b, Color(col.r, col.g, col.b, col.a * 0.6), 1.0)

          func _update_hud(delta: float) -> void:
              if msg_t > 0.0:
                  msg_t -= delta
                  if msg_t <= 0.0:
                      msg_text = ""
              if hit_t > 0.0:
                  hit_t -= delta
              var hc: Color = hud_hurt.color
              hc.a = maxf(0.0, hc.a - delta * 1.4)
              hud_hurt.color = hc
              for i in range(feed_items.size() - 1, -1, -1):
                  feed_items[i]["life"] = float(feed_items[i]["life"]) - delta
                  if feed_items[i]["life"] <= 0.0:
                      feed_items.remove_at(i)

          func _msg(t: String, dur: float) -> void:
              msg_text = t
              msg_t = dur

          func _feed(t: String) -> void:
              feed_items.push_front({"t": t, "life": 3.5})
              while feed_items.size() > 4:
                  feed_items.pop_back()

          func _draw_hud() -> void:
              if not in_match or player == null or overlay == null:
                  return
              var v := _vs()
              var st: Dictionary = player.get_meta("st")
              var hpf: float = clampf(float(st["hp"]) / 100.0, 0.0, 1.0)

              overlay.draw_style_box(sb_panel, Rect2(16, 16, 330, 84))
              overlay.draw_circle(Vector2(60, 58), 28.0, _skin_col(SKINS[skin_index]))
              _sketch_arc(Vector2(60, 58), 28.0, Color.WHITE)
              _txt(Vector2(100, 40), "VIDA", 14, Color(0.8, 0.95, 0.85))
              overlay.draw_rect(Rect2(100, 46, 236, 16), Color(0, 0, 0, 0.6))
              var hc := Color(0.35, 1.0, 0.35).lerp(Color(1.0, 0.25, 0.2), 1.0 - hpf)
              overlay.draw_rect(Rect2(100, 46, 236.0 * hpf, 16), hc)
              _txt(Vector2(100, 88), str(ceili(float(st["hp"]))), 20, Color.WHITE)

              var er := _exit_rect()
              overlay.draw_style_box(sb_panel, er)
              _txt(Vector2(er.position.x, er.position.y + 23), "SALIR", 15, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, er.size.x)

              if mode == "train":
                  var acc := 0
                  if int(stats["shots"]) > 0:
                      acc = int(100.0 * float(stats["hits"]) / float(stats["shots"]))
                  overlay.draw_style_box(sb_panel, Rect2(v.x * 0.5 - 150.0, 14, 300, 56))
                  _txt(Vector2(v.x * 0.5 - 150.0, 36), "ENTRENAMIENTO", 14, Color(1, 0.85, 0.4), HORIZONTAL_ALIGNMENT_CENTER, 300.0)
                  _txt(Vector2(v.x * 0.5 - 150.0, 60), "Precisión %d%%   ·   %d / %d" % [acc, stats["hits"], stats["shots"]], 16, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, 300.0)
              else:
                  overlay.draw_style_box(sb_panel, Rect2(v.x * 0.5 - 150.0, 14, 300, 40))
                  _txt(Vector2(v.x * 0.5 - 150.0, 41), "TÚ %d   ·   ENEMIGOS %d" % [_team_alive(0), _team_alive(1)], 20, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, 300.0)
                  _draw_minimap(Vector2(v.x - 92.0, 96.0), 74.0)
                  var fy := 204.0
                  for item in feed_items:
                      var a: float = clampf(float(item["life"]), 0.0, 1.0)
                      _txt(Vector2(v.x - 326.0, fy), item["t"], 16, Color(1, 1, 1, a), HORIZONTAL_ALIGNMENT_RIGHT, 300.0)
                      fy += 24.0

              var c := v * 0.5
              var wk: String = st["weapon"]
              var gap := 6.0 + (8.0 if (firing and wk != "" and bool(WEAPONS[wk]["auto"])) else 0.0)
              var wc := Color(1, 1, 1, 0.9)
              _sketch(c + Vector2(-gap - 9, 0), c + Vector2(-gap, 0), wc)
              _sketch(c + Vector2(gap, 0), c + Vector2(gap + 9, 0), wc)
              _sketch(c + Vector2(0, -gap - 9), c + Vector2(0, -gap), wc)
              _sketch(c + Vector2(0, gap), c + Vector2(0, gap + 9), wc)
              if hit_t > 0.0:
                  var hcol := Color(1, 0.25, 0.25, 0.95)
                  _sketch(c + Vector2(-7, -7), c + Vector2(7, 7), hcol)
                  _sketch(c + Vector2(7, -7), c + Vector2(-7, 7), hcol)

              if joy_id != -1:
                  overlay.draw_circle(joy_origin, JOY_R, Color(1, 1, 1, 0.1))
                  _sketch_arc(joy_origin, JOY_R, Color(1, 1, 1, 0.45))
                  overlay.draw_circle(joy_origin + Vector2(joy_vec.x, -joy_vec.y) * JOY_R, 26.0, Color(1, 1, 1, 0.6))

              _btn(_fire_c(), FIRE_R, "FUEGO", 20, Color(0.92, 0.3, 0.1, 0.9))
              _btn(_jump_c(), JUMP_R, "SALTAR", 12, Color(0.08, 0.1, 0.1, 0.75))
              _btn(_reload_c(), RELOAD_R, "RECARGAR", 10, Color(0.08, 0.1, 0.1, 0.75))
              _btn(_arma_c(), ARMA_R, "ARMA", 11, Color(0.08, 0.1, 0.1, 0.75))

              var ar := _ammo_rect()
              overlay.draw_style_box(sb_panel, ar)
              if wk != "":
                  var a2: Array = ammo[wk]
                  var ammo_txt := "∞" if mode == "train" else str(a2[1])
                  _txt(Vector2(ar.position.x + 14, ar.position.y + 20), WEAPONS[wk]["name"], 14, Color(1, 0.85, 0.4))
                  _txt(Vector2(ar.position.x + 14, ar.position.y + 46), "%d / %s" % [a2[0], ammo_txt], 26, Color.WHITE)
                  if reloading > 0.0:
                      _txt(Vector2(ar.position.x + 150, ar.position.y + 20), "RECARGANDO", 12, Color(1, 0.6, 0.3))

              var short := ["PIST", "RIFLE", "ESC"]
              for i in 3:
                  var sr := _slot_rect(i)
                  var sb: StyleBoxFlat = sb_on if i == weapon_idx else sb_slot
                  overlay.draw_style_box(sb, sr)
                  var has: bool = owned.get(WEAPON_ORDER[i], false)
                  var tcol := Color.WHITE if has else Color(1, 1, 1, 0.35)
                  _txt(Vector2(sr.position.x + 8, sr.position.y + 17), str(i + 1) + " " + short[i], 12, tcol)
                  if has:
                      _txt(Vector2(sr.position.x + 8, sr.position.y + 36), str(ammo[WEAPON_ORDER[i]][0]), 14, Color(1, 0.9, 0.5))

              if msg_t > 0.0 and msg_text != "":
                  _txt(Vector2(v.x * 0.5 - 300.0, v.y * 0.36), msg_text, 96, Color.WHITE, HORIZONTAL_ALIGNMENT_CENTER, 600.0)

          func _draw_minimap(c: Vector2, R: float) -> void:
              var k := R / MAP_R
              overlay.draw_circle(c, R + 3.0, Color(1, 1, 1, 0.85))
              overlay.draw_circle(c, R, Color(0.12, 0.3, 0.45, 0.95))
              overlay.draw_circle(c, 240.0 * k, Color(0.45, 0.7, 0.35, 0.95))
              for d in drops:
                  if not d["taken"]:
                      var dp: Vector3 = d["pos"]
                      overlay.draw_circle(c + Vector2(dp.x, dp.z) * k, 1.8, Color(1, 0.85, 0.3))
              for ch in all_chars:
                  var cs: Dictionary = ch.get_meta("st")
                  if not cs["alive"]:
                      continue
                  var cp: Vector3 = ch.position
                  var col := Color(0.3, 1.0, 0.4) if int(cs["team"]) == 0 else Color(1, 0.3, 0.3)
                  overlay.draw_circle(c + Vector2(cp.x, cp.z) * k, 2.5 if ch != player else 3.5, col)
              var pf := Vector2(sin(yaw), cos(yaw))
              var pr := Vector2(-pf.y, pf.x)
              var pc := c + Vector2(player.position.x, player.position.z) * k
              overlay.draw_colored_polygon(PackedVector2Array([pc + pf * 9.0, pc - pf * 6.0 + pr * 6.0, pc - pf * 6.0 - pr * 6.0]), Color(1, 0.9, 0.3))
          EOF

      - name: Exportar APK con Godot
        run: |
          cd game
          godot --headless --import || true
          godot --headless --export-debug "Android" ../battle_royale.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-royale-godot-apk
          path: battle_royale.apk
