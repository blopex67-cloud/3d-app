name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          BT="$SDK/build-tools/34.0.0"
          AJAR="$SDK/platforms/android-34/android.jar"

          mkdir -p src/com/carlos/prisma3d out build

          cat > AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.carlos.prisma3d" android:versionCode="1" android:versionName="0.1">
              <uses-sdk android:minSdkVersion="16" android:targetSdkVersion="34"/>
              <application android:label="Prisma 3D">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > src/com/carlos/prisma3d/MainActivity.java << 'EOF'
          package com.carlos.prisma3d;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.rgb(20, 20, 24));

                  final TextView t = new TextView(this);
                  t.setText("Prisma 3D v0.1");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(24);

                  Button btn = new Button(this);
                  btn.setText("RENDER");
                  btn.setOnClickListener(v -> t.setText("Render pendiente"));

                  root.addView(t);
                  root.addView(btn);
                  setContentView(root);
              }
          }
          EOF

          javac -source 8 -target 8 -Xlint:-options -cp "$AJAR" -d out $(find src -name '*.java')
          "$BT/d8" --release --min-api 16 --lib "$AJAR" --output build $(find out -name '*.class')
          "$BT/aapt" package -f -M AndroidManifest.xml -I "$AJAR" -F build/base.apk
          (cd build && zip -j base.apk classes.dex)
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias debug --key-pass pass:android --out build/prisma3d.apk build/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prisma3d-apk
          path: build/prisma3d.apk
