            }
            const flash = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), basic(0xffdd55));
            flash.position.set(0, 0.05, 0.78); flash.visible = false; g.add(flash);
            g.userData.flash = flash;
            return g;
          }
          function makeEnt(name, skin, bot, wid) {
