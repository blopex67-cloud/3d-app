      - name: Generar el juego
        run: |
          mkdir -p site
          if [ -d assets ]; then cp -r assets site/; fi
          cat > site/index.html << 'HTML_EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>LA PIZZERÍA - Terror en primera persona</title>
          <style>
            *{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
            :root{--ink:#e9e4d2;--red:#ff2a3a;--amber:#ffc23d;--mono:'Courier New',Courier,monospace;--cond:'Arial Narrow','Roboto Condensed','Roboto',sans-serif}
            html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--mono);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
            #c{position:fixed;inset:0;width:100%;height:100%;display:block}

            /* ---------- Efecto televisión vieja ---------- */
            #stat{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:49;opacity:.06;image-rendering:pixelated}
            #crt{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;
              background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0,rgba(0,0,0,.24) 1px,transparent 1px,transparent 3px);
              box-shadow:inset 0 0 150px rgba(0,0,0,.75);animation:tvflick .14s infinite}
            #crt::after{content:'';position:absolute;left:0;right:0;top:-90px;height:90px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.04),transparent);animation:roll 7s linear infinite}
            @keyframes roll{to{transform:translateY(calc(100vh + 180px))}}
            @keyframes tvflick{0%{opacity:.95}50%{opacity:1}100%{opacity:.97}}
            @keyframes blink{50%{opacity:0}}
            @keyframes glitch{0%,90%,100%{transform:none}91%{transform:translate(-4px,1px) skewX(6deg)}93%{transform:translate(5px,-1px)}95%{transform:translate(-2px,0) skewX(-5deg)}97%{transform:none}}

            /* ---------- Pantallas ---------- */
            .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
              padding:20px calc(20px + env(safe-area-inset-right,0px)) 20px calc(20px + env(safe-area-inset-left,0px));
              background:radial-gradient(ellipse at center,rgba(8,14,12,.72),rgba(0,0,0,.97));z-index:10;transition:opacity .4s;overflow-y:auto}
            .screen.hidden{opacity:0;pointer-events:none}
            .screen::before{content:'CAM 01  ●  12:00 AM';position:absolute;top:14px;left:calc(18px + env(safe-area-inset-left,0px));font-size:12px;letter-spacing:3px;opacity:.55}
            h1{font-family:var(--mono);font-size:clamp(34px,8vw,84px);letter-spacing:8px;margin:0 0 6px;color:var(--ink);font-weight:900;text-transform:uppercase;
              text-shadow:3px 0 rgba(255,0,40,.7),-3px 0 rgba(0,200,255,.45),0 0 22px rgba(255,255,255,.25);animation:glitch 5s infinite}
            h2{font-family:var(--mono);letter-spacing:6px;color:var(--ink);margin:0 0 18px;text-transform:uppercase}
            .sub{opacity:.65;margin-bottom:26px;letter-spacing:4px;font-size:13px;text-transform:uppercase}
            .sub b{color:var(--red);animation:blink 1.1s steps(2) infinite}
            .stats{margin:8px 0 26px;font-size:18px;opacity:.85;letter-spacing:2px}
            .help{max-width:640px;line-height:1.7;font-size:15px;opacity:.9;margin-bottom:22px;text-align:left}
            .help b{color:var(--amber)}
            .diffs{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
            .lbl{font-size:13px;letter-spacing:4px;opacity:.75;margin-bottom:6px}

            /* ---------- Botones de metal ---------- */
            .btn{position:relative;font-family:var(--cond);font-weight:800;text-transform:uppercase;letter-spacing:4px;font-size:18px;color:var(--ink);
              min-width:280px;padding:14px 38px;margin:7px;border:2px solid #0b0b0d;border-radius:6px;cursor:pointer;
              background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),linear-gradient(180deg,#8d9096 0%,#5d6066 7%,#3d3f44 48%,#2a2b2f 92%,#1b1c1f 100%);
              box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.85),0 0 0 2px #17171a;
              text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.18);transition:box-shadow .15s,color .15s}
            .btn::before,.btn::after{content:'';position:absolute;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;
              background:radial-gradient(circle at 35% 30%,#d4d7dc,#4e5056 58%,#17171a);box-shadow:0 1px 1px rgba(0,0,0,.8)}
            .btn::before{left:12px}.btn::after{right:12px}
            .btn:hover:not(:disabled){color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.85),0 0 0 2px #17171a,0 0 18px rgba(255,42,58,.45)}
            .btn:active:not(:disabled){transform:translateY(2px);filter:brightness(.88)}
            .btn:disabled{opacity:.4;cursor:not-allowed}
            .btn.sec{min-width:240px;font-size:15px;padding:11px 30px}
            .btn.sel{color:var(--amber);text-shadow:0 0 8px rgba(255,194,61,.7),0 -1px 0 #000}
            .btn.sel::before{background:radial-gradient(circle at 35% 30%,#ff9a9a,#ff2a3a 55%,#5a0710);box-shadow:0 0 10px 2px rgba(255,42,58,.9)}
            .diffs .btn{min-width:150px;font-size:15px;padding:12px 26px}

            /* ---------- HUD ---------- */
            #hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;font-family:var(--mono)}
            .plate{position:relative;background:linear-gradient(180deg,rgba(44,46,50,.9),rgba(14,15,17,.93));border:2px solid #07070a;border-radius:6px;padding:8px 12px;
              box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 10px rgba(0,0,0,.7)}
            #leftcol{position:absolute;top:14px;left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
            #clk{font-size:30px;font-weight:900;color:#ff3b30;text-shadow:0 0 10px rgba(255,40,30,.8);letter-spacing:2px;line-height:1}
            #night{font-size:11px;letter-spacing:3px;opacity:.7;margin-top:4px}
            #keysRow{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;letter-spacing:2px}
            .kico{width:22px;height:22px;color:#4a4d54;flex:none}
            .kico.on{color:var(--amber);filter:drop-shadow(0 0 5px rgba(255,194,61,.9))}
            .brow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11px;letter-spacing:1px}
            .brow svg{width:18px;height:18px;flex:none;color:#b9b5a4}
            .seg{position:relative;width:120px;height:12px;background:#0b0b0d;border:1px solid #000;border-radius:2px;overflow:hidden}
            .seg>div{height:100%;transition:width .15s}
            .seg::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,#0b0b0d 10px 12px)}
            #cam{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:4px;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.9)}
            #cam i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:8px;box-shadow:0 0 8px var(--red);animation:blink 1s steps(2) infinite}
            .kb{position:absolute;bottom:16px;right:16px;font-size:13px;line-height:1.8;opacity:.85}
            .kb b{color:var(--amber)}
            #msg{position:fixed;top:46px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid #ffffff2a;padding:8px 18px;border-radius:4px;font-size:14px;letter-spacing:2px;text-transform:uppercase;
              opacity:0;transition:opacity .3s;z-index:6;pointer-events:none;white-space:nowrap}
            #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.92));z-index:4;display:none}
            #danger{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,40,.55));opacity:0;z-index:4}
            #flash{position:fixed;inset:0;pointer-events:none;background:#ff1030;opacity:0;z-index:9;transition:opacity 1.2s}
            body.touch .kb{display:none}
            @media (max-width:700px){#msg{white-space:normal;width:80%;text-align:center}}

            /* ---------- Controles táctiles ---------- */
            #tc{position:fixed;inset:0;z-index:7;display:none;touch-action:none}
            #lookZone{position:absolute;top:0;bottom:0;left:40%;right:0;touch-action:none}
            #joyZone{position:absolute;left:0;bottom:0;width:40%;height:62%;touch-action:none}
            #joyBase{position:absolute;left:calc(40px + env(safe-area-inset-left,0px));bottom:36px;width:130px;height:130px;border-radius:50%;pointer-events:none;
              background:radial-gradient(circle at 50% 50%,#101012 0 52%,#3b3d42 54%,#17181b 62%,#6a6d73 64%,#2a2b2f 72%,#0d0d0f 100%);box-shadow:0 4px 12px rgba(0,0,0,.8)}
            #knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;pointer-events:none;
              background:radial-gradient(circle at 35% 30%,#ff8a8a,#d4141f 55%,#4a0710);box-shadow:0 0 14px rgba(255,42,58,.7),inset 0 -3px 5px rgba(0,0,0,.5)}
            .tbtn{position:absolute;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
              font-family:var(--cond);font-weight:800;font-size:10px;letter-spacing:2px;color:var(--ink);touch-action:none;border:3px solid #0b0b0d;
              background:radial-gradient(circle at 35% 28%,#a2a5ab,#55575d 52%,#232428);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.8),0 0 0 2px #17171a}
            .tbtn svg{width:30px;height:30px}
            .tbtn.on{color:var(--amber);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.8),0 0 0 2px #17171a,0 0 16px rgba(255,194,61,.75)}
            .tbtn:active{filter:brightness(.85)}
            #btnRun{right:calc(28px + env(safe-area-inset-right,0px));bottom:28px}
            #btnFlash{right:calc(28px + env(safe-area-inset-right,0px));bottom:118px}
            #btnPause{right:calc(16px + env(safe-area-inset-right,0px));top:14px;width:50px;height:50px}
            #btnPause svg{width:22px;height:22px}
          </style>
          </head>
          <body>
          <canvas id="c"></canvas>
          <div id="vig"></div>
          <div id="danger"></div>
          <div id="flash"></div>

          <div id="hud">
            <div id="leftcol">
              <div class="plate">
                <div id="clk">12 AM</div>
                <div id="night">NOCHE 1 · <span id="timer">00:00</span></div>
                <div id="keysRow">
                  <svg class="kico" viewBox="0 0 24 24"><circle cx="7" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 12h11M18 12v4M21 12v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                  <svg class="kico" viewBox="0 0 24 24"><circle cx="7" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 12h11M18 12v4M21 12v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                  <svg class="kico" viewBox="0 0 24 24"><circle cx="7" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 12h11M18 12v4M21 12v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                  <span id="keysTxt">0/3</span>
                </div>
              </div>
              <div class="plate">
                <div class="brow">
                  <svg viewBox="0 0 24 24"><path d="M8 2h8v5l2 3v12H6V10l2-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 13v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  <div class="seg"><div id="batBar" style="background:#ffc23d;width:100%"></div></div>
                  <span id="batPct">100%</span>
                </div>
                <div class="brow">
                  <svg viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="currentColor"/></svg>
                  <div class="seg"><div id="stBar" style="background:#35e0a1;width:100%"></div></div>
                  <span>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                </div>
              </div>
            </div>
            <div id="cam"><i></i><span id="camTxt">PASILLO</span></div>
            <div class="plate kb" style="position:absolute">
              <b>WASD</b> mover · <b>Ratón</b> mirar · <b>Shift</b> correr<br>
              <b>F</b> linterna · <b>Esc</b> pausa
            </div>
          </div>
          <div id="msg"></div>

          <div id="tc">
            <div id="lookZone"></div>
            <div id="joyZone"></div>
            <div id="joyBase"><div id="knob"></div></div>
            <div class="tbtn" id="btnFlash"><svg viewBox="0 0 24 24"><path d="M8 2h8v5l2 3v12H6V10l2-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 13v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>LUZ</span></div>
            <div class="tbtn" id="btnRun"><svg viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="currentColor"/></svg><span>CORRER</span></div>
            <div class="tbtn" id="btnPause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1" fill="currentColor"/></svg></div>
          </div>

          <div id="menu" class="screen">
            <h1>LA PIZZERÍA</h1>
            <div class="sub"><b>●</b> Turno de noche · Silencio · Algo no se detiene</div>
            <div class="lbl">DIFICULTAD</div>
            <div class="diffs">
              <button class="btn" data-d="facil">FÁCIL</button>
              <button class="btn sel" data-d="normal">NORMAL</button>
              <button class="btn" data-d="dificil">DIFÍCIL</button>
            </div>
            <button class="btn" id="playBtn" disabled>JUGAR</button>
            <button class="btn sec" id="helpBtn">CÓMO JUGAR</button>
            <div id="loadTxt" style="margin-top:12px;font-size:12px;letter-spacing:2px;opacity:.6">CARGANDO MODELO...</div>
          </div>

          <div id="help" class="screen hidden">
            <h2>CÓMO JUGAR</h2>
            <div class="help">
              Estás atrapado en la pizzería de noche. Encuentra <b>3 llaves</b> repartidas por las salas y llega a la <b>puerta verde de SALIDA</b>, al fondo del pasillo.<br><br>
              Un animatrónico te persigue. Es <b>lento</b>, pero nunca se detiene. Si te alcanza, es el final.<br><br>
              La <b>linterna</b> lo aturde si lo iluminas de frente, pero gasta batería. Puedes <b>correr</b>, aunque la energía se agota.<br><br>
              <b>Móvil:</b> joystick a la izquierda, desliza a la derecha para mirar, botones LUZ y CORRER.<br>
              <b>PC:</b> WASD, ratón, Shift y F.<br><br>
              <b>Consejo:</b> escucha el latido y las voces. Cuanto más cerca, más fuerte.
            </div>
            <button class="btn sec" id="helpBack">VOLVER</button>
          </div>

          <div id="pause" class="screen hidden">
            <h2>PAUSA</h2>
            <button class="btn" id="resumeBtn">CONTINUAR</button>
            <button class="btn sec" id="pauseRestart">REINICIAR</button>
            <button class="btn sec" id="pauseMenu">MENÚ PRINCIPAL</button>
          </div>

          <div id="gameover" class="screen hidden">
            <h1 style="color:#ff1030">TE ATRAPÓ</h1>
            <div class="stats" id="goStats"></div>
            <button class="btn" id="retryBtn">REINTENTAR</button>
            <button class="btn sec" id="goMenu">MENÚ PRINCIPAL</button>
          </div>

          <div id="win" class="screen hidden">
            <h1 style="color:#35e0a1">6 AM</h1>
            <div class="stats" id="winStats"></div>
            <button class="btn" id="winAgain">JUGAR DE NUEVO</button>
            <button class="btn sec" id="winMenu">MENÚ PRINCIPAL</button>
          </div>

          <canvas id="stat"></canvas>
          <div id="crt"></div>

          <script type="importmap">
          {
            "imports": {
              "three": "./lib/three/build/three.module.js",
              "three/addons/": "./lib/three/examples/jsm/"
            }
          }
          </script>

          <script type="module">
          import * as THREE from 'three';
          import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

          const $ = id => document.getElementById(id);
          const CELL = 2, WALL_H = 3.2, GW = 40, GH = 28, EYE = 1.55, PLAYER_R = 0.3;
          const FACE_OFFSET = 0; // si el modelo mira hacia atrás, cambia a Math.PI
          const DIFF = {
            facil:   { speed: 1.0, delay: 14 },
            normal:  { speed: 1.6, delay: 8 },
            dificil: { speed: 2.2, delay: 4 }
          };

          const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
          if (IS_TOUCH) document.body.classList.add('touch');
          document.addEventListener('contextmenu', e => e.preventDefault());
          const joy = { x: 0, y: 0 };
          let runHeld = false;

          // MAP-BEGIN
          // ---------- Mapa de la pizzería (celdas de 2 m) ----------
          // 0 = libre, 1 = pared, 2 = objeto (mesa, mostrador...)
          const ROOMS = [
            { name: 'SALÓN PRINCIPAL',   r: [2, 2, 25, 15],  floor: 'checker',  wall: 0x9a92e0 },
            { name: 'SALA DE FIESTAS 1', r: [27, 2, 37, 8],  floor: 'confetti', wall: 0xe09abf },
            { name: 'SALA DE FIESTAS 2', r: [27, 10, 37, 15], floor: 'confetti', wall: 0x92d6e0 },
            { name: 'PASILLO',           r: [2, 17, 37, 18], floor: 'hall',     wall: 0x7e9aa6 },
            { name: 'COCINA',            r: [2, 20, 11, 25], floor: 'kitchen',  wall: 0xd5dcdc },
            { name: 'SALA DE PREMIOS',   r: [14, 20, 21, 25], floor: 'concrete', wall: 0xe0c092 },
            { name: 'PARTES Y SERVICIO', r: [24, 20, 29, 25], floor: 'concrete', wall: 0x949478 },
            { name: 'OFICINA',           r: [32, 20, 37, 25], floor: 'concrete', wall: 0x849484 }
          ];
          const START = [3, 17], EXIT_CELL = [37, 17];
          const KEY_SPOTS = [[3, 23], [20, 23], [36, 3], [36, 14], [25, 22], [36, 22], [23, 14]];
          const BON_SPOTS = [[36, 3], [36, 14], [25, 22], [36, 22], [23, 3], [23, 14]];
          const PROPS = [];
          const { grid, roomMap } = (function () {
            const g = Array.from({ length: GH }, () => Array(GW).fill(1));
            const rm = Array.from({ length: GH }, () => Array(GW).fill(-1));
            const carve = (x0, y0, x1, y1, v, id) => {
              for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { g[y][x] = v; if (id !== undefined && id >= 0) rm[y][x] = id; }
            };
            ROOMS.forEach((R, i) => carve(R.r[0], R.r[1], R.r[2], R.r[3], 0, i));
            // puertas
            [[6, 16, 7, 16, 3], [18, 16, 19, 16, 3], [31, 16, 32, 16, 3], [26, 4, 26, 5, 0], [26, 11, 26, 12, 0], [31, 9, 32, 9, 1],
             [6, 19, 7, 19, 3], [17, 19, 18, 19, 3], [26, 19, 27, 19, 3], [34, 19, 35, 19, 3]]
              .forEach(d => carve(d[0], d[1], d[2], d[3], 0, d[4]));
            // objetos
            const prop = (type, x0, y0, x1, y1) => { carve(x0, y0, x1, y1, 2); PROPS.push({ type, x0, y0, x1, y1 }); };
            prop('stage', 8, 2, 19, 4);
            prop('cove', 3, 2, 5, 4);
            for (const x of [6, 10, 14, 18, 22]) for (const y of [8, 12]) prop('table', x, y, x, y);
            prop('ptable', 30, 4, 34, 5);
            prop('ptable', 30, 12, 34, 13);
            prop('island', 5, 22, 8, 23);
            prop('counter', 3, 25, 10, 25);
            prop('shelf', 14, 25, 21, 25);
            prop('gift', 17, 22, 18, 23);
            prop('shelf', 24, 25, 29, 25);
            prop('crates', 27, 23, 28, 24);
            prop('desk', 33, 24, 36, 24);
            return { grid: g, roomMap: rm };
          })();
          // MAP-END

          let diff = 'normal', state = 'menu';
          let keys = [], keyMeshes = [], keyGroup = null;
          let keysGot = 0, battery = 100, stamina = 100, flashOn = true, elapsed = 0;
          let heartT = 0, voiceT = 12, curRoom = -1;
          const input = {};
          const player = { x: START[0] * CELL, z: START[1] * CELL, yaw: -Math.PI / 2, pitch: 0 };
          const EXIT = { x: 74, z: 35 };
          const bonnie = { x: 0, z: 0, heading: 0, path: [], timer: 0, active: false, ready: false, delay: 8, stun: 0, group: new THREE.Group() };
          const keyIcons = [...document.querySelectorAll('#keysRow .kico')];

          function lock() { if (!IS_TOUCH) $('c').requestPointerLock(); }
          function setTC(on) { $('tc').style.display = (IS_TOUCH && on) ? 'block' : 'none'; }

          // ---------- Animaciones de Bonnie ----------
          let mixer = null, curAnim = null;
          const clips = {};
          function playAnim(name) {
            if (!mixer || curAnim === name || !clips[name]) return;
            const next = mixer.clipAction(clips[name]);
            next.reset();
            if (name === 'Jumpscare') { next.setLoop(THREE.LoopOnce, 1); next.clampWhenFinished = true; }
            else next.setLoop(THREE.LoopRepeat, Infinity);
            if (curAnim) mixer.clipAction(clips[curAnim]).fadeOut(0.25);
            next.fadeIn(0.25).play();
            curAnim = name;
          }

          // ---------- Renderer / escena ----------
          const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          renderer.setSize(innerWidth, innerHeight);
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x040507);
          scene.fog = new THREE.Fog(0x040507, 4, 34);
          const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 100);
          scene.add(camera);

          const torch = new THREE.SpotLight(0xfff1d6, 80, 28, 0.42, 0.5, 2);
          torch.target.position.set(0, 0, -5);
          camera.add(torch); camera.add(torch.target);

          scene.add(new THREE.HemisphereLight(0x4a4560, 0x15110d, 0.5));
          const bonnieLight = new THREE.PointLight(0x8a5cff, 5, 8, 2); scene.add(bonnieLight);
          scene.add(bonnie.group);

          // ---------- Texturas ----------
          function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
          function toTex(c, rx = 1, ry = 1) {
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
            t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
            return t;
          }
          function speckle(x, w, h, n, a) {
            for (let i = 0; i < n; i++) { x.fillStyle = `rgba(0,0,0,${Math.random() * a})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
          }
          function floorTex(kind, wm, hm) {
            const c = mkCanvas(128, 128), x = c.getContext('2d');
            let tile = 2;
            if (kind === 'checker' || kind === 'hall') {
              const A = kind === 'checker' ? '#d9d4c7' : '#4d545c', B = kind === 'checker' ? '#17161b' : '#22252b';
              for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { x.fillStyle = (i + j) % 2 ? B : A; x.fillRect(i * 64, j * 64, 64, 64); }
              speckle(x, 128, 128, 300, 0.12);
            } else if (kind === 'kitchen') {
              x.fillStyle = '#c9d1d1'; x.fillRect(0, 0, 128, 128);
              x.strokeStyle = '#8d9898'; x.lineWidth = 3;
              for (let i = 0; i <= 128; i += 32) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 128); x.stroke(); x.beginPath(); x.moveTo(0, i); x.lineTo(128, i); x.stroke(); }
              speckle(x, 128, 128, 200, 0.1);
            } else if (kind === 'confetti') {
              tile = 4;
              x.fillStyle = '#1b1a45'; x.fillRect(0, 0, 128, 128);
              const pal = ['#ff4fd8', '#4fe0ff', '#ffd23d', '#7dff6a', '#ff6a4f'];
              for (let i = 0; i < 46; i++) { x.fillStyle = pal[i % 5]; x.beginPath(); x.arc(Math.random() * 128, Math.random() * 128, 2 + Math.random() * 3, 0, 7); x.fill(); }
            } else {
              tile = 4;
              x.fillStyle = '#2c2c30'; x.fillRect(0, 0, 128, 128);
              speckle(x, 128, 128, 700, 0.2);
            }
            return toTex(c, wm / tile, hm / tile);
          }
          function wallTexture() {
            const c = mkCanvas(128, 256), x = c.getContext('2d');
            for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? '#ffffff' : '#cfcfd9'; x.fillRect(i * 32, 0, 32, 256); }
            for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#eeeeee' : '#111111'; x.fillRect(i * 16, 150, 16, 16); x.fillStyle = i % 2 ? '#111111' : '#eeeeee'; x.fillRect(i * 16, 166, 16, 16); }
            x.fillStyle = '#8a8a92'; x.fillRect(0, 214, 128, 42);
            x.fillStyle = '#ffffff'; x.fillRect(0, 210, 128, 4);
            speckle(x, 128, 256, 300, 0.1);
            return toTex(c);
          }
          function ceilTexture(rx, ry) {
            const c = mkCanvas(128, 128), x = c.getContext('2d');
            x.fillStyle = '#3c3c42'; x.fillRect(0, 0, 128, 128);
            x.strokeStyle = '#1d1d21'; x.lineWidth = 5; x.strokeRect(0, 0, 128, 128);
            speckle(x, 128, 128, 200, 0.15);
            return toTex(c, rx, ry);
          }
          function signTex(text, w, h, fg, bg, font) {
            const c = mkCanvas(w, h), x = c.getContext('2d');
            x.fillStyle = bg; x.fillRect(0, 0, w, h);
            x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(8, 8, w - 16, h - 16);
            x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 4);
            const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
          }

          // ---------- Construcción de la pizzería ----------
          const lamb = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
          const stdm = (c, r = 0.6, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
          let worldGroup = null;
          const sources = [];
          const panelGeo = new THREE.PlaneGeometry(1.8, 0.55);

          function addSource(o) {
            const s = Object.assign({ level: 1, ft: Math.random(), flick: 0, dead: false, room: 0 }, o);
            s.base = new THREE.Color(o.col);
            if (o.panel) {
              s.mat = new THREE.MeshBasicMaterial({ color: o.dead ? 0x25252a : o.col });
              const m = new THREE.Mesh(panelGeo, s.mat);
              m.rotation.x = Math.PI / 2; m.position.set(o.x, WALL_H - 0.03, o.z); worldGroup.add(m);
            } else if (o.lamp) {
              s.mat = new THREE.MeshBasicMaterial({ color: o.col });
              const m = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.38, 10), s.mat);
              m.position.set(o.x, o.y + 0.2, o.z); worldGroup.add(m);
            }
            sources.push(s);
          }

          function buildWorld() {
            worldGroup = new THREE.Group(); scene.add(worldGroup);
            const W = GW * CELL, H = GH * CELL;
            const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); worldGroup.add(m); return m; };

            // suelo base y suelos de cada sala
            const base = new THREE.Mesh(new THREE.PlaneGeometry(W, H), lamb(0x1b1b1f));
            base.rotation.x = -Math.PI / 2; base.position.set(W / 2 - CELL / 2, -0.01, H / 2 - CELL / 2); worldGroup.add(base);
            ROOMS.forEach(R => {
              const [x0, y0, x1, y1] = R.r, w = (x1 - x0 + 1) * CELL, h = (y1 - y0 + 1) * CELL;
              const rough = (R.floor === 'checker' || R.floor === 'hall' || R.floor === 'kitchen') ? 0.32 : 0.85;
              const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: floorTex(R.floor, w, h), roughness: rough, metalness: 0.05 }));
              m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2 * CELL, 0, (y0 + y1) / 2 * CELL); worldGroup.add(m);
            });
            // techo
            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshLambertMaterial({ map: ceilTexture(W / 2, H / 2), color: 0x9a9aa2 }));
            ceil.rotation.x = Math.PI / 2; ceil.position.set(W / 2 - CELL / 2, WALL_H, H / 2 - CELL / 2); worldGroup.add(ceil);

            // paredes (instanciadas, teñidas según la sala)
            const wallCells = [];
            for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) {
              if (grid[r][c] !== 1) continue;
              let near = false;
              for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
                const rr = r + dr, cc = c + dc;
                if (rr >= 0 && cc >= 0 && rr < GH && cc < GW && grid[rr][cc] !== 1) { near = true; break; }
              }
              if (near) wallCells.push([c, r]);
            }
            const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(CELL, WALL_H, CELL), new THREE.MeshLambertMaterial({ map: wallTexture() }), wallCells.length);
            const m4 = new THREE.Matrix4(), col = new THREE.Color();
            wallCells.forEach(([c, r], i) => {
              m4.setPosition(c * CELL, WALL_H / 2, r * CELL); walls.setMatrixAt(i, m4);
              let id = -1;
              for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                const rr = r + dr, cc = c + dc;
                if (rr >= 0 && cc >= 0 && rr < GH && cc < GW && roomMap[rr][cc] >= 0) { id = roomMap[rr][cc]; break; }
              }
              col.set(id >= 0 ? ROOMS[id].wall : 0x555566); walls.setColorAt(i, col);
            });
            walls.instanceMatrix.needsUpdate = true; walls.instanceColor.needsUpdate = true;
            worldGroup.add(walls);

            // objetos
            const wood = lamb(0x4a2c1a), steel = stdm(0x9aa3a8, 0.35, 0.8), dark = lamb(0x1a1a1e), red = lamb(0x8a0e1c);
            const clothA = lamb(0xb3202a), clothB = lamb(0x2c55b8), white = lamb(0xdedede);
            const hatMats = [0xff4fd8, 0x4fe0ff, 0xffd23d, 0x7dff6a].map(c => lamb(c));
            const gTop = new THREE.CylinderGeometry(0.9, 0.9, 0.07, 20), gPed = new THREE.CylinderGeometry(0.12, 0.16, 0.78, 10);
            const gHat = new THREE.ConeGeometry(0.13, 0.34, 10), gPizza = new THREE.CylinderGeometry(0.32, 0.32, 0.05, 16);
            const pedMat = lamb(0x555560), pizzaMat = lamb(0xd9822b);
            let tn = 0;
            for (const P of PROPS) {
              const cx = (P.x0 + P.x1) / 2 * CELL, cz = (P.y0 + P.y1) / 2 * CELL, w = (P.x1 - P.x0 + 1) * CELL, d = (P.y1 - P.y0 + 1) * CELL;
              if (P.type === 'stage') {
                box(w, 0.6, d, wood, cx, 0.3, cz);
                box(w - 0.4, 0.12, 0.2, red, cx, 0.62, cz + d / 2 - 0.15);
                box(1.4, 3.0, d * 0.7, red, cx - w / 2 + 0.9, 2.1, cz - d * 0.1);
                box(1.4, 3.0, d * 0.7, red, cx + w / 2 - 0.9, 2.1, cz - d * 0.1);
                box(w, 0.7, 0.5, red, cx, 2.85, cz + d / 2 - 0.4);
                const banner = new THREE.Mesh(new THREE.PlaneGeometry(14, 2.4), new THREE.MeshBasicMaterial({ map: signTex('¡BIENVENIDOS A LA PIZZERÍA!', 1024, 176, '#ffd36b', '#6b1020', 'bold 78px Arial'), color: 0x9a9a9a }));
                banner.position.set(cx, 2.1, P.y0 * CELL - CELL / 2 + 0.06); worldGroup.add(banner);
              } else if (P.type === 'cove') {
                box(w, 2.9, d, lamb(0x4a1d6e), cx, 1.45, cz);
                const sg = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.0), new THREE.MeshBasicMaterial({ map: signTex('FUERA DE SERVICIO', 512, 112, '#ff4a4a', '#1c1c20', 'bold 52px Arial'), color: 0xaaaaaa }));
                sg.position.set(cx, 1.7, cz + d / 2 + 0.03); worldGroup.add(sg);
              } else if (P.type === 'table') {
                const g = new THREE.Group(); g.position.set(cx, 0, cz);
                const top = new THREE.Mesh(gTop, (tn % 2) ? clothA : clothB); top.position.y = 0.8; g.add(top);
                const ped = new THREE.Mesh(gPed, pedMat); ped.position.y = 0.39; g.add(ped);
                const pz = new THREE.Mesh(gPizza, pizzaMat); pz.position.set(0, 0.86, 0); g.add(pz);
                for (let i = 0; i < 3; i++) {
                  const h = new THREE.Mesh(gHat, hatMats[(tn + i) % 4]); const a = i * 2.1 + tn;
                  h.position.set(Math.cos(a) * 0.6, 1.03, Math.sin(a) * 0.6); g.add(h);
                }
                worldGroup.add(g); tn++;
              } else if (P.type === 'ptable') {
                box(w - 0.6, 0.08, d - 1.0, white, cx, 0.85, cz);
                box(w - 0.5, 0.5, d - 0.9, lamb(0xa02a6a), cx, 0.55, cz);
                for (let i = 0; i < 6; i++) {
                  const h = new THREE.Mesh(gHat, hatMats[i % 4]); h.position.set(cx - w / 2 + 1.2 + i * ((w - 2.4) / 5), 1.07, cz + (i % 2 ? 0.5 : -0.5)); worldGroup.add(h);
                }
                const cake = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16), lamb(0xff9ac4)); cake.position.set(cx, 1.05, cz); worldGroup.add(cake);
                const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.25, 6), lamb(0xffffff)); candle.position.set(cx, 1.3, cz); worldGroup.add(candle);
              } else if (P.type === 'island') {
                box(w - 0.4, 0.95, d - 0.4, steel, cx, 0.475, cz);
              } else if (P.type === 'counter') {
                box(w - 0.2, 0.95, d - 0.3, steel, cx, 0.475, cz);
                box(0.9, 0.12, 0.9, dark, cx - 2.5, 1.01, cz); box(0.9, 0.12, 0.9, dark, cx + 0.5, 1.01, cz);
              } else if (P.type === 'shelf') {
                box(w - 0.2, 2.2, d - 0.7, wood, cx, 1.1, cz);
                for (let i = 0; i < 6; i++) box(0.5, 0.5, 0.5, lamb([0xff4fd8, 0x4fe0ff, 0xffd23d, 0x7dff6a, 0xff6a4f, 0xa070ff][i]), cx - w / 2 + 1.3 + i * ((w - 2.6) / 5), 2.45, cz);
              } else if (P.type === 'gift') {
                box(w - 0.4, 2.2, d - 0.4, lamb(0xe9e9ef), cx, 1.1, cz);
                box(w - 0.2, 0.4, d - 0.2, dark, cx, 2.35, cz);
                for (const f of [-0.3, 0, 0.3]) box(0.3, 2.2, d - 0.3, dark, cx + f * w, 1.1, cz);
              } else if (P.type === 'crates') {
                box(w * 0.85, 1.5, d * 0.85, lamb(0x6b4a2a), cx, 0.75, cz);
                const t = box(w * 0.5, 1.1, d * 0.5, lamb(0x7a5832), cx + 0.2, 2.05, cz - 0.2); t.rotation.y = 0.3;
              } else if (P.type === 'desk') {
                box(w - 0.2, 0.85, d - 0.2, lamb(0x2f2a26), cx, 0.425, cz);
                const mon = new THREE.MeshBasicMaterial({ color: 0x1f6f90 });
                box(0.9, 0.6, 0.12, mon, cx - 1.0, 1.25, cz); box(0.9, 0.6, 0.12, mon, cx + 1.0, 1.25, cz);
              }
            }

            // globos en las salas de fiestas
            const balloonCols = [0xff4fd8, 0x4fe0ff, 0xffd23d, 0x7dff6a, 0xff6a4f];
            [1, 2].forEach(id => {
              const [x0, y0, x1, y1] = ROOMS[id].r;
              for (let i = 0; i < 7; i++) {
                const bx = (x0 + 0.2 + Math.random() * (x1 - x0 - 0.4)) * CELL, bz = (y0 + 0.2 + Math.random() * (y1 - y0 - 0.4)) * CELL;
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), lamb(balloonCols[i % 5])); b.scale.y = 1.2; b.position.set(bx, 2.55, bz); worldGroup.add(b);
                const s = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1.3, 4), lamb(0xdddddd)); s.position.set(bx, 1.55, bz); worldGroup.add(s);
              }
            });

            // puerta de salida
            const door = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.8, 3.2), new THREE.MeshStandardMaterial({ color: 0x0b6a40, emissive: 0x0a8f55, emissiveIntensity: 0.6 }));
            door.position.set(74.85, 1.4, 35); worldGroup.add(door);
            const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.7), new THREE.MeshBasicMaterial({ map: signTex('SALIDA', 256, 80, '#38ff9a', '#04170c', 'bold 48px Arial') }));
            sign.rotation.y = -Math.PI / 2; sign.position.set(74.65, 3.0, 35); worldGroup.add(sign);

            // ---------- Luces ----------
            const cfg = [
              { col: 0xffe6bd, i: 15, flick: 0.04, dead: 0.3 }, { col: 0xff4fd8, i: 14, flick: 0.08, dead: 0.1 },
              { col: 0x4fe0ff, i: 14, flick: 0.08, dead: 0.1 }, { col: 0xcfe9ff, i: 13, flick: 0.14, dead: 0.35 },
              { col: 0xffffff, i: 16, flick: 0.05, dead: 0.15 }, { col: 0xffc46b, i: 11, flick: 0.06, dead: 0.2 },
              { col: 0xd9d27a, i: 9, flick: 0.12, dead: 0.3 }, { col: 0x7ad1ff, i: 9, flick: 0.08, dead: 0.2 }
            ];
            ROOMS.forEach((R, id) => {
              const [x0, y0, x1, y1] = R.r, k = cfg[id];
              const xs = [], ys = [];
              for (let x = x0 + 2; x <= x1 - 1; x += 5) xs.push(x);
              if (!xs.length) xs.push((x0 + x1) / 2);
              if (y1 - y0 <= 2) ys.push((y0 + y1) / 2); else for (let y = y0 + 2; y <= y1 - 1; y += 5) ys.push(y);
              if (!ys.length) ys.push((y0 + y1) / 2);
              for (const x of xs) for (const y of ys) {
                const nearStart = Math.hypot(x - START[0], y - START[1]) < 6;
                addSource({ x: x * CELL, y: WALL_H - 0.3, z: y * CELL, col: k.col, i: k.i, flick: k.flick, dead: !nearStart && Math.random() < k.dead, panel: true, room: id });
              }
            });
            [[10, 0xff2a40], [13.5, 0x4a6bff], [17, 0xffb030]].forEach(([x, c]) =>
              addSource({ x: x * CELL, y: 2.9, z: 11, col: c, i: 26, flick: 0.1, lamp: true, room: 0 }));
            addSource({ x: 73, y: 2.4, z: 35, col: 0x38ff9a, i: 9, flick: 0, room: 3 });
            addSource({ x: 69, y: 1.6, z: 46, col: 0x4fc8ff, i: 7, flick: 0.15, room: 7 });
          }

          // ---------- Llaves ----------
          const keyGeo = new THREE.TorusGeometry(0.25, 0.08, 8, 16);
          const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffaa00, emissiveIntensity: 0.8 });
          function buildKeys() {
            if (keyGroup) scene.remove(keyGroup);
            keyGroup = new THREE.Group(); scene.add(keyGroup);
            keyMeshes = keys.map(([c, r]) => {
              const k = new THREE.Mesh(keyGeo, keyMat);
              k.position.set(c * CELL, 1.1, r * CELL);
              keyGroup.add(k);
              return k;
            });
          }

          // ---------- Luces dinámicas (pool de 4 luces puntuales) ----------
          const POOL = [];
          for (let i = 0; i < 4; i++) { const l = new THREE.PointLight(0xffffff, 0, 12, 2); scene.add(l); POOL.push({ l, src: null, cur: 0 }); }
          let poolT = 0;
          function updateLights(dt) {
            for (const s of sources) {
              if (s.dead) { s.level = 0; continue; }
              s.ft -= dt;
              if (s.ft <= 0) {
                if (Math.random() < s.flick) { s.level = Math.random() < 0.5 ? 0.05 : 0.45; s.ft = 0.03 + Math.random() * 0.14; }
                else { s.level = 1; s.ft = 0.3 + Math.random() * 2.5; }
              }
              if (s.mat) s.mat.color.copy(s.base).multiplyScalar(0.15 + 0.85 * s.level);
            }
            poolT -= dt;
            if (poolT <= 0) {
              poolT = 0.2;
              const cand = sources.filter(s => !s.dead)
                .map(s => ({ s, d: ((s.x - player.x) ** 2 + (s.z - player.z) ** 2) * (s.room === curRoom ? 1 : 6) }))
                .sort((a, b) => a.d - b.d).slice(0, POOL.length).map(o => o.s);
              for (const p of POOL) if (p.src && !cand.includes(p.src)) p.src = null;
              for (const s of cand) {
                if (POOL.some(p => p.src === s)) continue;
                const p = POOL.find(q => !q.src);
                if (p) { p.src = s; p.cur = 0; p.l.position.set(s.x, s.y, s.z); p.l.color.copy(s.base); }
              }
            }
            for (const p of POOL) {
              const tgt = p.src ? p.src.level * p.src.i : 0;
              p.cur += (tgt - p.cur) * Math.min(1, dt * 14);
              p.l.intensity = p.cur;
            }
          }

          // ---------- Colisiones ----------
          function isWall(x, z) {
            const c = Math.round(x / CELL), r = Math.round(z / CELL);
            if (c < 0 || r < 0 || c >= GW || r >= GH) return true;
            return grid[r][c] !== 0;
          }
          function blockedR(x, z, R) {
            return isWall(x - R, z - R) || isWall(x + R, z - R) || isWall(x - R, z + R) || isWall(x + R, z + R);
          }
          const blocked = (x, z) => blockedR(x, z, PLAYER_R);
          function clearLine(x0, z0, x1, z1, R) {
            const n = Math.ceil(Math.hypot(x1 - x0, z1 - z0) / 0.4);
            for (let i = 1; i <= n; i++) { const t = i / n; if (blockedR(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t, R)) return false; }
            return true;
          }

          // ---------- Partida ----------
          function newGame() {
            keys = KEY_SPOTS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
            keysGot = 0; battery = 100; stamina = 100; elapsed = 0; flashOn = true; curRoom = -1; voiceT = 12;
            keyIcons.forEach(k => k.classList.remove('on')); $('keysTxt').textContent = '0/3';

            player.x = START[0] * CELL; player.z = START[1] * CELL; player.yaw = -Math.PI / 2; player.pitch = 0;

            const far = BON_SPOTS.filter(([c, r]) => Math.hypot(c - START[0], r - START[1]) > 18);
            const [bc, br] = far[Math.floor(Math.random() * far.length)];
            bonnie.x = bc * CELL; bonnie.z = br * CELL; bonnie.path = []; bonnie.timer = 0;
            bonnie.active = false; bonnie.delay = DIFF[diff].delay; bonnie.stun = 0;

            buildKeys();
          }

          function startGame() {
            initAudio();
            newGame();
            show(null);
            $('hud').style.display = 'block';
            $('vig').style.display = 'block';
            $('flash').style.opacity = 0;
            state = 'playing';
            setTC(true);
            lock();
            stopAmb(); startAmb();
            say('Encuentra 3 llaves y escapa por la puerta verde.', 4000);
          }

          function pause() { state = 'paused'; setTC(false); show('pause'); document.exitPointerLock(); duckAmb(true); }
          function resume() { state = 'playing'; show(null); setTC(true); lock(); duckAmb(false); }
          function toMenu() {
            state = 'menu'; show('menu'); setTC(false); stopAmb();
            $('hud').style.display = 'none'; $('vig').style.display = 'none';
            newGame();
          }
          function endGame(type) {
            state = type;
            setTC(false); stopAmb();
            document.exitPointerLock();
            $('hud').style.display = 'none';
            if (type === 'won') { playSnd('mask', 0.9); $('winStats').textContent = `ESCAPASTE · Tiempo ${fmt(elapsed)} · Llaves 3/3`; show('win'); }
            else { $('goStats').textContent = `Sobreviviste ${fmt(elapsed)} · Llaves ${keysGot}/3`; show('gameover'); }
          }

          function show(id) {
            ['menu', 'help', 'pause', 'gameover', 'win'].forEach(s => $(s).classList.toggle('hidden', s !== id));
          }

          let msgTO = null;
          function say(t, ms = 2600) {
            const m = $('msg'); m.textContent = t; m.style.opacity = 1;
            clearTimeout(msgTO); msgTO = setTimeout(() => m.style.opacity = 0, ms);
          }
          const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

          function toggleFlash() {
            if (state !== 'playing') return;
            flashOn = !flashOn;
            torch.visible = flashOn && battery > 0;
          }

          // ---------- Movimiento del jugador ----------
          function movePlayer(dt) {
            const w = input.KeyW || input.ArrowUp, s = input.KeyS || input.ArrowDown;
            const a = input.KeyA || input.ArrowLeft, d = input.KeyD || input.ArrowRight;
            let fwd = (w ? 1 : 0) - (s ? 1 : 0) - joy.y;
            let strafe = (d ? 1 : 0) - (a ? 1 : 0) + joy.x;
            fwd = Math.max(-1, Math.min(1, fwd));
            strafe = Math.max(-1, Math.min(1, strafe));
            const mag = Math.min(1, Math.hypot(fwd, strafe));
            const moving = mag > 0.12;
            const sprint = (input.ShiftLeft || input.ShiftRight || runHeld) && moving && stamina > 0;
            if (sprint) stamina = Math.max(0, stamina - 24 * dt);
            else stamina = Math.min(100, stamina + 15 * dt);
            if (!moving) return;

            let fx = -Math.sin(player.yaw) * fwd + Math.cos(player.yaw) * strafe;
            let fz = -Math.cos(player.yaw) * fwd - Math.sin(player.yaw) * strafe;
            const len = Math.hypot(fx, fz) || 1; fx /= len; fz /= len;
            const step = (sprint ? 4.4 : 2.7) * dt * mag;

            const nx = player.x + fx * step; if (!blocked(nx, player.z)) player.x = nx;
            const nz = player.z + fz * step; if (!blocked(player.x, nz)) player.z = nz;
          }

          // ---------- Bonnie (IA) ----------
          function bfsPath(sc, sr, tc, tr) {
            const key = (c, r) => r * GW + c;
            const prev = new Map(); prev.set(key(sc, sr), null);
            const q = [[sc, sr]];
            for (let qi = 0; qi < q.length; qi++) {
              const [c, r] = q[qi];
              if (c === tc && r === tr) break;
              for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                const nc = c + dc, nr = r + dr;
                if (nc < 0 || nr < 0 || nc >= GW || nr >= GH || grid[nr][nc] !== 0 || prev.has(key(nc, nr))) continue;
                prev.set(key(nc, nr), [c, r]);
                q.push([nc, nr]);
              }
            }
            if (!prev.has(key(tc, tr))) return null;
            const path = []; let cur = [tc, tr];
            while (cur && !(cur[0] === sc && cur[1] === sr)) { path.push(cur); cur = prev.get(key(cur[0], cur[1])); }
            return path.reverse();
          }

          function panTo(x, z) {
            const dx = x - player.x, dz = z - player.z, d = Math.hypot(dx, dz) || 1;
            return Math.max(-1, Math.min(1, (Math.cos(player.yaw) * dx - Math.sin(player.yaw) * dz) / d));
          }

          function bonnieUpdate(dt) {
            if (!bonnie.ready) return;
            bonnie.delay -= dt;
            if (bonnie.delay > 0) return;
            if (!bonnie.active) { bonnie.active = true; say('Algo te está buscando. Corre.', 3500); playSnd('hello', 0.7, panTo(bonnie.x, bonnie.z)); }

            bonnie.timer -= dt;
            if (bonnie.timer <= 0) {
              bonnie.timer = 0.35;
              const bc = Math.round(bonnie.x / CELL), br = Math.round(bonnie.z / CELL);
              const pc = Math.round(player.x / CELL), pr = Math.round(player.z / CELL);
              bonnie.path = bfsPath(bc, br, pc, pr) || [];
            }

            // la linterna la aturde si la iluminas de frente
            bonnie.stun = Math.max(0, bonnie.stun - dt);
            if (flashOn && battery > 0) {
              const dx = bonnie.x - player.x, dz = bonnie.z - player.z, d = Math.hypot(dx, dz);
              if (d < 14 && d > 0.01) {
                const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
                const dot = (-dx * fx - dz * fz) / d;
                if (dot > 0.92) bonnie.stun = 0.35;
              }
            }
            let speed = DIFF[diff].speed;
            if (bonnie.stun > 0) speed *= 0.25;

            let tx = player.x, tz = player.z;
            if (clearLine(bonnie.x, bonnie.z, player.x, player.z, 0.55)) {
              bonnie.path = [];
            } else if (bonnie.path.length) {
              while (bonnie.path.length > 1 && clearLine(bonnie.x, bonnie.z, bonnie.path[1][0] * CELL, bonnie.path[1][1] * CELL, 0.55)) bonnie.path.shift();
              const [c, r] = bonnie.path[0]; tx = c * CELL; tz = r * CELL;
            }
            const dx = tx - bonnie.x, dz = tz - bonnie.z, dist = Math.hypot(dx, dz);
            if (dist < 0.2 && bonnie.path.length) bonnie.path.shift();
            else if (dist > 0.001) {
              const s = Math.min(speed * dt, dist);
              bonnie.x += dx / dist * s; bonnie.z += dz / dist * s;
              bonnie.heading = Math.atan2(dx, dz) + FACE_OFFSET;
            }

            // voces a lo lejos
            voiceT -= dt;
            if (voiceT <= 0 && actx) {
              voiceT = 16 + Math.random() * 18;
              const n = ['hello', 'hi', 'laugh'][Math.floor(Math.random() * 3)];
              const d = Math.hypot(bonnie.x - player.x, bonnie.z - player.z);
              playSnd(n, Math.max(0.2, 1 - d / 40), panTo(bonnie.x, bonnie.z));
            }

            if (Math.hypot(player.x - bonnie.x, player.z - bonnie.z) < 1.0) caught();
          }

          function caught() {
            state = 'caught';
            setTC(false);
            stopAmb();
            sfxScare();
            playSnd('scream', 1);
            $('flash').style.opacity = 1;
            const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
            bonnie.x = player.x + fx * 0.9; bonnie.z = player.z + fz * 0.9;
            bonnie.heading = Math.atan2(-fx, -fz) + FACE_OFFSET;
            setTimeout(() => endGame('gameover'), 1800);
          }

          // ---------- Audio ----------
          let actx = null, noiseBuf = null, master = null, ambSrc = null, ambGain = null, wantAmb = false;
          const SND = {};
          const SND_FILES = { scream: 'scream', amb: 'ambience', hello: 'hello', hi: 'hi', laugh: 'laugh', mask: 'mask' };
          function initAudio() {
            if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
            actx = new (window.AudioContext || window.webkitAudioContext)();
            master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination);
            const d = actx.createOscillator(); d.type = 'sawtooth'; d.frequency.value = 41;
            const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160;
            const g = actx.createGain(); g.gain.value = 0.035;
            d.connect(lp); lp.connect(g); g.connect(master); d.start();
            noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            loadSounds();
          }
          async function loadSounds() {
            for (const [k, f] of Object.entries(SND_FILES)) {
              try {
                const r = await fetch(`assets/sounds/${f}.ogg`);
                if (!r.ok) continue;
                SND[k] = await actx.decodeAudioData(await r.arrayBuffer());
              } catch (e) { /* sonido opcional */ }
            }
            if (wantAmb) startAmb();
          }
          function playSnd(name, vol = 1, pan = 0, rate = 1) {
            if (!actx || !SND[name]) return null;
            const s = actx.createBufferSource(); s.buffer = SND[name]; s.playbackRate.value = rate;
            const g = actx.createGain(); g.gain.value = vol;
            s.connect(g);
            if (actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(master); }
            else g.connect(master);
            s.start();
            return s;
          }
          function startAmb() {
            wantAmb = true;
            if (!actx || !SND.amb || ambSrc) return;
            ambSrc = actx.createBufferSource(); ambSrc.buffer = SND.amb; ambSrc.loop = true;
            ambGain = actx.createGain(); ambGain.gain.value = 0;
            ambSrc.connect(ambGain); ambGain.connect(master); ambSrc.start();
            ambGain.gain.linearRampToValueAtTime(0.4, actx.currentTime + 2);
          }
          function stopAmb() {
            wantAmb = false;
            if (!ambSrc || !actx) return;
            const s = ambSrc, g = ambGain; ambSrc = null; ambGain = null;
            g.gain.cancelScheduledValues(actx.currentTime);
            g.gain.setValueAtTime(g.gain.value, actx.currentTime);
            g.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
            setTimeout(() => { try { s.stop(); } catch (e) {} }, 700);
          }
          function duckAmb(on) {
            if (!ambGain || !actx) return;
            ambGain.gain.cancelScheduledValues(actx.currentTime);
            ambGain.gain.setValueAtTime(ambGain.gain.value, actx.currentTime);
            ambGain.gain.linearRampToValueAtTime(on ? 0.12 : 0.4, actx.currentTime + 0.3);
          }
          function tone(freq, vol, dur, type = 'sine') {
            if (!actx) return;
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, actx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
            o.connect(g); g.connect(master);
            o.start(); o.stop(actx.currentTime + dur + 0.05);
          }
          function heartbeat() { tone(55, 0.5, 0.18); setTimeout(() => tone(48, 0.35, 0.15), 220); }
          function sfxKey() { tone(880, 0.2, 0.3); setTimeout(() => tone(1320, 0.15, 0.3), 90); }
          function sfxScare() {
            if (!actx) return;
            const s = actx.createBufferSource(); s.buffer = noiseBuf;
            const g = actx.createGain();
            g.gain.setValueAtTime(0.7, actx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 1.2);
            s.connect(g); g.connect(master); s.start(); s.stop(actx.currentTime + 1.2);
          }

          // ---------- Entrada: teclado y ratón ----------
          addEventListener('keydown', e => {
            input[e.code] = true;
            if (e.repeat) return;
            if (e.code === 'KeyF') toggleFlash();
            if (e.code === 'Escape' && state === 'paused') resume();
          });
          addEventListener('keyup', e => input[e.code] = false);
          document.addEventListener('mousemove', e => {
            if (state !== 'playing' || document.pointerLockElement !== $('c')) return;
            player.yaw -= e.movementX * 0.0022;
            player.pitch -= e.movementY * 0.0022;
            player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
          });
          $('c').addEventListener('click', () => {
            if (state === 'playing' && !document.pointerLockElement) lock();
          });
          document.addEventListener('pointerlockchange', () => {
            if (!IS_TOUCH && !document.pointerLockElement && state === 'playing') pause();
          });
          document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') pause(); });

          // ---------- Entrada: táctil ----------
          const JR = 45;
          let jId = null, jcx = 0, jcy = 0;
          function jset(t) {
            let dx = t.clientX - jcx, dy = t.clientY - jcy;
            const d = Math.hypot(dx, dy);
            if (d > JR) { dx = dx / d * JR; dy = dy / d * JR; }
            joy.x = dx / JR; joy.y = dy / JR;
            $('knob').style.transform = `translate(${dx}px,${dy}px)`;
          }
          function jend() { jId = null; joy.x = 0; joy.y = 0; $('knob').style.transform = 'translate(0,0)'; }
          const jz = $('joyZone');
          jz.addEventListener('touchstart', e => {
            e.preventDefault();
            if (jId !== null) return;
            const t = e.changedTouches[0]; jId = t.identifier;
            const r = $('joyBase').getBoundingClientRect();
            jcx = r.left + r.width / 2; jcy = r.top + r.height / 2;
            jset(t);
          }, { passive: false });
          jz.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) if (t.identifier === jId) jset(t);
          }, { passive: false });
          ['touchend', 'touchcancel'].forEach(n => jz.addEventListener(n, e => {
            for (const t of e.changedTouches) if (t.identifier === jId) jend();
          }));

          let lId = null, lx = 0, ly = 0;
          const lz = $('lookZone');
          lz.addEventListener('touchstart', e => {
            e.preventDefault();
            if (lId !== null) return;
            const t = e.changedTouches[0]; lId = t.identifier; lx = t.clientX; ly = t.clientY;
          }, { passive: false });
          lz.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) if (t.identifier === lId) {
              if (state === 'playing') {
                player.yaw -= (t.clientX - lx) * 0.0055;
                player.pitch -= (t.clientY - ly) * 0.0055;
                player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
              }
              lx = t.clientX; ly = t.clientY;
            }
          }, { passive: false });
          ['touchend', 'touchcancel'].forEach(n => lz.addEventListener(n, e => {
            for (const t of e.changedTouches) if (t.identifier === lId) lId = null;
          }));

          function bindBtn(id, down, up) {
            const el = $(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, { passive: false });
            ['touchend', 'touchcancel'].forEach(n => el.addEventListener(n, e => { e.preventDefault(); if (up) up(); }, { passive: false }));
          }
          bindBtn('btnRun', () => { runHeld = true; }, () => { runHeld = false; });
          bindBtn('btnFlash', toggleFlash);
          bindBtn('btnPause', () => { if (state === 'playing') pause(); });

          // ---------- Menús ----------
          $('playBtn').onclick = startGame;
          $('helpBtn').onclick = () => show('help');
          $('helpBack').onclick = () => show('menu');
          document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
            diff = b.dataset.d;
            document.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('sel', x === b));
          });
          $('resumeBtn').onclick = resume;
          $('pauseRestart').onclick = startGame;
          $('pauseMenu').onclick = toMenu;
          $('retryBtn').onclick = startGame;
          $('goMenu').onclick = toMenu;
          $('winAgain').onclick = startGame;
          $('winMenu').onclick = toMenu;

          // ---------- Modelo de Bonnie ----------
          function fitModel(m) {
            m.scale.setScalar(1);
            m.updateMatrixWorld(true);
            let box = new THREE.Box3().setFromObject(m);
            const size = box.getSize(new THREE.Vector3());
            m.scale.setScalar(2.3 / Math.max(size.y, 0.001));
            m.updateMatrixWorld(true);
            box = new THREE.Box3().setFromObject(m);
            const c = box.getCenter(new THREE.Vector3());
            m.position.set(-c.x, -box.min.y, -c.z);
          }

          function makeFallbackBonnie() {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x5b3aa8, roughness: 0.6 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 1.5, 12), mat);
            body.position.y = 0.9; g.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), mat);
            head.position.y = 1.9; g.add(head);
            for (const x of [-0.2, 0.2]) {
              const ear = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1, 0.12), mat);
              ear.position.set(x, 2.9, 0); g.add(ear);
            }
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
            for (const x of [-0.16, 0.16]) {
              const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
              eye.position.set(x, 1.95, 0.42); g.add(eye);
            }
            return g;
          }

          function bonnieReady() {
            bonnie.ready = true;
            $('playBtn').disabled = false;
            $('loadTxt').textContent = 'LISTO';
          }

          new GLTFLoader().load(
            'assets/fnaf_ar_toy_bonnie.glb',
            gltf => {
              const m = gltf.scene;
              m.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
              fitModel(m);
              bonnie.group.add(m);
              mixer = new THREE.AnimationMixer(m);
              gltf.animations.forEach(a => { clips[a.name.replace(/^.*--/, '')] = a; });
              playAnim('Idle');
              bonnieReady();
            },
            undefined,
            () => {
              bonnie.group.add(makeFallbackBonnie());
              $('loadTxt').textContent = 'MODELO NO ENCONTRADO: VERSIÓN DE RESPALDO';
              bonnieReady();
            }
          );

          // ---------- Estática de televisión ----------
          const statC = $('stat'), sctx = statC.getContext('2d');
          statC.width = 160; statC.height = 90;
          const simg = sctx.createImageData(160, 90);
          let statT = 0;
          function drawStatic(dt) {
            statT -= dt; if (statT > 0) return;
            statT = 0.07;
            const d = simg.data;
            for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
            sctx.putImageData(simg, 0, 0);
          }

          // ---------- Bucle principal ----------
          const HRS = ['12', '1', '2', '3', '4', '5', '6'];
          function update(dt) {
            const t = performance.now() / 1000;
            updateLights(dt);
            drawStatic(dt);

            if (state === 'menu') player.yaw += dt * 0.08;

            if (mixer) {
              let want = 'Idle';
              if (state === 'caught' || state === 'gameover') want = 'Jumpscare';
              else if (state === 'playing' && bonnie.active) want = bonnie.stun > 0 ? 'Shocked' : 'Charge';
              playAnim(want);
              mixer.update(dt);
            }

            let statOp = (state === 'menu' || state === 'gameover' || state === 'win' || state === 'paused') ? 0.16 : 0.06;

            if (state === 'playing') {
              elapsed += dt;
              movePlayer(dt);
              bonnieUpdate(dt);

              if (battery > 0 && flashOn) battery = Math.max(0, battery - 1.6 * dt);
              torch.visible = flashOn && battery > 0;

              for (let i = 0; i < keys.length; i++) {
                if (keyMeshes[i].visible && Math.hypot(player.x - keys[i][0] * CELL, player.z - keys[i][1] * CELL) < 1.8) {
                  keyMeshes[i].visible = false; keysGot++; sfxKey();
                  keyIcons[keysGot - 1].classList.add('on');
                  say(`Llave ${keysGot}/3 encontrada`);
                }
              }

              if (Math.hypot(player.x - EXIT.x, player.z - EXIT.z) < 2.4) {
                if (keysGot >= 3) { endGame('won'); }
                else say('La puerta está cerrada. Necesitas 3 llaves.', 1800);
              }

              const dist = Math.hypot(player.x - bonnie.x, player.z - bonnie.z);
              if (bonnie.active && dist < 12 && actx) {
                heartT -= dt;
                if (heartT <= 0) { heartbeat(); heartT = Math.max(0.4, dist / 22); }
              }

              const pr = (roomMap[Math.round(player.z / CELL)] || [])[Math.round(player.x / CELL)];
              if (pr >= 0 && pr !== curRoom) { curRoom = pr; $('camTxt').textContent = ROOMS[pr].name; }

              $('clk').textContent = HRS[Math.min(6, Math.floor(elapsed / 60))] + ' AM';
              $('keysTxt').textContent = `${keysGot}/3`;
              $('timer').textContent = fmt(elapsed);
              $('batBar').style.width = battery + '%';
              $('batPct').textContent = Math.round(battery) + '%';
              $('stBar').style.width = stamina + '%';
              $('stBar').style.background = stamina < 25 ? '#ef476f' : '#35e0a1';
              $('btnFlash').classList.toggle('on', flashOn && battery > 0);
              $('btnRun').classList.toggle('on', runHeld);
              const dng = bonnie.active ? Math.max(0, 1 - dist / 9) : 0;
              $('danger').style.opacity = dng * 0.9;
              statOp = 0.06 + dng * 0.22;
            }

            if (state === 'caught') {
              camera.position.x += (Math.random() - 0.5) * 0.25;
              camera.position.y += (Math.random() - 0.5) * 0.25;
              statOp = 0.6;
            }
            $('stat').style.opacity = statOp;

            if (state !== 'caught') {
              camera.position.set(player.x, EYE, player.z);
            }
            camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

            bonnie.group.position.set(bonnie.x, 0, bonnie.z);
            bonnie.group.rotation.y = bonnie.heading;
            bonnieLight.position.set(bonnie.x, 1.8, bonnie.z);
            bonnieLight.intensity = bonnie.active ? 5 + Math.sin(t * 6) * 1.5 : 1.2;

            keyMeshes.forEach(k => { if (k.visible) k.rotation.y += dt * 2; });
          }

          addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
          });

          const clock = new THREE.Clock();
          function loop() {
            const dt = Math.min(clock.getDelta(), 0.05);
            update(dt);
            renderer.render(scene, camera);
            requestAnimationFrame(loop);
          }

          buildWorld();
          newGame();
          loop();
          </script>
          </body>
          </html>
          HTML_EOF

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar el juego para el APK
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el juego
        uses: actions/download-artifact@v4
        with:
          name: site
          path: www

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "La Pizzeria" com.elalmacen.juego --web-dir=www
          node -e "const f='capacitor.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.backgroundColor='#000000';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowBackground">@android:color/black</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Almacen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
