          func _make_gun(kind: String) -> Node3D:
              var g := Node3D.new()
              var metal := _mat(Color(0.16, 0.17, 0.19), 0.4, 0.7)
              var steel := _mat(Color(0.5, 0.54, 0.58), 0.3, 0.9)
              var wood := _mat(Color(0.4, 0.25, 0.12), 0.6, 0.0, "", 1.0)
              var fz := 0.32
              if kind == "escopeta":
                  _box(g, Vector3(0.1, 0.1, 0.85), Vector3(0, 0, 0.1), metal)
                  _box(g, Vector3(0.07, 0.07, 0.6), Vector3(0, 0.02, 0.5), steel)
                  _box(g, Vector3(0.09, 0.09, 0.25), Vector3(0, -0.02, 0.25), wood)
                  _box(g, Vector3(0.1, 0.14, 0.4), Vector3(0, -0.02, -0.45), wood)
                  fz = 0.95
              elif kind == "rifle":
                  _box(g, Vector3(0.1, 0.13, 0.5), Vector3(0, 0, 0.1), metal)
                  _box(g, Vector3(0.05, 0.05, 0.5), Vector3(0, 0.02, 0.7), steel)
                  _box(g, Vector3(0.07, 0.2, 0.12), Vector3(0, -0.14, 0.15), metal)
                  _box(g, Vector3(0.09, 0.14, 0.45), Vector3(0, -0.01, -0.4), wood)
                  fz = 0.97
              else:
                  _box(g, Vector3(0.07, 0.1, 0.32), Vector3(0, 0, 0.1), metal)
                  _box(g, Vector3(0.06, 0.16, 0.09), Vector3(0, -0.12, -0.04), metal)
              var fl := MeshInstance3D.new()
              var fs := SphereMesh.new()
              fs.radius = 0.14
              fs.height = 0.28
              fl.mesh = fs
              fl.material_override = _glow(Color(1.0, 0.8, 0.3), 4.0)
              fl.position = Vector3(0, 0, fz)
              fl.visible = false
              fl.name = "Flash"
              g.add_child(fl)
              return g

          func _equip(c: CharacterBody3D, kind: String) -> void:
              var st: Dictionary = c.get_meta("st")
              var old = st["gun"]
              if is_instance_valid(old):
                  old.queue_free()
              st["gun"] = null
              st["flash"] = null
              st["weapon"] = kind
              if kind == "":
                  return
              var g := _make_gun(kind)
              g.rotation_degrees = Vector3(90, 0, 0)
              st["hold"].add_child(g)
              st["gun"] = g
              st["flash"] = g.get_node("Flash")

          # Animación omnidireccional: usa la velocidad en el marco del personaje
          func _pose(c: CharacterBody3D, st: Dictionary, delta: float) -> void:
              var sp: float = st["speed"]
              var lf: float = st["lf"]
              var ls: float = st["ls"]
              var sw := clampf(sp / 4.0, 0.0, 1.0)
              st["phase"] = float(st["phase"]) + (lf + absf(ls) * 0.6) * delta * 1.8
              var ph: float = st["phase"]
              var side := clampf(ls / 4.0, -1.0, 1.0)
              var airborne: bool = c.position.y > 0.02
              var tuck: float = -0.5 if airborne else 0.0
              var k := minf(1.0, delta * 16.0)
              var legs: Array = st["legs"]
              legs[0].rotation.x = lerpf(legs[0].rotation.x, sin(ph) * 0.7 * sw + tuck, k)
              legs[1].rotation.x = lerpf(legs[1].rotation.x, -sin(ph) * 0.7 * sw + tuck, k)
              legs[0].rotation.z = lerpf(legs[0].rotation.z, -side * 0.15 + sin(ph) * 0.12 * side * sw, k)
              legs[1].rotation.z = lerpf(legs[1].rotation.z, -side * 0.15 - sin(ph) * 0.12 * side * sw, k)
              var body: Node3D = st["body"]
              body.position.y = lerpf(body.position.y, absf(sin(ph)) * 0.05 * sw, minf(1.0, delta * 14.0))
              body.rotation.x = lerpf(body.rotation.x, clampf(lf / 4.0, -1.0, 1.0) * 0.07 * sw, k)
              body.rotation.z = lerpf(body.rotation.z, -side * 0.08, k)
              var al: Node3D = st["arm_l"]
              var ar: Node3D = st["arm_r"]
              al.rotation.x = lerpf(al.rotation.x, -sin(ph) * 0.5 * sw + tuck * 0.4, k)
              if is_instance_valid(st["gun"]):
                  ar.rotation.x = lerpf(ar.rotation.x, -1.35 + float(st["recoil"]) * 0.22 + sin(ph) * 0.03 * sw, minf(1.0, delta * 20.0))
              else:
                  ar.rotation.x = lerpf(ar.rotation.x, sin(ph) * 0.5 * sw - 0.1, k)
              st["recoil"] = maxf(0.0, float(st["recoil"]) - delta * 9.0)
              st["flash_t"] = maxf(0.0, float(st["flash_t"]) - delta)
              var fl = st["flash"]
              if is_instance_valid(fl):
                  fl.visible = float(st["flash_t"]) > 0.0

          func _animate_all(delta: float) -> void:
              for c in all_chars:
                  var st: Dictionary = c.get_meta("st")
                  var v3: Vector3 = (c.position - st["last"]) / maxf(delta, 0.0001)
                  st["last"] = c.position
                  if not st["alive"]:
                      continue
                  var fw := Vector3(sin(c.rotation.y), 0.0, cos(c.rotation.y))
                  var rt := Vector3(-cos(c.rotation.y), 0.0, sin(c.rotation.y))
                  var k := minf(1.0, delta * 10.0)
                  st["lf"] = lerpf(float(st["lf"]), v3.dot(fw), k)
                  st["ls"] = lerpf(float(st["ls"]), v3.dot(rt), k)
                  st["speed"] = Vector2(float(st["lf"]), float(st["ls"])).length()
                  _pose(c, st, delta)

