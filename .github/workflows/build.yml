            P.g.position.set(sp.x, 0, sp.z); P.lx = sp.x; P.lz = sp.z;
            world.add(P.g);
            $('av').style.background = `radial-gradient(${hex(SKINS[selIdx].skin)},${hex(SKINS[selIdx].vest)})`;

            bots = [];
            for (let i = 0; i < 19; i++) {
              const t = randomFree(20, 105);
              const b = makeEnt('BOT ' + (i + 1), pick(SKINS), true, 'rifle');
              b.g.position.set(t.x, 0, t.z); b.tx = t.x; b.tz = t.z; b.lx = t.x; b.lz = t.z;
              world.add(b.g); bots.push(b);
            }
            slots = [{ id: 'pistol', mag: 12, res: 48 }, null, null];
            cur = 0; kills = 0; matchT = 0; zPh = 0; reloadT = 0;
            zone.r = 130; zone.target = 130;
            endQueued = false; slowT = 0; camShake = 0; camFov = 65;
            equip(0);
            $('feed').innerHTML = '';
            $('lobby').hidden = true; $('end').hidden = true; $('hud').hidden = false;
            inGame = true; running = true; ready = false;
            cdT = 3.5;
            showCount('3');
          }
          function endMatch(win) {
            if (!running) return;
            running = false; ready = false;
            if (document.pointerLockElement) document.exitPointerLock();
            const alive = bots.filter(b => b.alive).length;
            const place = win ? 1 : alive + 1;
            $('endT').textContent = win ? '🏆 ¡VICTORIA!' : '💀 ELIMINADO';
            const s = Math.floor(matchT);
            $('endS').textContent = `Puesto #${place} · Eliminaciones: ${kills} · Tiempo ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
            const end = $('end');
            end.hidden = false;
            end.style.animation = 'none'; void end.offsetWidth; end.style.animation = '';
          }
          function toLobby() {
            running = false; inGame = false; ready = false;
            $('hud').hidden = true; $('end').hidden = true; $('lobby').hidden = false;
            resizePreview();
          }
          $('play').addEventListener('click', startMatch);
          $('backLobby').addEventListener('click', toLobby);

          // ================= LÓGICA =================
          function updateZone(dt) {
            matchT += dt;
            if (zPh < ZPH.length && matchT >= ZPH[zPh].t) {
              zone.target = ZPH[zPh].r; zPh++;
              feed('⚠ La zona se reduce');
            }
            zone.r += (zone.target - zone.r) * Math.min(1, dt * 0.35);
            zoneWall.scale.set(zone.r, 1, zone.r);
            zoneWall.material.opacity = 0.3 + 0.1 * Math.sin(time * 4);
            if (P.alive && Math.hypot(P.g.position.x, P.g.position.z) > zone.r) damageEnt(P, 3 * dt, null);
            for (const b of bots) {
              if (b.alive && Math.hypot(b.g.position.x, b.g.position.z) > zone.r) damageEnt(b, 4 * dt, null);
            }
            $('zone').classList.toggle('warn', zPh < ZPH.length && ZPH[zPh].t - matchT < 8);
          }
          function updatePlayer(dt) {
            if (!P.alive) return;
            const ix = clamp(joyX + (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), -1, 1);
            const iy = clamp(joyY + (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0), -1, 1);
            if (keys.ArrowLeft) P.yaw += 2.5 * dt;
            if (keys.ArrowRight) P.yaw -= 2.5 * dt;
            const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw);
            const rx = -fz, rz = fx;
            const mx = fx * -iy + rx * ix, mz = fz * -iy + rz * ix;
            const mag = Math.min(1, Math.hypot(ix, iy)), len = Math.hypot(mx, mz);
            if (len > 0.001 && mag > 0.01) {
              const sp = 6 * mag * dt;
              moveEnt(P, mx / len * sp, mz / len * sp);
            }
            P.vy -= 22 * dt;
            P.g.position.y += P.vy * dt;
            if (P.g.position.y <= 0) { P.g.position.y = 0; P.vy = 0; P.ground = true; }
            P.g.rotation.y = P.yaw;

            P.cd = Math.max(0, (P.cd || 0) - dt);
            if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { reloadT = 0; finishReload(); } }
            const s = slots[cur], w = W[s.id];
            $('cross').classList.toggle('spread', fireHeld && w.auto);
            if (fireHeld && (w.auto || fireEdge) && P.cd <= 0 && reloadT <= 0) {
              if (s.mag > 0) { s.mag--; P.cd = w.rate; playerShoot(); }
              else startReload();
            }
            fireEdge = false;
          }
          function updateBots(dt) {
            const pp = P.g.position;
            for (const b of bots) {
              if (!b.alive) continue;
              const p = b.g.position;
              const dx = pp.x - p.x, dz = pp.z - p.z, d = Math.hypot(dx, dz) || 1;
              b.cd -= dt;
              if (P.alive && d < 42) {
                b.yaw = Math.atan2(dx, dz); b.g.rotation.y = b.yaw;
                const sp = 3.2 * dt;
                if (d > 18) moveEnt(b, dx / d * sp, dz / d * sp);
                else if (d < 9) moveEnt(b, -dx / d * sp, -dz / d * sp);
                else moveEnt(b, -dz / d * sp * b.strafe, dx / d * sp * b.strafe);
                if (b.cd <= 0) {
                  const origin = new V(p.x, p.y + 1.8, p.z);
                  const aim = new V(pp.x, pp.y + 1.3, pp.z).sub(origin).normalize();
                  const muzzle = b.gun ? b.gun.localToWorld(new V(0, 0.05, 0.78)) : origin;
                  fireShot(b, 'rifle', origin, aim, { spread: 0.07, mul: 0.6, targets: [P.g], muzzle });
                  b.cd = rnd(0.7, 1.4);
                }
              } else {
                b.wander -= dt;
                if (b.wander <= 0 || Math.hypot(b.tx - p.x, b.tz - p.z) < 1) {
                  const t = randomFree(10, 95); b.tx = t.x; b.tz = t.z; b.wander = rnd(4, 9);
                }
                const dx2 = b.tx - p.x, dz2 = b.tz - p.z, d2 = Math.hypot(dx2, dz2) || 1;
                moveEnt(b, dx2 / d2 * 2.2 * dt, dz2 / d2 * 2.2 * dt);
                b.yaw = Math.atan2(dx2, dz2);
                b.g.rotation.y = ease(b.g.rotation.y, b.yaw, 8, dt);
              }
            }
          }
          function updatePickups(dt) {
            const pp = P.g.position;
            for (const k of pickups) {
              if (!k.m) continue;
              k.appear = Math.min(1, k.appear + dt * 3);
              const bob = Math.sin(time * 3 + k.x) * 0.1;
              k.m.rotation.y += dt * 1.5;
              k.m.position.y = 0.6 + bob;
              k.m.scale.setScalar(0.6 + 0.4 * (1 - Math.pow(1 - k.appear, 3)));
              k.m.userData.ring.scale.setScalar(1 + Math.sin(time * 4 + k.z) * 0.08);
              if (P.alive && Math.hypot(pp.x - k.x, pp.z - k.z) < 1.8 && applyPickup(k)) {
                world.remove(k.m); k.m = null;
              }
            }
          }
          function applyPickup(k) {
            if (k.type === 'med') {
              if (P.hp >= 100) return false;
              P.hp = Math.min(100, P.hp + 35); feed('+35 vida'); return true;
            }
            if (k.type === 'vest') {
              if (P.armor >= 50) return false;
              P.armor = 50; feed('Chaleco equipado'); return true;
            }
            return giveWeapon(k.type);
          }
          function animateAll(dt) {
            for (const e of [P, ...bots]) {
              if (!e.alive) continue;
              const p = e.g.position;
              e.spd = Math.hypot(p.x - e.lx, p.z - e.lz) / Math.max(dt, 1e-4);
              e.lx = p.x; e.lz = p.z;
              animEnt(e, dt, e.spd, !e.ground);
            }
            updateDeaths(dt);
          }
          function updateGame(dt) {
            updateZone(dt);
            updatePlayer(dt);
            updateBots(dt);
            updatePickups(dt);
            if (P.alive && bots.every(b => !b.alive)) endMatch(true);
          }

          // ================= CÁMARA, HUD Y MINIMAPA =================
          function updateCam(dt) {
            const pp = P.g.position, fx = Math.sin(P.yaw), fz = Math.cos(P.yaw);
            const cp = new V(
              pp.x - fx * 5.5 - fz * 0.9,
              pp.y + 2.5 - P.pitch * 2.5,
              pp.z - fz * 5.5 + fx * 0.9
            );
            camera.position.lerp(cp, Math.min(1, dt * 16));
            if (camShake > 0) {
              camera.position.x += rnd(-1, 1) * camShake * 0.4;
              camera.position.y += rnd(-1, 1) * camShake * 0.3;
              camShake = Math.max(0, camShake - dt * 2.2);
            }
            const tgt = new V(pp.x, pp.y + 1.5, pp.z);
            camera.lookAt(tgt.add(fwdVec().multiplyScalar(12)));
            const spdK = Math.min(1, (P.spd || 0) / 6);
            const targetFov = 65 + spdK * 5 + (P.recoil || 0) * 0.6;
            camFov = ease(camFov, targetFov, 6, dt);
            camera.fov = camFov;
            camera.updateProjectionMatrix();
          }
          function hud() {
            $('hp').style.width = P.hp + '%';
            $('ar').style.width = P.armor + '%';
            $('hpt').textContent = Math.ceil(P.hp) + (P.armor > 0 ? '  ·  🛡 ' + Math.ceil(P.armor) : '');
            const alive = bots.filter(b => b.alive).length + (P.alive ? 1 : 0);
            $('alive').textContent = '👥 ' + alive;
            if (zPh < ZPH.length) $('zone').textContent = 'Zona en ' + Math.max(0, Math.ceil(ZPH[zPh].t - matchT)) + 's';
            else $('zone').textContent = 'Zona final';
            for (let i = 0; i < 3; i++) {
              const el = $('sl' + i), s = slots[i];
              el.classList.toggle('on', i === cur);
              el.querySelector('b').textContent = s ? W[s.id].name : 'VACÍO';
              el.querySelector('span').textContent = !s ? '—' : (reloadT > 0 && i === cur ? 'RECARGANDO' : s.mag + ' / ' + s.res);
            }
          }
          function drawMini() {
            const c = $('mini'), x = c.getContext('2d'), S = 260, R = S / 2, k = R / 135;
            x.clearRect(0, 0, S, S);
            x.fillStyle = 'rgba(40,130,210,.85)'; x.beginPath(); x.arc(R, R, R, 0, 7); x.fill();
            x.fillStyle = 'rgba(120,200,90,.95)'; x.beginPath(); x.arc(R, R, 132 * k, 0, 7); x.fill();
            x.strokeStyle = '#ff3b4a'; x.lineWidth = 4; x.beginPath(); x.arc(R, R, zone.r * k, 0, 7); x.stroke();
            x.fillStyle = '#ff5252';
            for (const b of bots) if (b.alive) { x.beginPath(); x.arc(R + b.g.position.x * k, R + b.g.position.z * k, 3.5, 0, 7); x.fill(); }
            if (P.alive) {
              x.save(); x.translate(R + P.g.position.x * k, R + P.g.position.z * k);
              x.rotate(Math.PI - P.yaw);
              x.fillStyle = '#ffe066'; x.strokeStyle = '#000'; x.lineWidth = 2;
              x.beginPath(); x.moveTo(0, -11); x.lineTo(8, 8); x.lineTo(0, 4); x.lineTo(-8, 8); x.closePath(); x.fill(); x.stroke();
              x.restore();
            }
          }

          // ================= PREVIEW LOBBY =================
          function renderPreview(dt) {
            if (!prevDrag) prevRot += dt * 0.5;
            if (prevChar) {
              prevChar.rotation.y = ease(prevChar.rotation.y, prevRot, 12, dt);
              if (prevEnt) { prevEnt.spd = 0; animEnt(prevEnt, dt, 0, false); }
            }
            pr.render(pscene, pcam);
          }

          // ================= BUCLE PRINCIPAL =================
          let last = performance.now(), mini = 0;
          function loop(now) {
            const raw = Math.min(0.05, (now - last) / 1000); last = now;
            time += raw;
            const slow = slowT > 0 ? 0.35 : 1;
            slowT = Math.max(0, slowT - raw);
            const dt = raw * slow;
            if (inGame) {
              if (running) {
                if (!ready) {
                  cdT -= raw;
                  const n = Math.ceil(cdT);
                  if (cdT > 0 && n !== loop.lastN) { loop.lastN = n; showCount(String(n)); }
                  if (cdT <= 0) { ready = true; showCount('¡YA!'); feed('¡Partida iniciada!'); }
                } else {
                  zoneWallLookFix();
                  updateGame(dt);
                }
                if (running) animateAll(dt);
              }
              updateTracers(raw);
              updateFx(raw);
              for (const k of pickups) if (!k.m) continue;
              updateCam(raw);
              renderer.render(scene, camera);
              hud();
              if ((mini++) % 3 === 0) drawMini();
            } else {
              renderPreview(raw);
            }
            requestAnimationFrame(loop);
          }
          loop.lastN = -1;
          function zoneWallLookFix() {}
          function updateFx(dt) {
            if (!P) return;
            P.flash = Math.max(0, P.flash - dt);
          }
          requestAnimationFrame(loop);
          </script>
          </body>
          </html>
          EOF
          curl -fsSL -o www/three.min.js https://unpkg.com/three@0.128.0/build/three.min.js

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init BattleRoyale com.ejemplo.battleroyale --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Pantalla completa horizontal
        run: |
          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'\s*android:screenOrientation="[^"]*"', '', s)
          s = s.replace('android:name=".MainActivity"',
                        'android:name=".MainActivity" android:screenOrientation="sensorLandscape"', 1)
          p.write_text(s)
          PY
          mkdir -p android/app/src/main/java/com/ejemplo/battleroyale
          cat > android/app/src/main/java/com/ejemplo/battleroyale/MainActivity.java << 'EOF'
          package com.ejemplo.battleroyale;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
            }
          }
          EOF

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-royale-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
