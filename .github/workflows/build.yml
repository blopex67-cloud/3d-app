          // ================= PERSONAJE DETALLADO =================
          function buildChar(s) {
            const anim = s.type === 'anim';
            const g = new THREE.Group(), body = new THREE.Group();
            body.scale.setScalar(1.5); g.add(body);
            const B = (p, w, h, d, m, x, y, z) => box(p, w, h, d, m, x, y, z);

            const pantsM = anim ? FUR(s.pants) : (s.camo ? mat(0xffffff, TX.camo) : F(s.pants));
            const shirtM = anim ? FUR(s.body) : (s.camo ? mat(0xffffff, TX.camo) : F(s.shirt));
            const vestM = anim ? FUR(s.dark) : F(s.vest);
