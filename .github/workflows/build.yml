name: EL ALMACÉN - Juego de terror (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar three.js (para que funcione sin internet en el APK)
        run: |
          mkdir -p /tmp/t site/lib/three/build site/lib/three/examples/jsm/loaders site/lib/three/examples/jsm/utils
          cd /tmp/t && npm init -y >/dev/null && npm install three@0.160.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          cp /tmp/t/node_modules/three/build/three.module.js site/lib/three/build/
          cp /tmp/t/node_modules/three/examples/jsm/loaders/GLTFLoader.js site/lib/three/examples/jsm/loaders/
          cp /tmp/t/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js site/lib/three/examples/jsm/utils/

      - name: Crear sonidos (FNaF 2) incluidos en este archivo
