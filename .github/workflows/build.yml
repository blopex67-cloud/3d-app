              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-40, 35, 0)
              sun.shadow_enabled = true
              lobby_root.add_child(sun)
              _box(lobby_root, Vector3(6, 0.2, 6), Vector3(0, -0.1, 0), _m(Color(0.3, 0.33, 0.32), 0.7, 0.0, true))
              var lc := Camera3D.new()
              lc.fov = 42.0
              lc.position = Vector3(0, 1.5, 5.2)
              lobby_root.add_child(lc)
              lc.current = true
              lc.look_at(Vector3(0, 1.15, 0), Vector3.UP)
