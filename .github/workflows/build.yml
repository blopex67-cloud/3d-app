name: EL ALMACÉN - Juego de terror (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar three.js (para que funcione sin internet en el APK)
        run: |
          mkdir -p /tmp/t site/lib/three/build site/lib/three/examples/jsm/loaders site/lib/three/examples/jsm/utils
          cd /tmp/t && npm init -y >/dev/null && npm install three@0.160.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          cp /tmp/t/node_modules/three/build/three.module.js site/lib/three/build/
          cp /tmp/t/node_modules/three/examples/jsm/loaders/GLTFLoader.js site/lib/three/examples/jsm/loaders/
          cp /tmp/t/node_modules/three/examples/jsm/utils/BufferGeometryUtils.js site/lib/three/examples/jsm/utils/

      - name: Generar el juego
        run: |
          mkdir -p site
          if [ -d assets ]; then cp -r assets site/; fi
          cat > site/index.html << 'HTML_EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>EL ALMACÉN - Terror en primera persona</title>
          <style>
            *{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
            html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#e8e6f0;user-select:none;-webkit-user-select:none;touch-action:none}
            #c{position:fixed;inset:0;width:100%;height:100%;display:block}
            .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at center,rgba(20,8,30,.80),rgba(0,0,0,.98));z-index:10;transition:opacity .4s;overflow-y:auto}
            .screen.hidden{opacity:0;pointer-events:none}
            h1{font-size:clamp(34px,7vw,76px);letter-spacing:6px;margin:0 0 6px;color:#ff3b5c;text-shadow:0 0 18px #ff3b5c99;font-weight:800}
            h2{letter-spacing:4px;color:#ff3b5c;margin:0 0 18px}
            .sub{opacity:.6;margin-bottom:36px;letter-spacing:3px;font-size:13px}
            .btn{background:linear-gradient(180deg,#2a1830,#120818);border:1px solid #ff3b5c66;color:#fff;padding:14px 36px;margin:7px;font-size:17px;letter-spacing:2px;border-radius:10px;cursor:pointer;min-width:260px;transition:all .2s;font-family:inherit}
            .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 22px #ff3b5c88;border-color:#ff3b5c}
            .btn:disabled{opacity:.35;cursor:not-allowed}
            .btn.sec{border-color:#ffffff33;background:linear-gradient(180deg,#1b1b24,#0c0c12)}
            .btn.sel{border-color:#ffd166;box-shadow:0 0 16px #ffd16688}
            .diffs{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
            .diffs .btn{min-width:150px;font-size:14px;padding:12px 18px}
            .help{max-width:640px;line-height:1.7;font-size:16px;opacity:.9;margin-bottom:24px;text-align:left}
            .help b{color:#ffd166}
            .stats{margin:8px 0 26px;font-size:18px;opacity:.85}
            #hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
            .panel{position:absolute;background:rgba(0,0,0,.55);border:1px solid #ffffff22;border-radius:10px;padding:10px 14px;backdrop-filter:blur(3px);font-size:14px;letter-spacing:1px}
            .bar{height:10px;width:200px;background:#222;border-radius:5px;overflow:hidden;margin-top:6px}
            .bar>div{height:100%;transition:width .15s}
            #msg{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:10px 22px;border-radius:8px;font-size:17px;letter-spacing:1px;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none;white-space:nowrap}
            #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.92));z-index:4;display:none}
            #danger{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,40,.55));opacity:0;z-index:4}
            #flash{position:fixed;inset:0;pointer-events:none;background:#ff1030;opacity:0;z-index:9;transition:opacity 1.2s}
            @media (max-width:700px){.panel{font-size:12px}.bar{width:130px}#msg{white-space:normal;width:90%;text-align:center}}

            /* ---- Controles táctiles ---- */
            body.touch .kb{display:none}
            body.touch .bl{bottom:auto;top:84px;width:200px!important}
            body.touch #msg{bottom:auto;top:16px}
            #tc{position:fixed;inset:0;z-index:7;display:none;touch-action:none}
            #lookZone{position:absolute;top:0;bottom:0;left:40%;right:0;touch-action:none}
            #joyZone{position:absolute;left:0;bottom:0;width:40%;height:65%;touch-action:none}
            #joyBase{position:absolute;left:40px;bottom:40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:none}
            #knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,59,92,.55);pointer-events:none}
            .tbtn{position:absolute;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:12px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;touch-action:none}
            #btnRun{right:28px;bottom:28px}
            #btnFlash{right:28px;bottom:116px}
            #btnPause{right:16px;top:16px;width:50px;height:50px;font-size:16px}
          </style>
          </head>
          <body>
          <canvas id="c"></canvas>
          <div id="vig"></div>
          <div id="danger"></div>
          <div id="flash"></div>

          <div id="hud">
            <div class="panel" style="top:16px;left:16px">
              <div id="keysTxt">LLAVES 0/3</div>
              <div id="timer" style="font-size:13px;opacity:.7;margin-top:4px">00:00</div>
            </div>
            <div class="panel bl" style="bottom:16px;left:16px;width:240px">
              <div>LINTERNA <span id="batPct"></span></div>
              <div class="bar"><div id="batBar" style="background:#ffd166;width:100%"></div></div>
              <div style="margin-top:10px">RESISTENCIA</div>
              <div class="bar"><div id="stBar" style="background:#06d6a0;width:100%"></div></div>
            </div>
            <div class="panel kb" style="bottom:16px;right:16px;font-size:13px;opacity:.8;line-height:1.8">
              <b>WASD</b> mover &nbsp;·&nbsp; <b>Ratón</b> mirar &nbsp;·&nbsp; <b>Shift</b> correr<br>
              <b>F</b> linterna &nbsp;·&nbsp; <b>Esc</b> pausa
            </div>
          </div>
          <div id="msg"></div>

          <div id="tc">
            <div id="lookZone"></div>
            <div id="joyZone"></div>
            <div id="joyBase"><div id="knob"></div></div>
            <div class="tbtn" id="btnFlash">LUZ</div>
            <div class="tbtn" id="btnRun">CORRER</div>
            <div class="tbtn" id="btnPause">II</div>
          </div>

          <div id="menu" class="screen">
            <h1>EL ALMACÉN</h1>
            <div class="sub">SILENCIO · OSCURIDAD · UNA COSA QUE NO SE DETIENE</div>
            <div style="font-size:14px;opacity:.8;margin-bottom:10px">DIFICULTAD</div>
            <div class="diffs">
              <button class="btn" data-d="facil">FÁCIL</button>
              <button class="btn sel" data-d="normal">NORMAL</button>
              <button class="btn" data-d="dificil">DIFÍCIL</button>
            </div>
            <button class="btn" id="playBtn" disabled>JUGAR</button>
            <button class="btn sec" id="helpBtn">CÓMO JUGAR</button>
            <div id="loadTxt" style="margin-top:14px;font-size:13px;opacity:.6">Cargando modelo...</div>
          </div>

          <div id="help" class="screen hidden">
            <h2>CÓMO JUGAR</h2>
            <div class="help">
              Estás atrapado en un almacén oscuro y laberíntico. Tienes que encontrar <b>3 llaves</b> dispersas por el lugar y llegar a la <b>puerta verde</b> para escapar.<br><br>
              Un robot de peluche te persigue. Es <b>lento</b>, pero nunca se detiene y no pierde tu rastro. Si la alcanza, es el final.<br><br>
              La <b>linterna</b> la aturde si la iluminas de frente, pero gasta batería. Puedes <b>correr</b>, aunque la resistencia se agota.<br><br>
              <b>Móvil:</b> joystick a la izquierda para moverte, desliza a la derecha para mirar, botones LUZ y CORRER.<br>
              <b>PC:</b> WASD, ratón, Shift y F.<br><br>
              <b>Consejo:</b> escucha el latido. Cuanto más cerca esté, más rápido late.
            </div>
            <button class="btn sec" id="helpBack">VOLVER</button>
          </div>

          <div id="pause" class="screen hidden">
            <h2>PAUSA</h2>
            <button class="btn" id="resumeBtn">CONTINUAR</button>
            <button class="btn sec" id="pauseRestart">REINICIAR</button>
            <button class="btn sec" id="pauseMenu">MENÚ PRINCIPAL</button>
          </div>

          <div id="gameover" class="screen hidden">
            <h1 style="color:#ff1030">TE ATRAPÓ</h1>
            <div class="stats" id="goStats"></div>
            <button class="btn" id="retryBtn">REINTENTAR</button>
            <button class="btn sec" id="goMenu">MENÚ PRINCIPAL</button>
          </div>

          <div id="win" class="screen hidden">
            <h1 style="color:#06d6a0;text-shadow:0 0 18px #06d6a099">ESCAPASTE</h1>
            <div class="stats" id="winStats"></div>
            <button class="btn" id="winAgain">JUGAR DE NUEVO</button>
            <button class="btn sec" id="winMenu">MENÚ PRINCIPAL</button>
          </div>

          <script type="importmap">
          {
            "imports": {
              "three": "./lib/three/build/three.module.js",
              "three/addons/": "./lib/three/examples/jsm/"
            }
          }
          </script>

          <script type="module">
          import * as THREE from 'three';
          import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

          const $ = id => document.getElementById(id);
          const CELL = 4, WALL_H = 3.5, GRID = 21, EYE = 1.6, PLAYER_R = 0.3;
          const FACE_OFFSET = 0; // si el modelo mira hacia atrás, cambia a Math.PI
          const DIFF = {
            facil:   { speed: 1.0, delay: 14 },
            normal:  { speed: 1.5, delay: 8 },
            dificil: { speed: 2.0, delay: 4 }
          };

          const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
          if (IS_TOUCH) document.body.classList.add('touch');
          document.addEventListener('contextmenu', e => e.preventDefault());
          const joy = { x: 0, y: 0 };
          let runHeld = false;

          let diff = 'normal', state = 'menu';
          let grid, keys = [], keyMeshes = [], exitCell, exitMesh;
          let keysGot = 0, battery = 100, stamina = 100, flashOn = true, elapsed = 0;
          let flickerT = 0, heartT = 0, worldGroup = null;
          const input = {};
          const player = { x: CELL, z: CELL, yaw: 0, pitch: 0 };
          const bonnie = { x: 0, z: 0, heading: 0, path: [], timer: 0, active: false, ready: false, delay: 8, stun: 0, group: new THREE.Group() };

          function lock() { if (!IS_TOUCH) $('c').requestPointerLock(); }
          function setTC(on) { $('tc').style.display = (IS_TOUCH && on) ? 'block' : 'none'; }

          // ---------- Renderer / escena ----------
          const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          renderer.setSize(innerWidth, innerHeight);
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x030305);
          scene.fog = new THREE.Fog(0x030305, 3, 24);
          const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 100);
          scene.add(camera);

          const torch = new THREE.SpotLight(0xfff1d6, 80, 28, 0.42, 0.5, 2);
          torch.target.position.set(0, 0, -5);
          camera.add(torch); camera.add(torch.target);

          scene.add(new THREE.HemisphereLight(0x3a3450, 0x0a0806, 0.6));
          const lamp = new THREE.PointLight(0xff9966, 4, 9, 2); scene.add(lamp);
          const bonnieLight = new THREE.PointLight(0x8a5cff, 6, 7, 2); scene.add(bonnieLight);
          scene.add(bonnie.group);

          // ---------- Laberinto ----------
          function generateMaze(n) {
            const g = Array.from({ length: n }, () => Array(n).fill(1));
            const stack = [[1, 1]]; g[1][1] = 0;
            const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]];
            while (stack.length) {
              const [x, y] = stack[stack.length - 1];
              const opts = dirs.filter(([dx, dy]) => {
                const nx = x + dx, ny = y + dy;
                return nx > 0 && ny > 0 && nx < n - 1 && ny < n - 1 && g[ny][nx] === 1;
              });
              if (!opts.length) { stack.pop(); continue; }
              const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
              g[y + dy / 2][x + dx / 2] = 0;
              g[y + dy][x + dx] = 0;
              stack.push([x + dx, y + dy]);
            }
            // abrir atajos para que la persecución sea más interesante
            for (let i = 0; i < 70; i++) {
              const r = 1 + Math.floor(Math.random() * (n - 2));
              const c = 1 + Math.floor(Math.random() * (n - 2));
              if (g[r][c] === 1 && ((g[r - 1][c] === 0 && g[r + 1][c] === 0) || (g[r][c - 1] === 0 && g[r][c + 1] === 0))) g[r][c] = 0;
            }
            return g;
          }

          const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
          const wallMat = new THREE.MeshStandardMaterial({ color: 0x3b3a44, roughness: 0.9 });
          const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2620, roughness: 1 });
          const ceilMat = new THREE.MeshStandardMaterial({ color: 0x17161c, roughness: 1 });
          const keyGeo = new THREE.TorusGeometry(0.25, 0.08, 8, 16);
          const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffaa00, emissiveIntensity: 0.8 });

          function buildWorld() {
            if (worldGroup) scene.remove(worldGroup);
            worldGroup = new THREE.Group(); scene.add(worldGroup);
            const size = GRID * CELL, half = (GRID - 1) * CELL / 2;

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(size + CELL, size + CELL), floorMat);
            floor.rotation.x = -Math.PI / 2; floor.position.set(half, 0, half); worldGroup.add(floor);
            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(size + CELL, size + CELL), ceilMat);
            ceil.rotation.x = Math.PI / 2; ceil.position.set(half, WALL_H, half); worldGroup.add(ceil);

            for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) {
              if (grid[r][c] === 1) {
                const w = new THREE.Mesh(wallGeo, wallMat);
                w.position.set(c * CELL, WALL_H / 2, r * CELL);
                worldGroup.add(w);
              }
            }

            exitMesh = new THREE.Mesh(
              new THREE.BoxGeometry(CELL * 0.7, WALL_H * 0.85, 0.3),
              new THREE.MeshStandardMaterial({ color: 0x06d6a0, emissive: 0x06d6a0, emissiveIntensity: 0.5 })
            );
            exitMesh.position.set(exitCell[0] * CELL, WALL_H * 0.42, exitCell[1] * CELL);
            worldGroup.add(exitMesh);

            keyMeshes = keys.map(([c, r]) => {
              const k = new THREE.Mesh(keyGeo, keyMat);
              k.position.set(c * CELL, 1.1, r * CELL);
              worldGroup.add(k);
              return k;
            });
          }

          // ---------- Colisiones ----------
          function isWall(x, z) {
            const c = Math.round(x / CELL), r = Math.round(z / CELL);
            if (c < 0 || r < 0 || c >= GRID || r >= GRID) return true;
            return grid[r][c] === 1;
          }
          function blocked(x, z) {
            return isWall(x - PLAYER_R, z - PLAYER_R) || isWall(x + PLAYER_R, z - PLAYER_R) ||
                   isWall(x - PLAYER_R, z + PLAYER_R) || isWall(x + PLAYER_R, z + PLAYER_R);
          }

          // ---------- Partida ----------
          function newGame() {
            grid = generateMaze(GRID);
            exitCell = [GRID - 2, GRID - 2];
            grid[exitCell[1]][exitCell[0]] = 0;
            const floors = [];
            for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) if (grid[r][c] === 0) floors.push([c, r]);
            const shuffled = floors.slice().sort(() => Math.random() - 0.5);
            keys = shuffled.filter(([c, r]) => Math.hypot(c - 1, r - 1) > 6 && !(c === exitCell[0] && r === exitCell[1])).slice(0, 3);
            keysGot = 0; battery = 100; stamina = 100; elapsed = 0; flashOn = true;

            player.x = CELL; player.z = CELL; player.yaw = 0; player.pitch = 0;

            const far = floors.filter(([c, r]) => Math.hypot(c - 1, r - 1) > GRID * 0.6);
            const [bc, br] = far[Math.floor(Math.random() * far.length)];
            bonnie.x = bc * CELL; bonnie.z = br * CELL; bonnie.path = []; bonnie.timer = 0;
            bonnie.active = false; bonnie.delay = DIFF[diff].delay; bonnie.stun = 0;

            buildWorld();
          }

          function startGame() {
            initAudio();
            newGame();
            show(null);
            $('hud').style.display = 'block';
            $('vig').style.display = 'block';
            $('flash').style.opacity = 0;
            state = 'playing';
            setTC(true);
            lock();
            say('Encuentra 3 llaves y escapa por la puerta verde.', 4000);
          }

          function pause() { state = 'paused'; setTC(false); show('pause'); document.exitPointerLock(); }
          function resume() { state = 'playing'; show(null); setTC(true); lock(); }
          function toMenu() {
            state = 'menu'; show('menu'); setTC(false);
            $('hud').style.display = 'none'; $('vig').style.display = 'none';
            newGame();
          }
          function endGame(type) {
            state = type;
            setTC(false);
            document.exitPointerLock();
            $('hud').style.display = 'none';
            if (type === 'won') { $('winStats').textContent = `Tiempo: ${fmt(elapsed)} · Llaves: 3/3`; show('win'); }
            else { $('goStats').textContent = `Sobreviviste ${fmt(elapsed)} · Llaves: ${keysGot}/3`; show('gameover'); }
          }

          function show(id) {
            ['menu', 'help', 'pause', 'gameover', 'win'].forEach(s => $(s).classList.toggle('hidden', s !== id));
          }

          let msgTO = null;
          function say(t, ms = 2600) {
            const m = $('msg'); m.textContent = t; m.style.opacity = 1;
            clearTimeout(msgTO); msgTO = setTimeout(() => m.style.opacity = 0, ms);
          }
          const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

          function toggleFlash() {
            if (state !== 'playing') return;
            flashOn = !flashOn;
            torch.visible = flashOn && battery > 0;
          }

          // ---------- Movimiento del jugador ----------
          function movePlayer(dt) {
            const w = input.KeyW || input.ArrowUp, s = input.KeyS || input.ArrowDown;
            const a = input.KeyA || input.ArrowLeft, d = input.KeyD || input.ArrowRight;
            let fwd = (w ? 1 : 0) - (s ? 1 : 0) - joy.y;
            let strafe = (d ? 1 : 0) - (a ? 1 : 0) + joy.x;
            fwd = Math.max(-1, Math.min(1, fwd));
            strafe = Math.max(-1, Math.min(1, strafe));
            const mag = Math.min(1, Math.hypot(fwd, strafe));
            const moving = mag > 0.12;
            const sprint = (input.ShiftLeft || input.ShiftRight || runHeld) && moving && stamina > 0;
            if (sprint) stamina = Math.max(0, stamina - 24 * dt);
            else stamina = Math.min(100, stamina + 15 * dt);
            if (!moving) return;

            let fx = -Math.sin(player.yaw) * fwd + Math.cos(player.yaw) * strafe;
            let fz = -Math.cos(player.yaw) * fwd - Math.sin(player.yaw) * strafe;
            const len = Math.hypot(fx, fz) || 1; fx /= len; fz /= len;
            const step = (sprint ? 4.4 : 2.7) * dt * mag;

            const nx = player.x + fx * step; if (!blocked(nx, player.z)) player.x = nx;
            const nz = player.z + fz * step; if (!blocked(player.x, nz)) player.z = nz;
          }

          // ---------- Bonnie (IA) ----------
          function bfsPath(sc, sr, tc, tr) {
            const key = (c, r) => r * GRID + c;
            const prev = new Map(); prev.set(key(sc, sr), null);
            const q = [[sc, sr]];
            while (q.length) {
              const [c, r] = q.shift();
              if (c === tc && r === tr) break;
              for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                const nc = c + dc, nr = r + dr;
                if (nc < 0 || nr < 0 || nc >= GRID || nr >= GRID || grid[nr][nc] === 1 || prev.has(key(nc, nr))) continue;
                prev.set(key(nc, nr), [c, r]);
                q.push([nc, nr]);
              }
            }
            if (!prev.has(key(tc, tr))) return null;
            const path = []; let cur = [tc, tr];
            while (cur && !(cur[0] === sc && cur[1] === sr)) { path.push(cur); cur = prev.get(key(cur[0], cur[1])); }
            return path.reverse();
          }

          function bonnieUpdate(dt) {
            if (!bonnie.ready) return;
            bonnie.delay -= dt;
            if (bonnie.delay > 0) return;
            if (!bonnie.active) { bonnie.active = true; say('Algo te está buscando. Corre.', 3500); }

            bonnie.timer -= dt;
            if (bonnie.timer <= 0) {
              bonnie.timer = 0.4;
              const bc = Math.round(bonnie.x / CELL), br = Math.round(bonnie.z / CELL);
              const pc = Math.round(player.x / CELL), pr = Math.round(player.z / CELL);
              bonnie.path = bfsPath(bc, br, pc, pr) || [];
            }

            // la linterna la aturde si la iluminas de frente
            bonnie.stun = Math.max(0, bonnie.stun - dt);
            if (flashOn && battery > 0) {
              const dx = bonnie.x - player.x, dz = bonnie.z - player.z, d = Math.hypot(dx, dz);
              if (d < 14 && d > 0.01) {
                const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
                const dot = (-dx * fx - dz * fz) / d;
                if (dot > 0.92) bonnie.stun = 0.35;
              }
            }
            let speed = DIFF[diff].speed;
            if (bonnie.stun > 0) speed *= 0.25;

            let tx = player.x, tz = player.z;
            if (bonnie.path.length) { const [c, r] = bonnie.path[0]; tx = c * CELL; tz = r * CELL; }
            const dx = tx - bonnie.x, dz = tz - bonnie.z, dist = Math.hypot(dx, dz);
            if (dist < 0.2 && bonnie.path.length) bonnie.path.shift();
            else if (dist > 0.001) {
              const s = Math.min(speed * dt, dist);
              bonnie.x += dx / dist * s; bonnie.z += dz / dist * s;
              bonnie.heading = Math.atan2(dx, dz) + FACE_OFFSET;
            }

            if (Math.hypot(player.x - bonnie.x, player.z - bonnie.z) < 1.0) caught();
          }

          function caught() {
            state = 'caught';
            setTC(false);
            sfxScare();
            $('flash').style.opacity = 1;
            const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
            bonnie.x = player.x + fx * 0.9; bonnie.z = player.z + fz * 0.9;
            bonnie.heading = Math.atan2(-fx, -fz) + FACE_OFFSET;
            setTimeout(() => endGame('gameover'), 1600);
          }

          // ---------- Audio (WebAudio, sin archivos) ----------
          let actx = null, noiseBuf = null;
          function initAudio() {
            if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
            actx = new (window.AudioContext || window.webkitAudioContext)();
            const d = actx.createOscillator(); d.type = 'sawtooth'; d.frequency.value = 41;
            const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160;
            const g = actx.createGain(); g.gain.value = 0.06;
            d.connect(lp); lp.connect(g); g.connect(actx.destination); d.start();
            noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          }
          function tone(freq, vol, dur, type = 'sine') {
            if (!actx) return;
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, actx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + dur + 0.05);
          }
          function heartbeat() { tone(55, 0.5, 0.18); setTimeout(() => tone(48, 0.35, 0.15), 220); }
          function sfxKey() { tone(880, 0.2, 0.3); setTimeout(() => tone(1320, 0.15, 0.3), 90); }
          function sfxScare() {
            if (!actx) return;
            const s = actx.createBufferSource(); s.buffer = noiseBuf;
            const g = actx.createGain();
            g.gain.setValueAtTime(1, actx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 1.2);
            s.connect(g); g.connect(actx.destination); s.start(); s.stop(actx.currentTime + 1.2);
            tone(90, 0.8, 1, 'sawtooth');
          }

          // ---------- Entrada: teclado y ratón ----------
          addEventListener('keydown', e => {
            input[e.code] = true;
            if (e.repeat) return;
            if (e.code === 'KeyF') toggleFlash();
            if (e.code === 'Escape' && state === 'paused') resume();
          });
          addEventListener('keyup', e => input[e.code] = false);
          document.addEventListener('mousemove', e => {
            if (state !== 'playing' || document.pointerLockElement !== $('c')) return;
            player.yaw -= e.movementX * 0.0022;
            player.pitch -= e.movementY * 0.0022;
            player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
          });
          $('c').addEventListener('click', () => {
            if (state === 'playing' && !document.pointerLockElement) lock();
          });
          document.addEventListener('pointerlockchange', () => {
            if (!IS_TOUCH && !document.pointerLockElement && state === 'playing') pause();
          });

          // ---------- Entrada: táctil ----------
          const JR = 45;
          let jId = null, jcx = 0, jcy = 0;
          function jset(t) {
            let dx = t.clientX - jcx, dy = t.clientY - jcy;
            const d = Math.hypot(dx, dy);
            if (d > JR) { dx = dx / d * JR; dy = dy / d * JR; }
            joy.x = dx / JR; joy.y = dy / JR;
            $('knob').style.transform = `translate(${dx}px,${dy}px)`;
          }
          function jend() { jId = null; joy.x = 0; joy.y = 0; $('knob').style.transform = 'translate(0,0)'; }
          const jz = $('joyZone');
          jz.addEventListener('touchstart', e => {
            e.preventDefault();
            if (jId !== null) return;
            const t = e.changedTouches[0]; jId = t.identifier;
            const r = $('joyBase').getBoundingClientRect();
            jcx = r.left + r.width / 2; jcy = r.top + r.height / 2;
            jset(t);
          }, { passive: false });
          jz.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) if (t.identifier === jId) jset(t);
          }, { passive: false });
          ['touchend', 'touchcancel'].forEach(n => jz.addEventListener(n, e => {
            for (const t of e.changedTouches) if (t.identifier === jId) jend();
          }));

          let lId = null, lx = 0, ly = 0;
          const lz = $('lookZone');
          lz.addEventListener('touchstart', e => {
            e.preventDefault();
            if (lId !== null) return;
            const t = e.changedTouches[0]; lId = t.identifier; lx = t.clientX; ly = t.clientY;
          }, { passive: false });
          lz.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) if (t.identifier === lId) {
              if (state === 'playing') {
                player.yaw -= (t.clientX - lx) * 0.0055;
                player.pitch -= (t.clientY - ly) * 0.0055;
                player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
              }
              lx = t.clientX; ly = t.clientY;
            }
          }, { passive: false });
          ['touchend', 'touchcancel'].forEach(n => lz.addEventListener(n, e => {
            for (const t of e.changedTouches) if (t.identifier === lId) lId = null;
          }));

          function bindBtn(id, down, up) {
            const el = $(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, { passive: false });
            ['touchend', 'touchcancel'].forEach(n => el.addEventListener(n, e => { e.preventDefault(); if (up) up(); }, { passive: false }));
          }
          bindBtn('btnRun', () => { runHeld = true; }, () => { runHeld = false; });
          bindBtn('btnFlash', toggleFlash);
          bindBtn('btnPause', () => { if (state === 'playing') pause(); });

          // ---------- Menús ----------
          $('playBtn').onclick = startGame;
          $('helpBtn').onclick = () => show('help');
          $('helpBack').onclick = () => show('menu');
          document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
            diff = b.dataset.d;
            document.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('sel', x === b));
          });
          $('resumeBtn').onclick = resume;
          $('pauseRestart').onclick = startGame;
          $('pauseMenu').onclick = toMenu;
          $('retryBtn').onclick = startGame;
          $('goMenu').onclick = toMenu;
          $('winAgain').onclick = startGame;
          $('winMenu').onclick = toMenu;

          // ---------- Modelo de Bonnie ----------
          function fitModel(m) {
            m.scale.setScalar(1);
            m.updateMatrixWorld(true);
            let box = new THREE.Box3().setFromObject(m);
            const size = box.getSize(new THREE.Vector3());
            m.scale.setScalar(2.3 / Math.max(size.y, 0.001));
            m.updateMatrixWorld(true);
            box = new THREE.Box3().setFromObject(m);
            const c = box.getCenter(new THREE.Vector3());
            m.position.set(-c.x, -box.min.y, -c.z);
          }

          function makeFallbackBonnie() {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x5b3aa8, roughness: 0.6 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 1.5, 12), mat);
            body.position.y = 0.9; g.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), mat);
            head.position.y = 1.9; g.add(head);
            for (const x of [-0.2, 0.2]) {
              const ear = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1, 0.12), mat);
              ear.position.set(x, 2.9, 0); g.add(ear);
            }
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
            for (const x of [-0.16, 0.16]) {
              const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
              eye.position.set(x, 1.95, 0.42); g.add(eye);
            }
            return g;
          }

          function bonnieReady() {
            bonnie.ready = true;
            $('playBtn').disabled = false;
            $('loadTxt').textContent = 'Listo';
          }

          new GLTFLoader().load(
            'assets/fnaf_ar_toy_bonnie.glb',
            gltf => {
              const m = gltf.scene;
              m.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
              fitModel(m);
              bonnie.group.add(m);
              bonnieReady();
            },
            undefined,
            () => {
              bonnie.group.add(makeFallbackBonnie());
              $('loadTxt').textContent = 'Modelo no encontrado: usando versión de respaldo';
              bonnieReady();
            }
          );

          // ---------- Bucle principal ----------
          function update(dt) {
            const t = performance.now() / 1000;

            flickerT -= dt;
            if (flickerT <= 0) { lamp.intensity = Math.random() < 0.15 ? 0 : 4; flickerT = 0.05 + Math.random() * 0.5; }

            if (state === 'menu') player.yaw += dt * 0.08;

            if (state === 'playing') {
              elapsed += dt;
              movePlayer(dt);
              bonnieUpdate(dt);

              if (battery > 0 && flashOn) battery = Math.max(0, battery - 1.6 * dt);
              torch.visible = flashOn && battery > 0;

              for (let i = 0; i < keys.length; i++) {
                if (keyMeshes[i].visible && Math.hypot(player.x - keys[i][0] * CELL, player.z - keys[i][1] * CELL) < 1.8) {
                  keyMeshes[i].visible = false; keysGot++; sfxKey();
                  say(`Llave ${keysGot}/3 encontrada`);
                }
              }

              const ex = exitCell[0] * CELL, ez = exitCell[1] * CELL;
              if (Math.hypot(player.x - ex, player.z - ez) < 2) {
                if (keysGot >= 3) { endGame('won'); }
                else say('La puerta está cerrada. Necesitas 3 llaves.', 1800);
              }

              const dist = Math.hypot(player.x - bonnie.x, player.z - bonnie.z);
              if (bonnie.active && dist < 12 && actx) {
                heartT -= dt;
                if (heartT <= 0) { heartbeat(); heartT = Math.max(0.4, dist / 22); }
              }

              $('keysTxt').textContent = `LLAVES ${keysGot}/3`;
              $('timer').textContent = fmt(elapsed);
              $('batBar').style.width = battery + '%';
              $('batPct').textContent = Math.round(battery) + '%';
              $('stBar').style.width = stamina + '%';
              $('stBar').style.background = stamina < 25 ? '#ef476f' : '#06d6a0';
              $('danger').style.opacity = bonnie.active ? Math.max(0, 1 - dist / 9) * 0.9 : 0;
            }

            if (state === 'caught') {
              camera.position.x += (Math.random() - 0.5) * 0.25;
              camera.position.y += (Math.random() - 0.5) * 0.25;
            }

            if (state !== 'caught') {
              camera.position.set(player.x, EYE, player.z);
            }
            camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

            lamp.position.set(player.x, 2.6, player.z);
            bonnie.group.position.set(bonnie.x, 0, bonnie.z);
            bonnie.group.rotation.y = bonnie.heading;
            bonnieLight.position.set(bonnie.x, 1.8, bonnie.z);
            bonnieLight.intensity = bonnie.active ? 6 + Math.sin(t * 6) * 1.5 : 1.5;

            keyMeshes.forEach(k => { if (k.visible) k.rotation.y += dt * 2; });
            if (exitMesh) exitMesh.material.emissiveIntensity = 0.4 + 0.3 * Math.sin(t * 3);
          }

          addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
          });

          const clock = new THREE.Clock();
          function loop() {
            const dt = Math.min(clock.getDelta(), 0.05);
            update(dt);
            renderer.render(scene, camera);
            requestAnimationFrame(loop);
          }

          newGame();
          loop();
          </script>
          </body>
          </html>
          HTML_EOF

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar el juego para el APK
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el juego
        uses: actions/download-artifact@v4
        with:
          name: site
          path: www

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "El Almacen" com.elalmacen.juego --web-dir=www
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowFullscreen">true</item>#' "$S"

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Almacen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
